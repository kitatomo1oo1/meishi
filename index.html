<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="名刺">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>デジタル名刺</title>
<style>
:root{
  --ink:#1c1c1e; --sub:#6b6b70; --line:#e4e2dd; --bg:#ffffff; --paper:#faf9f6;
  --accent:#1f2a44; --danger:#b3261e;
  --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --sans:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 80px)}
.wrap{max-width:480px;margin:0 auto;padding:20px 18px}
h2{font-family:var(--serif);font-weight:600;font-size:19px;margin:28px 0 12px;letter-spacing:.04em}
p.note{color:var(--sub);font-size:14px;line-height:1.7;margin:6px 0 14px}
a{color:inherit}
button,.btn{font:inherit;border:0;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:600;cursor:pointer;display:block;width:100%;text-align:center;text-decoration:none}
.btn-main{background:var(--accent-ink,var(--accent));color:#fff}
.btn-sub{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn-danger{background:#fff;color:var(--danger);border:1px solid #e8c5c2}
.row{display:flex;gap:10px}.row>*{flex:1}
.stack>*+*{margin-top:10px}

/* 名刺 */
.card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:26px 24px 22px;aspect-ratio:1.75/1;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 10px 30px -18px rgba(0,0,0,.35);overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}
.card .label-row{display:flex;align-items:center;gap:10px}
.card .logo{width:28px;height:28px;flex:none}
.card .label{font-size:12px;letter-spacing:.18em;color:var(--accent-ink,var(--accent));font-weight:700}
.card .name{font-family:var(--serif);font-size:28px;letter-spacing:.08em;line-height:1.2}
.card .kana{font-size:12px;color:var(--sub);letter-spacing:.12em;margin-top:4px}
.card .org{font-size:13px;line-height:1.6}
.card .org .title{color:var(--sub)}
.contact-list{margin:18px 0 0;border-top:1px solid var(--line)}
.contact-list a{display:flex;justify-content:space-between;align-items:center;padding:15px 4px;border-bottom:1px solid var(--line);text-decoration:none;font-size:15px}
.contact-list a span:first-child{color:var(--sub);font-size:13px;width:76px;flex:none}
.contact-list a span:last-child{flex:1;text-align:right;word-break:break-all}
.sections{margin-top:6px}
.sec{padding:16px 0;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h3{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.05em;margin:0 0 6px;color:var(--accent-ink,var(--accent))}
.sec p{margin:0;font-size:15px;line-height:1.8;white-space:pre-wrap}
.about{font-size:15px;line-height:1.8;margin:16px 0 0;white-space:pre-wrap}

/* フォーム */
label{display:block;font-size:13px;color:var(--sub);margin:14px 0 6px}
label b{color:var(--danger);font-weight:600;margin-left:4px}
input,textarea{font:inherit;font-size:16px;width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.msg{padding:14px;border-radius:10px;font-size:15px;line-height:1.7;margin:14px 0}
.msg.ok{background:#eef5ee;color:#1e4d2b}.msg.ng{background:#fbeeee;color:var(--danger)}.msg.info{background:var(--paper);color:var(--sub);border:1px solid var(--line)}

/* 自分用 */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;width:auto;min-height:40px;padding:9px 14px;font-size:13px;font-weight:600;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--ink)}
.chip.on{background:var(--accent-ink,var(--accent));border-color:var(--accent-ink,var(--accent));color:#fff}
.qrbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center;margin-top:14px}
.qrbox svg{width:100%;max-width:300px;height:auto;display:block;margin:0 auto}
.qrbox .cap{font-family:var(--serif);font-size:17px;margin-top:12px;letter-spacing:.06em}
.qrbox .url{font-size:12px;color:var(--sub);margin-top:6px;word-break:break-all}
.full{position:fixed;inset:0;background:#fff;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.full svg{width:88vmin;height:88vmin}
.full .cap{font-family:var(--serif);font-size:20px;margin-top:18px}
.full .hint{color:var(--sub);font-size:13px;margin-top:8px}

.search{margin-bottom:12px}
.item{display:block;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:14px 4px;font-weight:400}
.item .n{font-family:var(--serif);font-size:17px}
.item .m{font-size:13px;color:var(--sub);margin-top:4px;line-height:1.6}
.empty{color:var(--sub);text-align:center;padding:40px 0;font-size:14px}
.tag{display:inline-block;font-size:12px;padding:2px 7px;border-radius:999px;background:var(--paper);border:1px solid var(--line);margin-left:6px;vertical-align:2px;color:var(--sub)}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:flex;align-items:flex-end}
.sheet .panel{background:#fff;width:100%;max-width:480px;margin:0 auto;border-radius:18px 18px 0 0;max-height:92vh;overflow:auto;padding:20px 18px calc(env(safe-area-inset-bottom) + 24px)}
.sheet .close{width:auto;background:none;color:var(--sub);padding:4px 4px;min-height:44px;min-width:44px;font-weight:500;font-size:14px;margin-left:auto}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);z-index:30}
nav.tabs button{background:none;color:#6b6b70;font-size:12px;font-weight:600;padding:7px 4px 6px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:4px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent-ink,var(--accent))}
nav.tabs button.on svg{stroke-width:2.2}

/* アニメーション */
.fade{animation:fadeUp .55s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.06s}.d2{animation-delay:.12s}.d3{animation-delay:.18s}.d4{animation-delay:.24s}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}

/* 相手の画面：すぐ押せるボタン */
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0 4px}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:84px;padding:12px 6px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);font-size:12px;font-weight:600;text-decoration:none;width:auto}
.act svg{width:24px;height:24px;color:var(--accent-ink,var(--accent))}
.act.primary{background:var(--accent-ink,var(--accent));border-color:var(--accent-ink,var(--accent));color:#fff}
.act.primary svg{color:#fff}
.act:active{transform:scale(.97)}
.intro{font-family:var(--serif);font-size:16px;line-height:1.8;margin:26px 0 2px;letter-spacing:.02em}
details.send{margin-top:26px;border:1px solid var(--line);border-radius:16px;padding:0 18px;background:#fff}
details.send summary{list-style:none;cursor:pointer;padding:18px 0;display:flex;justify-content:space-between;align-items:center;gap:12px}
details.send summary::-webkit-details-marker{display:none}
details.send summary .t{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.04em}
details.send summary .s{display:block;font-size:13px;color:var(--sub);font-family:var(--sans);font-weight:400;margin-top:4px;letter-spacing:0}
details.send summary svg{width:20px;height:20px;color:var(--sub);transition:transform .2s;flex:none}
details.send[open] summary svg{transform:rotate(180deg)}
details.send form{padding-bottom:18px}
.foot{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--sub);font-size:12px;letter-spacing:.12em;margin-top:40px}
.foot svg{width:18px;height:18px}
.promo{margin-top:28px;padding:22px 20px;border-radius:16px;background:var(--paper);border:1px solid var(--line)}
.promo-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.promo-head svg{width:26px;height:26px;flex:none}
.promo h3{margin:0;font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.05em}
.promo p{margin:0 0 16px;font-size:15px;line-height:1.85;white-space:pre-wrap}
.fortune .fres{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0 18px}
.fbox{border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;background:var(--paper)}
.fbox p{font-size:13px;line-height:1.7;margin:6px 0 0;text-align:left}
.fk{font-size:12px;color:var(--sub);letter-spacing:.08em}
.fnum{font-family:var(--serif);font-size:40px;line-height:1.2;color:var(--accent-ink,var(--accent))}
.fname{font-family:var(--serif);font-size:15px;font-weight:600}
.fpair{grid-column:1 / -1;border-top:1px solid var(--line);padding-top:12px}
.fpair p{margin:4px 0 0;font-size:15px;line-height:1.8}
details.fortune{padding-bottom:0}
details.fortune>.msg,details.fortune>label,details.fortune>input{margin-left:0}
.consent{grid-column:1 / -1;border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:6px;background:#fff}
.consent .ct{font-family:var(--serif);font-size:15px;font-weight:600}
.consent p{font-size:13px;line-height:1.7;color:var(--sub);margin:6px 0 12px}
.consent button{padding:12px;font-size:14px}
.ftab{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0 16px}
.ftab td{padding:7px 4px;border-bottom:1px solid var(--line)}
.ftab td:last-child{text-align:right;color:var(--sub);white-space:nowrap}
.ftab .bar{display:inline-block;height:6px;border-radius:3px;background:var(--accent);opacity:.6;margin-right:6px;vertical-align:middle}
.check{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink);margin:14px 0 0}
.check input{width:20px;height:20px;flex:none;accent-color:var(--accent)}
.policy h1{font-family:var(--serif);font-size:24px;font-weight:600;margin:8px 0 16px}
.policy h2{font-size:16px;margin:24px 0 8px}
.policy p{font-size:15px;line-height:1.9;white-space:pre-wrap;margin:0}
.stage{perspective:900px}
.card.live{transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out;transform-style:preserve-3d;will-change:transform}
.card.live::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:
    radial-gradient(circle at var(--gx,50%) var(--gy,30%), rgba(255,255,255,.45), rgba(255,255,255,0) 34%),
    linear-gradient(115deg, rgba(31,42,68,0) 25%, rgba(31,42,68,.07) 40%, rgba(196,160,110,.16) 50%, rgba(31,42,68,.07) 60%, rgba(31,42,68,0) 75%);
  background-size:100% 100%, 260% 100%;
  background-position:0 0, calc(100% - var(--gx,50%)) 0;
  transition:background-position .25s ease-out}
.card.live::before{z-index:1}
.card.live{box-shadow:calc(var(--ry,0deg) / 1deg * -1.2px) calc(14px + var(--rx,0deg) / 1deg * 1.2px) 34px -20px rgba(0,0,0,.45)}
.card.live .sweep{position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(115deg, transparent 38%, rgba(196,160,110,.22) 47%, rgba(255,255,255,.6) 50%, rgba(196,160,110,.22) 53%, transparent 62%);background-size:300% 100%;background-position:120% 0;}
.card.live.shine .sweep{animation:sweep 1.4s .1s cubic-bezier(.5,0,.3,1) forwards}
@keyframes sweep{to{background-position:-20% 0}}
.logo.draw path{stroke-dasharray:100;stroke-dashoffset:100;animation:drawST 1.2s .3s cubic-bezier(.65,0,.25,1) forwards}
.logo.draw path.stem{animation-duration:.45s;animation-delay:1.45s}
@keyframes drawST{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.logo.draw path{animation:none;stroke-dashoffset:0}.card.live .sweep{display:none}.card.live{transform:none}}
#app{transition:opacity .8s ease}
#app.pre{opacity:0}
.opening{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;cursor:pointer}
.opening::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%, color-mix(in srgb, var(--accent) 70%, #fff 8%) 0%, color-mix(in srgb, var(--accent) 80%, #000) 60%, color-mix(in srgb, var(--accent) 45%, #000) 100%);transition:opacity .75s ease}
.opening.out::before{opacity:0}
.opening .big{position:relative;width:172px;height:172px;filter:drop-shadow(0 0 26px rgba(214,178,118,.55)) drop-shadow(0 0 60px rgba(214,178,118,.25));will-change:transform}
.opening .big path{transition:stroke .8s ease}
.opening.out .big path{stroke:#fff}
.opening .big.draw path{animation-duration:1.3s;animation-delay:.3s}
.opening .big.draw path.stem{animation-duration:.45s;animation-delay:1.55s}
.opening .brand{position:relative;color:#e9d6ad;font-size:13px;font-weight:600;letter-spacing:.55em;padding-left:.55em;opacity:0;transform:translateY(6px);animation:brandIn .9s 1.35s ease forwards}
@keyframes brandIn{to{opacity:1;transform:none}}
.opening .fx{position:absolute;left:50%;top:50%;width:0;height:0;margin-top:-22px}
.opening .ring{position:absolute;left:-86px;top:-86px;width:172px;height:172px;border-radius:36px;border:1px solid rgba(233,214,173,.7);opacity:0;animation:ring 1.5s 1.1s cubic-bezier(.2,.7,.2,1) forwards}
.opening .ring.r2{animation-delay:1.3s;border-color:rgba(233,214,173,.4)}
@keyframes ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.4)}}
.opening .spark{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:radial-gradient(circle,#fff 0%,#f1d9a2 45%,rgba(241,217,162,0) 70%);opacity:0;animation:spark 1.2s ease-out forwards}
@keyframes spark{0%{opacity:0;transform:translate(0,0) scale(.3)}25%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.4)}}
.opening.out .brand,.opening.out .fx{opacity:0!important;transition:opacity .35s}
.opening .st-pre{position:relative;width:min(210px,54vw);opacity:0;animation:stPreIn .6s .1s cubic-bezier(.2,.7,.2,1) forwards}
.opening .st-pre svg{display:block;width:100%;height:auto}
.opening .st-pre.bye{animation:stPreOut .4s ease forwards}
@keyframes stPreIn{from{opacity:0;transform:translateY(8px) scale(.97);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes stPreOut{from{opacity:1}to{opacity:0;transform:scale(1.03)}}
.wheel-wrap{display:flex;justify-content:center;margin:18px 0 6px}
.wheel{width:min(320px,86vw);height:auto;display:block;border-radius:50%;box-shadow:0 18px 40px -18px rgba(13,19,34,.7)}
.wheel .wk,.wheel .wrel{font-family:var(--serif)}
.wheel-wrap.landed .wheel{animation:wpulse 1.2s ease-out}
@keyframes wpulse{0%{box-shadow:0 0 0 0 rgba(233,214,173,.55),0 18px 40px -18px rgba(13,19,34,.7)}100%{box-shadow:0 0 0 26px rgba(233,214,173,0),0 18px 40px -18px rgba(13,19,34,.7)}}
.fres.rest{opacity:0;transform:translateY(10px);transition:opacity .6s ease,transform .6s ease;pointer-events:none}
.fres.rest.show{opacity:1;transform:none;pointer-events:auto}
.share-btn{display:flex!important;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,#1f2a44,#3a4a72)}
.share-btn svg{width:20px;height:20px}
.tlink{display:block;width:auto;margin:10px auto 0;background:none;color:var(--sub);font-size:12px;font-weight:500;padding:8px 12px;letter-spacing:.05em}
@keyframes tdrop{0%{opacity:0;transform:translateY(-60px) rotate(-8deg) scale(.85)}100%{opacity:1;transform:none}}
.wfort{border:1px solid var(--line);border-radius:16px;padding:18px 16px;margin-top:14px;background:#fff}
.w-k{font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:.06em}
.w-today{margin-top:10px;padding:14px;border-radius:12px;background:linear-gradient(135deg,var(--paper),#fff);border:1px solid var(--line)}
.w-d{font-size:13px;color:var(--sub)}
.w-l{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--accent-ink,var(--accent));margin-top:2px}
.w-today p,.w-year p{margin:6px 0 0;font-size:15px;line-height:1.8}
.wst{font-size:13px;color:#c8a96c;letter-spacing:1px;font-family:var(--sans);font-weight:400}
.w-sub{font-size:12px;color:var(--sub);letter-spacing:.12em;margin:16px 0 8px}
.w-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.w-day{text-align:center;padding:8px 2px;border-radius:10px;background:var(--paper)}
.w-day .wd{font-size:11px;color:var(--sub)}
.w-day .wdot{width:10px;height:10px;border-radius:50%;margin:6px auto;background:var(--line)}
.w-day.s2 .wdot{background:#e2cfa3}.w-day.s3 .wdot{background:#c8a96c;box-shadow:0 0 0 3px rgba(200,169,108,.25)}
.w-day .wl{font-size:11px;line-height:1.35}
.w-year{margin-top:4px}
.w-months{display:grid;gap:0}
.w-mon{display:grid;grid-template-columns:5.6em 4em 1fr;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13px}
.w-mon:last-child{border-bottom:0}
.wm{color:var(--sub);font-size:13px}
.more{margin-top:14px}
.more summary{font-size:13px;color:var(--accent-ink,var(--accent));cursor:pointer;padding:4px 0}
.mychip{display:flex!important;justify-content:space-between;align-items:center;margin-top:12px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:400;color:var(--ink)}
.mc-k{font-size:13px;color:var(--sub)}
.mc-v{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--accent-ink,var(--accent))}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 4px}
.mode{background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:10px 8px;font-weight:400;text-align:center}
.mode b{display:block;font-size:14px}
.mode small{display:block;font-size:12px;color:var(--sub);margin-top:2px}
.mode.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mode.on b{color:var(--accent-ink,var(--accent))}
.meetbtn{margin-top:12px}
.tag.gold{background:#f6eedb;border-color:#e2cfa3;color:#8a6a2a}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);background:rgba(28,28,30,.92);color:#fff;font-size:13px;padding:10px 16px;border-radius:999px;z-index:60;animation:fadeUp .25s both}

/* 自分用：名刺を横にめくる */
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:6px 18px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.carousel::-webkit-scrollbar{display:none}
.carousel .card{flex:0 0 84%;scroll-snap-align:center;padding:20px 20px 18px}
.carousel .card .name{font-size:24px}
.carousel .card .org{font-size:12px}
.carousel .card .org>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;justify-content:center;gap:6px;margin:2px 0 4px}
.dots span{width:6px;height:6px;border-radius:50%;background:var(--line);transition:all .2s}
.dots span.on{width:18px;border-radius:3px;background:var(--accent)}
.qrhead{display:flex;justify-content:space-between;align-items:baseline;margin:14px 2px 0}
.qrhead .t{font-family:var(--serif);font-size:15px;letter-spacing:.06em}
.qrhead .s{font-size:13px;color:var(--sub)}
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}

   同じ線画（100×100）を元に、画風ごとに描き分ける。art() は <svg> の文字列を返す（ドット絵だけは Promise）。
   bg・fg・sub・line は、カード表面の地の色・名前の色・英名の色・枠の色 */

const TZ_STYLES = (()=>{
  const S = (body, defs, extra) => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"' + (extra || '') + '><defs>' + (defs || '') + '</defs>' + body + '</svg>';
  const rot = (rv, g) => rv ? '<g transform="rotate(180 50 50)">' + g + '</g>' : g;
  // 線画の各要素を取り出す（色や塗りを1つずつ変えるため）
  const parts = art => (art.match(/<(path|circle|rect|ellipse|line|polyline|polygon)\b[^>]*\/>/g) || []);

/* あなたの仕事運：宿曜の日運（日ごと）と、九星の年・月の巡り */
const Work = (()=>{
  const dsum = n => [...String(n)].reduce((a, c) => a + Number(c), 0);
  const KS = ['','一白水星','二黒土星','三碧木星','四緑木星','五黄土星','六白金星','七赤金星','八白土星','九紫火星'];
  // 宿曜の日運 → 仕事の言葉
  const DAY = {
    '命':['自分らしさで勝負', 2, '得意分野に集中すると、いちばん力が出ます。'],
    '栄':['攻めどき', 3, '新しい提案や商談を入れるなら今日。'],
    '衰':['省エネの日', 1, '無理に動かず、ルーティンを片付けて。'],
    '安':['整える日', 2, '計画づくりや事務処理がはかどります。'],
    '危':['挑戦の日', 2, '思い切った一手が動く日。確認だけは丁寧に。'],
    '成':['まとめる日', 3, '契約・締め切り・仕上げに向いています。'],
    '壊':['見直しの日', 1, 'やめること・手放すことを決めるのに向いています。'],
    '友':['つながる日', 3, '人に会う、紹介をもらうと話が広がります。'],
    '親':['信頼を深める日', 3, 'お礼やフォローの連絡が効きます。'],
    '業':['昔の縁が動く日', 2, '以前の取引先や知人に連絡してみて。'],
    '胎':['種まきの日', 2, '学ぶ・アイデアを出すのに向いています。']
  };
  // 九星の宮 → 仕事の巡り
  const PAL = {
    1:['水面下で力をためる', 1, '表に出るより、学びや準備に時間を使う時期。'],
    2:['土台づくり', 2, '地道な積み重ねが、次の実りの下地になる時期。'],
    3:['スタート', 3, '新しい仕事や発信を始めるのに向いた時期。'],
    4:['信用が広がる', 3, '縁や取引がまとまりやすい時期。'],
    5:['転機', 1, '周りに振り回されやすい時期。大きな決断は慎重に。'],
    6:['充実・責任', 3, '任される仕事が増え、リーダー役が回ってくる時期。'],
    7:['収穫', 3, 'これまでの成果が形になる時期。交流からも実りあり。'],
    8:['方向転換', 2, '変化の兆し。やり方の見直しと切り替えの時期。'],
    9:['注目を集める', 3, '目立ち、評価されやすい時期。発表や発信に。']
  };
  const yearStar = Y => { let n = dsum(Y); while (n > 9) n = dsum(n); let k = 11 - n; if (k > 9) k -= 9; return k; };
  const palace = (S, C) => ((S - C + 4) % 9 + 9) % 9 + 1;
  function solarMonth(y, m, d){                    // 節入りで区切った月（0=寅月〈2月〉… 11=丑月〈1月〉）と、立春で区切った年
    const lon = Meet.sunLon(y, m, d), idx = Math.floor(((lon - 315 + 360) % 360) / 30);
    const Y = (m <= 2 && idx >= 10) ? y - 1 : y;
    return {idx, Y};
  }
  function monthStar(Y, idx){
    const b = ((Y - 4) % 12 + 12) % 12, start = [0,6,3,9].includes(b) ? 8 : [4,10,1,7].includes(b) ? 5 : 2;
    return ((start - 1 - idx) % 9 + 9) % 9 + 1;
  }
  const addDays = (y, m, d, n) => { const t = new Date(Date.UTC(y, m-1, d + n)); return [t.getUTCFullYear(), t.getUTCMonth()+1, t.getUTCDate()]; };
  function read(by, bm, bd, today){
    const [ty, tm, td] = today;
    const mySh = Kyureki.shuku(by, bm, bd).index;
    const b = solarMonth(by, bm, bd), honmei = yearStar(b.Y);
    const days = Array.from({length:7}, (_, i) => {
      const [y, m, d] = addDays(ty, tm, td, i), rel = Meet.dayRel(mySh, Kyureki.shuku(y, m, d).index), x = DAY[rel];
      return {y, m, d, wd:'日月火水木金土'[new Date(Date.UTC(y, m-1, d)).getUTCDay()], rel, label:x[0], stars:x[1], text:x[2]};
    });
    const cur = solarMonth(ty, tm, td), yC = yearStar(cur.Y), yp = palace(honmei, yC);
    const months = Array.from({length:12}, (_, i) => {
      const t = new Date(Date.UTC(ty, tm - 1 + i, 15)), y = t.getUTCFullYear(), m = t.getUTCMonth() + 1;
      const sm = solarMonth(y, m, 15), p = palace(honmei, monthStar(sm.Y, sm.idx));
      return {y, m, palace:p, label:PAL[p][0], stars:PAL[p][1], text:PAL[p][2]};
    });
    return {honmei, honmeiName:KS[honmei], days, year:{Y:cur.Y, palace:yp, label:PAL[yp][0], stars:PAL[yp][1], text:PAL[yp][2]}, months};
  }
  return {read, yearStar, monthStar, solarMonth, palace, KS};
})();

/* ── 名刺の写真を読み取る：切り出し・ロゴの線データ化・色 ──
   すべてスマホの中で計算する（画像はどこにも送らない） */
const Scan = (()=>{
  const cnv = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, w|0); c.height = Math.max(1, h|0); return c; };
  const ctx = c => c.getContext('2d', {willReadFrequently:true});

  /* 写真を読み込む（向きは写真の情報どおり、長い辺を最大 maxSide に） */
  async function load(file, maxSide = 3200){
    let src;
    try{ src = await createImageBitmap(file, {imageOrientation:'from-image'}); }
    catch(e){ src = await new Promise((ok, ng) => { const im = new Image(); im.onload = () => ok(im); im.onerror = ng; im.src = URL.createObjectURL(file); }); }
    const w = src.width || src.naturalWidth, h = src.height || src.naturalHeight, s = Math.min(1, maxSide / Math.max(w, h));
    const c = cnv(w * s, h * s); ctx(c).drawImage(src, 0, 0, c.width, c.height);
    return c;
  }
  function rotate(c){ const r = cnv(c.height, c.width), g = ctx(r); g.translate(r.width, 0); g.rotate(Math.PI / 2); g.drawImage(c, 0, 0); return r; }

  /* 小さくしたグレースケール */
  function small(c, maxW){
    const s = Math.min(1, maxW / Math.max(c.width, c.height)), o = cnv(c.width * s, c.height * s);
    ctx(o).drawImage(c, 0, 0, o.width, o.height);
    return {c:o, s, d:ctx(o).getImageData(0, 0, o.width, o.height).data, w:o.width, h:o.height};
  }

  /* 名刺の四隅を探す：まわり（机）と違う色のいちばん大きな塊の、四方の端 */
  function findCard(c){
    const {d, w, h, s} = small(c, 360);
    const lab = new Float32Array(w * h * 3);
    for (let i = 0, j = 0; i < d.length; i += 4, j += 3){ lab[j] = d[i]; lab[j+1] = d[i+1]; lab[j+2] = d[i+2]; }
    // 縁の色を集めて、机の色の平均とばらつきを出す
    let n = 0, m = [0,0,0], v = 0;
    const border = [];
    for (let x = 0; x < w; x++){ border.push(x, x + (h-1) * w); }
    for (let y = 0; y < h; y++){ border.push(y * w, y * w + w - 1); }
    for (const p of border){ m[0] += lab[p*3]; m[1] += lab[p*3+1]; m[2] += lab[p*3+2]; n++; }
    m = m.map(x => x / n);
    for (const p of border){ const a = lab[p*3]-m[0], b = lab[p*3+1]-m[1], cc = lab[p*3+2]-m[2]; v += a*a + b*b + cc*cc; }
    const sd = Math.sqrt(v / n), T = Math.max(28, sd * 2.6);
    // 机の色とのちがい＋輪郭の強さで「名刺らしさ」を出す
    const fg = new Uint8Array(w * h);
    for (let p = 0; p < w * h; p++){
      const a = lab[p*3]-m[0], b = lab[p*3+1]-m[1], cc = lab[p*3+2]-m[2];
      if (Math.sqrt(a*a + b*b + cc*cc) > T) fg[p] = 1;
    }
    // 閉じる（すき間を埋める）
    const close = (src, r) => morph(morph(src, w, h, r, 1), w, h, r, 0);
    const f2 = close(fg, 3);
    // いちばん大きな塊
    const {lbl, sizes} = label(f2, w, h);
    let best = 0, bi = -1; sizes.forEach((sz, i) => { if (sz > best){ best = sz; bi = i; } });

      if (seg.length < 3) return seg;

    deck.style.setProperty('--ry', (gx * 16).toFixed(1) + 'deg'); deck.style.setProperty('--rx', (-gy * 12).toFixed(1) + 'deg');
  }
  function onMotion(e){
    const g = e.accelerationIncludingGravity; if (!g || g.x == null) return;
    const ang = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
    let gx = g.x, gy = g.y;
    if (ang === 90){ gx = -g.y; gy = g.x; } else if (ang === -90 || ang === 270){ gx = g.y; gy = -g.x; } else if (ang === 180){ gx = -g.x; gy = -g.y; }
    if (!base) base = {gx, gy};
    const cl = v => Math.max(-1, Math.min(1, v));
    tilt(cl(-(gx - base.gx) / 5), cl((gy - base.gy) / 5));
  }
  addEventListener('devicemotion', onMotion);
  ov.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') tilt(e.clientX / innerWidth * 2 - 1, e.clientY / innerHeight * 2 - 1); });

  function stack(n){
    deck = el('div', {class:'tz-deck'}); base = null;
    const cards = [];
    for (let i = 0; i < n; i++){
      const c = el('div', {class:'tz-cd', style:'transform:' + rest(i)}, el('div', {class:'tz-bk'}, tzBack()), el('div', {class:'tz-fr'}));
      deck.append(c); cards.push(c);
    }
    return {stage:el('div', {class:'tz-stage'}, deck), cards};
  }
  const rest = i => 'translate(' + (i * -1.2) + 'px,' + (i * -1.6) + 'px) rotate(' + (rnd(7) - 3) + 'deg)';
  const chip = () => el('span', {class:'tz-ai'}, el('i'), 'AIにて制作');
  /* 画風：選んだものを覚えておく（「おまかせ」は引くたびに変わる）*/
  let pick = LS.get('tzstyle', 'random');
  if (pick !== 'random' && !TZ_STYLES.some(x => x.id === pick)) pick = 'random';
  const styleNow = () => pick === 'random' ? TZ_STYLES[rnd(TZ_STYLES.length)] : tzStyle(pick);
  function stylePicker(onPick, cur){
    const row = el('div', {class:'tz-styles', role:'radiogroup', 'aria-label':'絵柄の画風'});
    const opts = (onPick ? [] : [{id:'random', name:'おまかせ'}]).concat(TZ_STYLES);
    const draw1 = () => row.replaceChildren(...opts.map(o => { const on = o.id === cur;
      return el('button', {class:'tz-st' + (on ? ' on' : ''), role:'radio', 'aria-checked':on ? 'true' : 'false', onclick:() => { cur = o.id; draw1(); (onPick || (id => { pick = id; LS.set('tzstyle', id); }))(o.id); }},
        el('i', {style:o.id === 'random' ? 'background:conic-gradient(#ff4fd8,#3ff2ff,#ffe14f,#9cc58a,#ff4fd8)' : 'background:' + o.bg + ';border-color:' + (o.line || 'var(--tz)')}), o.name); }));
    draw1(); return row;
  }

  /* 1. 導入 */
  function intro(){
    const {stage} = stack(5); stage.classList.add('idle');
    body.replaceChildren(chip(),
      el('p', {class:'tz-ql'}, 'このタロットで占うこと'),
      el('h2', {class:'tz-h'}, el('span', {}, who + 'と'), el('span', {}, '出会ったことは、'), el('br'), 'この先、何につながる？'),
      el('div', {class:'tz-what'}, el('p', {}, 'カードを1枚引いて、3つを読みます'),
        el('ol', {}, TZ_LBL.map(l => el('li', {}, l)))),
      el('p', {class:'tz-lead'}, '生年月日などは使わないので、相性占いではありません。今日のこの出会いそのものを占います。最後に、この場で聞いてみたい「話のネタ」が出ます。'),
      stage,
      el('div', {class:'tz-stl'}, '絵柄の画風を選べます（どれも画面上でプログラムが描いています）'),
      stylePicker(null, pick),
      el('button', {class:'tz-go', onclick:() => {
        try{ if (window.DeviceMotionEvent && DeviceMotionEvent.requestPermission) DeviceMotionEvent.requestPermission().catch(()=>{}); }catch(e){}
        shuffle();
      }}, 'カードを引く'),
      el('p', {class:'tz-note'}, 'カードの絵と文章は、AIを使って一から制作しました。'));
  }

  /* 2. シャッフル → タップで1枚引く */
  async function shuffle(){
    ov.scrollTo({top:0});
    const {stage, cards} = stack(7);
    const hint = el('p', {class:'tz-hint', 'aria-live':'polite'}, 'シャッフル中…');
    body.replaceChildren(chip(), stage, hint);
    for (let r = 0; r < 3 && alive; r++){
      cards.forEach((c, i) => c.style.transform = 'translate(' + ((i % 2 ? 1 : -1) * (40 + rnd(30))) + 'px,' + (rnd(20) - 10) + 'px) rotate(' + ((i % 2 ? 1 : -1) * (6 + rnd(10))) + 'deg)');
      await wait(260);

      await wait(260);
    }
    if (!alive) return;
    hint.textContent = 'カードをタップして、1枚引いてください';
    deck.classList.add('ready'); deck.tabIndex = 0;
    deck.setAttribute('role', 'button'); deck.setAttribute('aria-label', 'カードを1枚引く');
    const go = () => draw(cards, hint);
    deck.addEventListener('click', go, {once:true});
    deck.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go(); } });
    deck.focus({preventScroll:true});
  }

  /* 3. めくる → 線画が描かれていく */
  async function draw(cards, hint){
    if (deck.dataset.done) return; deck.dataset.done = 1; deck.classList.remove('ready'); deck.removeAttribute('role'); deck.tabIndex = -1;
    try{ navigator.vibrate && navigator.vibrate(15); }catch(e){}
    const idx = rnd(22), rv = rnd(100) < 30, t = Tarot.get(idx), x = TAROT_TEXT[idx], v = rv ? x.rv : x.up;
    let st = styleNow();
    const top = cards[cards.length - 1], fr = top.querySelector('.tz-fr');
    let f = tzFace(t, rv, st, ink); fr.append(f); fr.style.borderColor = st.line || ink;
    hint.textContent = '';
    cards.slice(0, -1).forEach(c => { c.style.opacity = '0'; c.style.transform += ' translateY(40px)'; });
    deck.classList.add('open');
    top.style.transform = 'rotateY(180deg)';
    await wait(450);
    await f.ready;
    deck.classList.add('flat');   // めくり終えたら3Dを外して、くっきり描く
    f.classList.add(st.draw ? 'draw' : 'tz-show');
    await wait(1100);
    // 結果の画面で、同じカードをほかの画風に描き替えられるように
    const restyle = id => { st = tzStyle(id); const g = tzFace(t, rv, st, ink); fr.style.borderColor = st.line || ink;
      g.ready.then(() => { f.replaceWith(g); f = g; requestAnimationFrame(() => g.classList.add(st.draw ? 'draw' : 'tz-show')); }); };
    if (alive) result(t, v, rv, () => st, restyle, st.id);
  }

  /* 4. 結果：キーワード → 3行 → 話のネタ（吹き出し）→ 次の一手 */
  async function result(t, v, rv, curStyle, restyle, stId){
    const bubble = el('div', {class:'tz-bub'}, el('span', {class:'tz-typing', 'aria-label':'入力中'}, el('i'), el('i'), el('i')));
    const saveBtn = el('button', {class:'tz-go ghost', onclick: async () => {
      saveBtn.disabled = true;
      try{
        const blob = await tzImage(t, v, rv, who, ink, curStyle()), name = 'tarot-' + t.no + '-' + curStyle().id + '.png';
        const file = new File([blob], name, {type:'image/png'});
        if (navigator.canShare && navigator.canShare({files:[file]})) await navigator.share({files:[file], title:'話のネタにタロット'});
        else { const a = el('a', {href:URL.createObjectURL(blob), download:name}); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast('画像を保存しました'); }
      }catch(e){ if (e && e.name !== 'AbortError') toast('画像を作れませんでした'); }
      saveBtn.disabled = false;
    }}, '結果を画像で保存');
    const fortune = document.querySelector('details.fortune');
    const res = el('div', {class:'tz-res'},
      el('div', {class:'tz-stl'}, '同じカードを、ほかの画風で見る'),
      stylePicker(restyle, stId),
      el('div', {class:'tz-rq'}, who + 'と出会ったことは、この先、何につながる？'),
      el('div', {class:'tz-kwl'}, t.name + (rv ? '（逆向き）' : '') + 'のキーワード'),
      el('div', {class:'tz-kw'}, v.k),
      el('div', {class:'tz-rows'}, TZ_LBL.map((l, i) => el('div', {class:'tz-row', style:'--i:' + i}, el('b', {}, l), el('p', {}, v.m[i])))),
      el('div', {class:'tz-chat'}, el('div', {class:'tz-cl'}, '話のネタ（この場で聞いてみる）'), bubble,
        el('div', {class:'tz-bub me'}, el('b', {}, '次の一手'), v.a)),
      el('p', {class:'tz-foot'}, 'タロットカードの意味をもとにした読み物です。' + (rv ? '逆向きのカードは、悪い意味ではなく「気をつけたいポイント」として読んでいます。' : '')),
      el('button', {class:'tz-go', onclick:shuffle}, 'もう1枚引く'),
      saveBtn,
      fortune ? el('button', {class:'tz-link', onclick:() => { close(); fortune.open = true; setTimeout(() => fortune.scrollIntoView({behavior:'smooth', block:'start'}), 360); }}, '生年月日で、仕事運と相性も見る →') : null);
    body.append(res);
    requestAnimationFrame(() => res.classList.add('show'));
    const top = res.getBoundingClientRect().top;   // 横向きなど、キーワードが画面の外なら見える所まで送る
    if (top > innerHeight * .8) ov.scrollBy({top:top - innerHeight * .4, behavior:reduce ? 'auto' : 'smooth'});
    await wait(1300);
    bubble.replaceChildren('「' + v.t.replace(/「/g, '『').replace(/」/g, '』') + '」');
  }
  intro();
}

function shukuWheel(r, done){
  const NS = 'http://www.w3.org/2000/svg', N = 27, C = 160, R = 122, step = 360 / N;
  const mk = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
  const pt = (deg, rad) => [C + rad * Math.sin(deg * Math.PI / 180), C - rad * Math.cos(deg * Math.PI / 180)];
  const svg = mk('svg', {viewBox:'0 0 320 320', class:'wheel', role:'img', 'aria-label':'宿曜の円盤。' + (r.who || 'ご自身') + 'は' + r.shuku + '宿、' + CONFIG.FORTUNE.name + 'は' + r.meShuku + '宿、関係は' + r.rel6});
  svg.innerHTML = '<defs><radialGradient id="wbg" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#2c3d63"/><stop offset="1" stop-color="#141c30"/></radialGradient>'
    + '<filter id="wgl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';
  svg.append(mk('circle', {cx:C, cy:C, r:156, fill:'url(#wbg)'}));
  svg.append(mk('circle', {cx:C, cy:C, r:R + 18, fill:'none', stroke:'rgba(233,214,173,.35)', 'stroke-width':1}));
  svg.append(mk('circle', {cx:C, cy:C, r:R - 18, fill:'none', stroke:'rgba(233,214,173,.25)', 'stroke-width':1}));
  const ring = mk('g', {class:'ring'});
  for (let i = 0; i < N; i++){
    const a = i * step, [x, y] = pt(a, R), [tx, ty] = pt(a + step/2, R + 18), [ix, iy] = pt(a + step/2, R - 18);
    ring.append(mk('line', {x1:tx, y1:ty, x2:ix, y2:iy, stroke:'rgba(233,214,173,.18)', 'stroke-width':1}));
    const isMe = i === r.meIdx, isYou = i === r.shIdx;
    const t = mk('text', {x, y, 'text-anchor':'middle', 'dominant-baseline':'central', transform:`rotate(${a} ${x} ${y})`,
      fill: isYou ? '#ffffff' : isMe ? '#e9d6ad' : 'rgba(255,255,255,.55)', 'font-size': (isMe || isYou) ? 17 : 13, 'font-weight': (isMe || isYou) ? 700 : 400, class:'wk'});
    t.textContent = Kyureki.SHUKU[i]; ring.append(t);
  }
  svg.append(ring);
  // 円盤は「北崎の宿が真上」に来て止まる
  const final = -r.meIdx * step, youDeg = (r.shIdx - r.meIdx) * step;
  const [mx, my] = pt(0, R), [yx, yy] = pt(youDeg, R);
  const fx = mk('g', {class:'wfx', opacity:0});
  const chord = mk('path', {d:`M${mx} ${my} Q ${C} ${C} ${yx} ${yy}`, fill:'none', stroke:'#e9d6ad', 'stroke-width':2.2, 'stroke-linecap':'round', filter:'url(#wgl)', pathLength:100, 'stroke-dasharray':100, 'stroke-dashoffset':100, class:'chord'});
  if (r.shIdx !== r.meIdx) fx.append(chord);
  const dot = (x, y, col) => { const g = mk('g', {}); g.append(mk('circle', {cx:x, cy:y, r:16, fill:'none', stroke:col, 'stroke-width':1.5, filter:'url(#wgl)'})); return g; };
  fx.append(dot(mx, my, '#e9d6ad')); fx.append(dot(yx, yy, '#ffffff'));
  svg.append(fx);
  const center = mk('g', {class:'wcenter', opacity:0});
  const t1 = mk('text', {x:C, y:C - 8, 'text-anchor':'middle', fill:'#f3e3c3', 'font-size':40, class:'wrel'}); t1.textContent = r.rel6;
  const t2 = mk('text', {x:C, y:C + 26, 'text-anchor':'middle', fill:'rgba(255,255,255,.75)', 'font-size':12, 'letter-spacing':'.2em'}); t2.textContent = 'ふたりの関係';
  const t3 = mk('text', {x:C, y:C + 50, 'text-anchor':'middle', fill:'rgba(255,255,255,.6)', 'font-size':11}); t3.textContent = (r.who || 'ご自身') + ' ' + r.shuku + '宿　' + CONFIG.FORTUNE.name + ' ' + r.meShuku + '宿';
  center.append(t1, t2, t3); svg.append(center);
  const wrap = el('div', {class:'wheel-wrap'}, svg);
  ring.style.transformBox = 'view-box'; ring.style.transformOrigin = `${C}px ${C}px`;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const finish = () => { fx.setAttribute('opacity', 1); chord.setAttribute('stroke-dashoffset', 0); center.setAttribute('opacity', 1); done(); };
  if (reduce || !ring.animate){ ring.style.transform = `rotate(${final}deg)`; finish(); return wrap; }
  ring.style.transform = `rotate(${final}deg)`;
  const start = () => {
  const spin = ring.animate([{transform:`rotate(${final + 1080 + Math.random()*90}deg)`}, {transform:`rotate(${final}deg)`}], {duration:2600, easing:'cubic-bezier(.12,.75,.15,1)'});
  spin.onfinish = () => {
    try{ navigator.vibrate && navigator.vibrate(18); }catch(e){}
    fx.setAttribute('opacity', 1);
    fx.animate([{opacity:0, transform:'scale(1.15)'}, {opacity:1, transform:'scale(1)'}], {duration:400, easing:'ease-out'});
    chord.animate([{strokeDashoffset:100}, {strokeDashoffset:0}], {duration:900, delay:200, easing:'cubic-bezier(.6,0,.2,1)', fill:'forwards'});
    center.animate([{opacity:0}, {opacity:1}], {duration:700, delay:700, fill:'forwards'}).onfinish = () => { center.setAttribute('opacity', 1); done(); };
    wrap.classList.add('landed');
  };
  };
  if ('IntersectionObserver' in window){
    const io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)){ io.disconnect(); start(); } }, {threshold:.6});
    io.observe(wrap);
  } else start();
  return wrap;
}

  // ロゴ

  g.strokeStyle = '#ffffff'; g.lineWidth = 9; g.lineCap = 'round'; g.lineJoin = 'round';
  g.stroke(new Path2D('M78 30H37A10 10 0 0 0 37 50H43A10 10 0 0 1 43 70H22M62 30V70')); g.restore();
  g.fillStyle = '#e9d6ad'; g.font = '600 26px ' + sans; g.textBaseline = 'middle'; g.fillText('S T   C O M P A N Y', 190, 125);
  // 見出し
  g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  g.fillStyle = 'rgba(255,255,255,.7)'; g.font = '500 30px ' + sans; g.fillText('相性診断', W/2, 250);
  g.fillStyle = '#ffffff'; g.font = '600 46px ' + serif; g.fillText((name ? name + ' さん' : 'わたし') + '  ×  ' + CONFIG.FORTUNE.name, W/2, 320);
  // 円盤
  const cx = W/2, cy = 600, R = 200, N = 27, step = 2 * Math.PI / N, base = -r.meIdx * step;
  g.strokeStyle = 'rgba(233,214,173,.35)'; g.lineWidth = 2; g.beginPath(); g.arc(cx, cy, R + 34, 0, Math.PI*2); g.stroke();
  g.beginPath(); g.arc(cx, cy, R - 34, 0, Math.PI*2); g.stroke();
  g.textBaseline = 'middle';
  for (let i = 0; i < N; i++){
    const a = base + i * step, x = cx + R * Math.sin(a), y = cy - R * Math.cos(a);
    const me = i === r.meIdx, you = i === r.shIdx;
    g.fillStyle = you ? '#ffffff' : me ? '#e9d6ad' : 'rgba(255,255,255,.45)'; g.font = ((me || you) ? '700 32px ' : '400 22px ') + serif;
    g.save(); g.translate(x, y); g.rotate(a); g.fillText(Kyureki.SHUKU[i], 0, 0); g.restore();
  }
  const ya = (r.shIdx - r.meIdx) * step, mx = cx, my = cy - R, yx = cx + R * Math.sin(ya), yy = cy - R * Math.cos(ya);
  g.shadowColor = 'rgba(233,214,173,.9)'; g.shadowBlur = 18;
  if (r.shIdx !== r.meIdx){ g.strokeStyle = '#e9d6ad'; g.lineWidth = 4; g.beginPath(); g.moveTo(mx, my); g.quadraticCurveTo(cx, cy, yx, yy); g.stroke(); }
  g.lineWidth = 3; [[mx, my, '#e9d6ad'], [yx, yy, '#ffffff']].forEach(([x, y, c]) => { g.strokeStyle = c; g.beginPath(); g.arc(x, y, 28, 0, Math.PI*2); g.stroke(); });
  g.shadowBlur = 0;
  g.fillStyle = '#f3e3c3'; g.font = '600 72px ' + serif; g.fillText(r.rel6, cx, cy - 10);
  g.fillStyle = 'rgba(255,255,255,.7)'; g.font = '500 24px ' + sans; g.fillText('ふたりの関係', cx, cy + 50);
  // 結果
  g.textBaseline = 'alphabetic';
  const rows = [['数', r.lp + '　' + r.lpName], ['宿曜', r.shuku + '宿'], ['九星', r.kName]];
  rows.forEach(([k, v], i) => {
    const x = 160 + i * 280;

    g.fillStyle = '#ffffff'; g.font = '600 32px ' + serif; g.fillText(v, x + 40, 950);
  });
  g.fillStyle = 'rgba(255,255,255,.9)'; g.font = '400 28px ' + sans;
  const wrapText = (t, x, y, w, lh) => { let line = ''; for (const ch of t){ if (g.measureText(line + ch).width > w){ g.fillText(line, x, y); line = ch; y += lh; } else line += ch; } g.fillText(line, x, y); };
  wrapText(r.pair, W/2, 1030, 820, 44);
  // QRと制作クレジット
  const url = cardUrl(CONFIG.CARDS[0]);
  const q = new QRLib.QRCode(-1, QRLib.ECL.M); q.addData(unescape(encodeURIComponent(url))); q.make();
  const n = q.getModuleCount(), qs = 150, cell = qs / (n + 2), qx = W - 80 - qs, qy = H - 80 - qs;
  g.fillStyle = '#ffffff'; g.fillRect(qx, qy, qs, qs); g.fillStyle = '#111';

async function shareCanvas(cv, fname, title){
  const blob = await new Promise(res => cv.toBlob(res, 'image/png'));
  if (!blob){ toast('画像を作れませんでした'); return; }
  const file = new File([blob], fname, {type:'image/png'});
  try{ if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title}); return; } }
  catch(e){ if (e && e.name === 'AbortError') return; }
  const a = el('a', {href:URL.createObjectURL(blob), download:fname}); document.body.append(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('画像を保存しました');
}

const lum = hex => { const n = parseInt(String(hex).slice(1), 16); return .299*(n >> 16) + .587*((n >> 8) & 255) + .114*(n & 255); };
function logoMark(draw, c, onDark){

    svg.setAttribute('viewBox', '0 0 ' + L.w + ' ' + L.h); svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', c.company || c.label || 'ロゴ');
    const avg = L.p.reduce((a, x) => a + lum(x[0]), 0) / L.p.length;
    svg.setAttribute('class', 'logo img' + (draw ? ' draw' : '') + (onDark && avg < 150 ? ' chip' : '') + (!onDark && avg > 205 ? ' chipdark' : ''));
    svg.style.aspectRatio = L.w + ' / ' + L.h;
    for (const [col, d, sw] of L.p){ const p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); p.setAttribute('stroke', col); p.setAttribute('pathLength', '100');
      if (sw){ p.setAttribute('fill', 'none'); p.setAttribute('stroke-width', String(sw)); p.setAttribute('stroke-linecap', 'round'); p.setAttribute('stroke-linejoin', 'round'); p.classList.add('ln'); }
      else { p.setAttribute('fill', col); p.setAttribute('fill-rule', 'evenodd'); p.setAttribute('stroke-width', String(Math.max(L.w, L.h) / 110)); }
      svg.append(p); }
    return svg;
  }
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 100 100'); svg.setAttribute('class','logo' + (draw ? ' draw' : '')); svg.setAttribute('role','img'); svg.setAttribute('aria-label', c.company || c.label || 'ロゴ');
  const t = markText(c), two = [...t].length > 1;
  svg.innerHTML = '<rect width="100" height="100" rx="24" fill="' + (c.color || '#1f2a44') + '"/><text x="50" y="' + (two ? 63 : 68) + '" text-anchor="middle" font-size="' + (two ? 40 : 56) + '" fill="#fff" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"></text>';
  svg.querySelector('text').textContent = t;
  return svg;
}

function stPrelude(box, then){
  const pre = el('div', {class:'st-pre'}); pre.innerHTML = ST2_SVG; box.append(pre);
  let fin = false, t1 = 0;
  // 出終わってから0.5秒見せ、消え終わったら次へ（読み込みで動きが遅れても見える時間を保つ）。念のため4秒で必ず次へ
  pre.addEventListener('animationend', e => { if (e.animationName === 'stPreIn') t1 = setTimeout(() => pre.classList.add('bye'), 500); else if (e.animationName === 'stPreOut') finish(); });
  const t2 = setTimeout(finish, 4000);
  function finish(){ if (fin) return; fin = true; clearTimeout(t1); clearTimeout(t2); pre.remove(); then(); }
  return finish;   // 押した時はすぐ終える
}

/* オープニング：ロゴを大きく描いてから、名刺の位置へ収める */
function playIntro(c){
  const card = document.querySelector('.stage .card');
  if (!card) return;
  const shine = () => card.classList.add('shine');
  const target = card.querySelector('.logo');
  if (!target || matchMedia('(prefers-reduced-motion: reduce)').matches || LS.get('introSeen', false)){ setTimeout(shine, 600); return; }
  LS.set('introSeen', true);
  target.classList.remove('draw'); target.style.visibility = 'hidden';
  $app.classList.add('pre');
  const big = logoMark(true, c, true); big.classList.add('big');
  const r0 = big.querySelector('rect'); if (r0){ r0.setAttribute('fill', 'transparent'); r0.setAttribute('stroke', 'rgba(255,255,255,.55)'); r0.setAttribute('stroke-width', '1.2'); }
  const sparks = Array.from({length:14}, (_, i) => {
    const a = i / 14 * Math.PI * 2 + Math.random() * .3, d = 120 + Math.random() * 110;
    const sp = el('i', {class:'spark'}); sp.style.setProperty('--dx', (Math.cos(a)*d).toFixed(0) + 'px'); sp.style.setProperty('--dy', (Math.sin(a)*d).toFixed(0) + 'px');
    sp.style.animationDelay = (1.15 + Math.random() * .25).toFixed(2) + 's'; return sp;
  });
  const ov = el('div', {class:'opening', 'aria-hidden':'true'});
  document.body.append(ov);
  let done = false; const timers = [];
  function handoff(){
    if (done) return; done = true; timers.forEach(clearTimeout);
    const a = big.getBoundingClientRect(), b = target.getBoundingClientRect();
    const dx = (b.left + b.width/2) - (a.left + a.width/2), dy = (b.top + b.height/2) - (a.top + a.height/2), sc = b.width / a.width;
    big.querySelectorAll('text,path').forEach(t => { t.style.animation = 'none'; t.style.strokeDashoffset = '0'; t.style.fillOpacity = '1'; });
    if (r0) r0.setAttribute('fill', c.color || '#1f2a44');
    ov.classList.add('out'); $app.classList.remove('pre');
    const anim = big.animate([{transform:'translate(0,0) scale(1)'}, {transform:`translate(${dx}px,${dy}px) scale(${sc})`}],
      {duration:850, easing:'cubic-bezier(.7,0,.2,1)', fill:'forwards'});
    anim.onfinish = () => { target.style.visibility = ''; ov.remove(); shine(); };
  }
  // 頭に ST2 を見せてから、この名刺のロゴを描く
  const skipPre = stPrelude(ov, () => {
    ov.append(el('div', {class:'fx'}, el('div', {class:'ring'}), el('div', {class:'ring r2'}), sparks),
      big, el('div', {class:'brand'}, c.label || c.company || CONFIG.NAME));
    timers.push(setTimeout(handoff, 2300));
  });
  ov.addEventListener('click', () => { skipPre(); handoff(); });
}

/* 傾けると光る名刺（スマホの傾き、またはマウス／指の位置に合わせる） */
function liveCard(card){
  card.classList.add('live'); card.append(el('div', {class:'sweep', 'aria-hidden':'true'}));
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return card;
  let raf = 0, tx = 0, ty = 0;
  const apply = () => { raf = 0;
    card.style.setProperty('--ry', (tx * 11).toFixed(2) + 'deg');
    card.style.setProperty('--rx', (-ty * 11).toFixed(2) + 'deg');
    card.style.setProperty('--gx', (50 + tx * 45).toFixed(1) + '%');
    card.style.setProperty('--gy', (50 + ty * 45).toFixed(1) + '%');
  };
  const set = (x, y) => { tx = Math.max(-1, Math.min(1, x)); ty = Math.max(-1, Math.min(1, y)); if (!raf) raf = requestAnimationFrame(apply); };
  window.addEventListener('deviceorientation', e => {
    if (e.gamma == null || e.beta == null) return;
    set(e.gamma / 30, (e.beta - 45) / 30);
  }, {passive:true});
  card.addEventListener('pointermove', e => {
    const r = card.getBoundingClientRect();
    set((e.clientX - r.left) / r.width * 2 - 1, (e.clientY - r.top) / r.height * 2 - 1);
  });
  card.addEventListener('pointerleave', () => set(0, 0));
  return card;
}

/* ── vCard（相手の電話帳に1タップ登録）── */
function vcard(o){
  const esc = s => String(s||'').replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/([,;])/g,'\\$1');
  // 「姓 名」とスペースで区切られていれば、電話帳の姓・名に分けて入れる
  const nm = String(o.name||'').trim().split(/[\s　]+/), kn = String(o.kana||'').trim().split(/[\s　]+/);
  const L = ['BEGIN:VCARD','VERSION:3.0', nm.length===2 ? 'N:'+esc(nm[0])+';'+esc(nm[1])+';;;' : 'N:'+esc(o.name)+';;;;', 'FN:'+esc(o.name)];
  if (o.kana && kn.length===2){ L.push('X-PHONETIC-LAST-NAME:'+esc(kn[0])); L.push('X-PHONETIC-FIRST-NAME:'+esc(kn[1])); }
  else if (o.kana) L.push('X-PHONETIC-LAST-NAME:'+esc(o.kana));
  if (o.company) L.push('ORG:'+esc(o.company));
  if (o.title) L.push('TITLE:'+esc(o.title));
  if (o.phone) L.push('TEL;TYPE=CELL:'+esc(o.phone));
  if (o.email) L.push('EMAIL;TYPE=INTERNET:'+esc(o.email));
  if (o.web) L.push('URL:'+esc(o.web));
  if (o.address) L.push('ADR:;;'+esc(o.address)+';;;;');
  const note = [o.place && ('出会った場所：'+o.place), o.memo].filter(Boolean).join('\n');
  if (note) L.push('NOTE:'+esc(note));
  L.push('END:VCARD');
  return L.join('\r\n');
}
function downloadVcard(o){
  const blob = new Blob([vcard(o)], {type:'text/vcard;charset=utf-8'});
  const a = el('a', {href:URL.createObjectURL(blob), download:(o.name||'contact')+'.vcf'});
  document.body.append(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

/* ── QRコード（SVG）── */
function qrSvg(text){
  const q = new QRLib.QRCode(-1, QRLib.ECL.M);
  q.addData(unescape(encodeURIComponent(text))); q.make();
  const n = q.getModuleCount(), pad = 4, size = n + pad*2;
  let d = '';
  for (let r=0;r<n;r++) for (let c=0;c<n;c++) if (q.isDark(r,c)) d += 'M'+(c+pad)+' '+(r+pad)+'h1v1h-1z';
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 '+size+' '+size);
  svg.setAttribute('shape-rendering','crispEdges');
  svg.innerHTML = '<rect width="'+size+'" height="'+size+'" fill="#fff"/><path fill="#111" d="'+d+'"/>';
  return svg;
}

/* ── 保存先（GAS があればスプレッドシート、なければこの端末内）── */
const Store = {
  get remote(){ return !!CONFIG.GAS_URL; },
  async call(payload){
    const res = await fetch(CONFIG.GAS_URL, {method:'POST', body:JSON.stringify(payload)});
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'error');
    return j;
  },
  key(){ return LS.get('key',''); },
  async list(){
    if (this.remote) return (await this.call({action:'list', key:this.key()})).items;
    return LS.get('contacts', []).slice().sort((a,b)=>String(b.created).localeCompare(String(a.created)));
  },
  async add(rec){
    rec = Object.assign({}, rec, {source: ['meet','qr'].includes(rec.source) ? rec.source : 'manual'});
    if (this.remote) return this.call({action:'add', key:this.key(), data:rec});
    const all = LS.get('contacts', []);
    all.push(Object.assign(rec, {id:'L'+Date.now().toString(36), created:new Date().toISOString()}));
    LS.set('contacts', all);
  },
  async update(id, patch){
    if (this.remote) return this.call({action:'update', key:this.key(), id, data:patch});
    LS.set('contacts', LS.get('contacts', []).map(x => x.id===id ? Object.assign(x, patch, {updated:new Date().toISOString()}) : x));
  },
  async remove(id){
    if (this.remote) return this.call({action:'delete', key:this.key(), id});
    LS.set('contacts', LS.get('contacts', []).filter(x => x.id!==id));
  }
};

/* 紹介文：「■」の行は見出し、「・」の行は箇条書き。仕事ごとに番号つきのカードにする */
function parseAbout(t){
  const out = {lead:[], secs:[]}; let cur = null;
  for (let line of String(t || '').split(/\r?\n/)){
    line = line.trim(); if (!line) continue;
    const head = line.match(/^(?:[■◆●▼□◇]\s*|【)(.+?)】?$/);
    if (head){ cur = {title:head[1].trim(), lines:[]}; out.secs.push(cur); continue; }
    (cur ? cur.lines : out.lead).push(line);
  }
  return out;
}
function linesView(lines){
  const nodes = [], buf = [];
  const flush = () => { if (buf.length){ nodes.push(el('ul', {class:'blist'}, buf.map(x => el('li', {}, x)))); buf.length = 0; } };
  for (const l of lines){
    const b = l.match(/^[・\-•‐*]\s*(.+)$/);
    if (b){ buf.push(b[1]); continue; }
    flush();
    // 「（A／B／C）」のように並んだものは、小さなタグにする
    const m = l.match(/^(.*?)[（(]([^）)]*[／/][^）)]*)[）)]\s*$/);
    if (m){ nodes.push(el('p', {}, m[1])); nodes.push(el('div', {class:'tags'}, m[2].split(/[／/]/).map(x => el('span', {}, x.trim())))); }
    else nodes.push(el('p', {}, l));
  }
  flush();
  return nodes;
}
function aboutView(text){
  const a = parseAbout(text);
  const box = el('section', {class:'aboutx fade d3'},
    el('div', {class:'ax-eyebrow'}, a.secs.length ? 'WORKS' : 'ABOUT'),
    a.lead.length ? el('div', {class:'ax-lead'}, linesView(a.lead)) : null,
    a.secs.length ? el('div', {class:'works'}, el('div', {class:'wline', 'aria-hidden':'true'}, el('i')), a.secs.map((x, i) => el('article', {class:'work reveal', style:'--i:' + i},
      el('div', {class:'wno', 'aria-hidden':'true'}, String(i + 1).padStart(2, '0')),
      el('div', {class:'wbody'},
        el('h3', {'aria-label':x.title}, [...x.title].map((ch, k) => el('span', {class:'ch', 'aria-hidden':'true', style:'--k:' + k}, ch === ' ' ? '\u00a0' : ch))),
        linesView(x.lines)),
      el('div', {class:'wsweep', 'aria-hidden':'true'})))) : null);
  // 箇条書きとタグも、順番に出す
  box.querySelectorAll('.work').forEach(w => w.querySelectorAll('.blist li, .tags span, .wbody p').forEach((n, k) => n.style.setProperty('--k', k)));
  // 縦の線：スクロールに合わせて伸びる
  const line = box.querySelector('.wline i');
  if (line){
    let raf = 0;
    const upd = () => { raf = 0; const r = box.querySelector('.works').getBoundingClientRect(), mid = innerHeight * .62;
      line.style.transform = 'scaleY(' + Math.max(0, Math.min(1, (mid - r.top) / r.height)).toFixed(3) + ')'; };
    addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(upd); }, {passive:true});
    setTimeout(upd, 60);
  }
  // 画面に入ったら、1枚ずつ浮かび上がる
  if ('IntersectionObserver' in window && !matchMedia('(prefers-reduced-motion: reduce)').matches){
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }), {threshold:.25});
    setTimeout(() => box.querySelectorAll('.reveal').forEach(n => io.observe(n)), 50);
  } else box.querySelectorAll('.reveal').forEach(n => n.classList.add('in'));
  return box;
}

/* ── スワイプで相手の画面へ送る ──
   QRに交換ごとの合言葉（r）を入れ、ntfy.sh で「開いた」「送った」の合図だけを中継する。
   名刺の中身はQRのリンクで相手に届いているので、中継には載せない。つながらなくても何も壊れない。 */
const Relay = (()=>{
  const HOST = 'https://ntfy.sh/';
  const ok = r => /^[A-Za-z0-9]{16,32}$/.test(r || '');
  const topic = r => 'meishi-' + r;
  function newRoom(){ const a = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789', u = new Uint32Array(20); crypto.getRandomValues(u); return Array.from(u, x => a[x % a.length]).join(''); }
  function withRoom(url, r){ if (!ok(r)) return url; const i = url.indexOf('#'), h = i < 0 ? url : url.slice(0, i), t = i < 0 ? '' : url.slice(i); return h + (h.includes('?') ? '&' : '?') + 'r=' + r + t; }
  function send(r, msg){ if (!ok(r)) return; try{ fetch(HOST + topic(r), {method:'POST', body:msg, keepalive:true}).catch(()=>{}); }catch(e){} }
  // since で数秒前の合図も拾う（相手が先にスワイプした場合のため）。同じ合図は一度だけ扱う
  function listen(r, on, since, onOpen){
    if (!ok(r) || typeof EventSource !== 'function') return () => {};
    let es = null, seen = new Set(), stop = false, tries = 0;
    const open = () => {
      if (stop) return;
      try{ es = new EventSource(HOST + topic(r) + '/sse' + (since ? '?since=' + since : '')); }catch(e){ return; }
      es.onopen = () => { tries = 0; onOpen && onOpen(); };
      es.onmessage = ev => { try{ const d = JSON.parse(ev.data); if (d.event !== 'message' || seen.has(d.id)) return; seen.add(d.id); on(String(d.message || ''), d); }catch(e){} };
      es.onerror = () => { try{ es.close(); }catch(e){} if (!stop && ++tries < 6) setTimeout(open, 1500 * tries); };
    };
    open();
    return () => { stop = true; try{ es && es.close(); }catch(e){} };
  }
  return {ok, newRoom, withRoom, send, listen};
})();

/* ━━━━━━━━━━ 相手のQRを読む ━━━━━━━━━━ */
function unesc(v){ return String(v || '').replace(/\\n/gi, '\n').replace(/\\([,;:\\])/g, '$1').trim(); }
function parseVcard(t){
  const lines = String(t).replace(/\r?\n[ \t]/g, '').split(/\r?\n/), r = {};
  for (const l of lines){
    const i = l.indexOf(':'); if (i < 0) continue;
    const key = l.slice(0, i).split(';')[0].toUpperCase().replace(/^ITEM\d+\./, ''), v = l.slice(i + 1);
    if (key === 'FN' && !r.name) r.name = unesc(v);
    else if (key === 'N' && !r.name){ const p = v.split(';'); r.name = unesc([p[0], p[1]].filter(Boolean).join(' ')); }
    else if (key === 'ORG') r.company = unesc(v.split(';').filter(Boolean).join(' '));
    else if (key === 'TITLE') r.title = unesc(v);
    else if (key === 'TEL' && !r.phone) r.phone = unesc(v);
    else if (key === 'EMAIL' && !r.email) r.email = unesc(v);
    else if (key === 'URL' && !r.web) r.web = unesc(v);
    else if (key === 'ADR' && !r.address) r.address = unesc(v.split(';').filter(Boolean).join(' '));
    else if (key === 'NOTE') r.memo = unesc(v);
    else if ((key === 'X-PHONETIC-LAST-NAME' || key === 'X-PHONETIC-FIRST-NAME')) r.kana = ((r.kana || '') + ' ' + unesc(v)).trim();
  }
  return r;
}
function parseMecard(t){
  const r = {}, body = String(t).replace(/^MECARD:/i, '');
  for (const part of body.split(/;(?=[A-Z\-]+:)/)){
    const i = part.indexOf(':'); if (i < 0) continue;
    const k = part.slice(0, i).toUpperCase(), v = unesc(part.slice(i + 1).replace(/;+$/, ''));
    if (k === 'N') r.name = v.split(',').filter(Boolean).join(' ');
    else if (k === 'SOUND') r.kana = v.split(',').filter(Boolean).join(' ');
    else if (k === 'TEL' && !r.phone) r.phone = v; else if (k === 'EMAIL' && !r.email) r.email = v;
    else if (k === 'URL') r.web = v; else if (k === 'ADR') r.address = v; else if (k === 'NOTE') r.memo = v; else if (k === 'ORG') r.company = v;
  }
  return r;
}
// 読み取った文字 → 受け取った名刺の形にする
async function recFromScan(text){
  text = String(text || '').trim();
  let u = null; try{ u = new URL(text); }catch(e){}
  if (u && /^https?:$/.test(u.protocol)){
    if (u.hash.length > 2 && !u.searchParams.has('import')){
      try{
        const d = await Codec.dec(u.hash.slice(1));
        if (d && d.v === 1 && d.c && d.n){
          const c = safeCard(d.c);
          return {kind:'このアプリの名刺', rec:{name:String(d.n), kana:String(d.k || ''), company:c.company, title:c.title, phone:c.phone, email:c.email, web:safeUrl(c.web) || '', address:c.address, memo:'デジタル名刺：' + text}};
        }
      }catch(e){}
    }
    return {kind:'リンク', rec:{web:text, memo:'QRのリンク：' + text}};
  }
  if (/^BEGIN:VCARD/i.test(text)) return {kind:'連絡先', rec:parseVcard(text)};
  if (/^MECARD:/i.test(text)) return {kind:'連絡先', rec:parseMecard(text)};
  return {kind:'文字', rec:Object.assign({memo:text}, parseCardText(text))};
}

    el('div', {class:'bar'}, el('button', {class:'close', onclick:()=>{ stop(); sheet.remove(); }}, 'やめる'), el('div', {class:'bt'}, '相手のQRを読む'), el('span', {style:'width:44px'})),
    el('div', {class:'qrcam'}, video, el('div', {class:'qrframe', 'aria-hidden':'true'})),
    status,
    el('p', {class:'note'}, 'このアプリの名刺、連絡先の入ったQR、他社のデジタル名刺のQRを読めます。')));
  document.body.append(sheet);
  const fail = t => { status.replaceChildren(el('span', {class:'msg ng', style:'display:block;text-align:left'}, t)); };
  let det = null;
  try{ if ('BarcodeDetector' in window){ const fm = await BarcodeDetector.getSupportedFormats(); if (fm.includes('qr_code')) det = new BarcodeDetector({formats:['qr_code']}); } }catch(e){}
  if (!det){ fail('このブラウザでは、アプリの中でQRを読めません（Android の Chrome で使えます）。相手もこのアプリなら、スマホのカメラで相手のQRを読んでください。開いたページで、相手の名刺が「受け取った」に入ります。'); return; }
  try{ stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}, audio:false}); }
  catch(e){ fail('カメラを使えませんでした。ブラウザのカメラの許可を確かめてください。'); return; }
  if (!alive){ stop(); return; }
  video.srcObject = stream; try{ await video.play(); }catch(e){}
  status.textContent = '枠の中に、相手のQRコードを映してください';
  const tick = async () => {
    if (!alive) return;
    try{
      const codes = await det.detect(video);
      if (codes && codes.length && codes[0].rawValue){
        stop(); try{ navigator.vibrate && navigator.vibrate(30); }catch(e){}
        const found = await recFromScan(codes[0].rawValue);
        sheet.remove(); receiveSheet(found); return;
      }
    }catch(e){}
    setTimeout(tick, 220);
  };
  tick();
}

  const code = CODES[c.id] || '', key = 'got.' + code.slice(0, 48);
  const rec = {name:CONFIG.NAME, kana:CONFIG.KANA, company:c.company, title:c.title, phone:c.phone, email:c.email, web:safeUrl(c.web) || '', address:c.address, memo:'デジタル名刺：' + cardUrl(c), source:'qr', place:LS.get('lastPlace', '')};
  let saved = !!LS.get(key, false);
  if (!saved){
    try{
      if (mine.gas){ await fetch(mine.gas, {method:'POST', body:JSON.stringify({action:'add', key:LS.get('key', ''), data:rec})}); }
      else { const all = LS.get('contacts', []); all.push(Object.assign(rec, {id:'L' + Date.now().toString(36), created:new Date().toISOString()})); LS.set('contacts', all); }
      LS.set(key, true); saved = true;
    }catch(e){}
  }
  const myCard = mine.cards.find(x => x.id === LS.get('card', '')) || mine.cards[0];
  return el('div', {class:'mutual fade'},
    el('div', {class:'mt'}, saved ? surname(CONFIG.NAME) + 'さんの名刺を、あなたの「受け取った」に入れました' : 'このアプリをお使いですね'),
    el('button', {class:'btn-main', onclick: async () => {
      const p = {v:1, n:mine.name, c:packCard(myCard)};
      if (mine.kana) p.k = mine.kana; if (mine.nameEn) p.e = mine.nameEn; if (mine.gas) p.g = mine.gas;
      const F = myCard.fortune ? fortuneOf(mine) : null; if (F) p.f = [F.lifePath, F.kyusei, F.shuku, F.name];
      const url = BASE + '#' + await Codec.enc(p);
      const keep = [CONFIG.NAME, CONFIG.NAME_EN]; CONFIG.NAME = mine.name; CONFIG.NAME_EN = mine.nameEn || '';
      try{ showCard(myCard, url); } finally { CONFIG.NAME = keep[0]; CONFIG.NAME_EN = keep[1]; }

    }}, '自分の名刺も渡す（QRを見せる）'),

}

/* 紙の名刺の文字を貼り付けて、項目に振り分ける */
function toHalf(s){ return s.replace(/[０-９Ａ-Ｚａ-ｚ＠．－＋（）]/g, ch => String.fromCharCode(ch.charCodeAt(0)-0xFEE0)).replace(/(\d)[ー―‐−](?=\d)/g, '$1-'); }
function parseCardText(t){
  const out = {};
  const lines = toHalf(t).split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const used = new Set();
  const take = (re, key, fn) => { for (let i=0;i<lines.length;i++){ if (used.has(i)) continue; const m = lines[i].match(re); if (!m) continue; const v = fn ? fn(m, lines[i]) : m[0]; if (v == null) continue; out[key] = v; used.add(i); return; } };
  take(/[\w.+-]+@[\w-]+(\.[\w-]+)+/, 'email');
  take(/(https?:\/\/\S+|www\.\S+)/i, 'web');
  // 携帯を優先、なければ固定電話
  take(/(\+81[\s-]?|0)[789]0[\s-]?\d{4}[\s-]?\d{4}/, 'phone', m => m[0].replace(/\s/g,'-'));
  if (!out.phone) take(/(\+81[\s-]?|0)\d{1,4}[\s-]?\d{1,4}[\s-]?\d{3,4}/, 'phone', m => m[0].replace(/\s/g,'-'));
  take(/(株式会社|有限会社|合同会社|一般社団法人|社団法人|財団法人|NPO法人|事務所|協会|組合|Inc\.?|Co\.,?|Ltd\.?|LLC)/i, 'company', (m,l)=>l);
  take(/(代表|取締役|社長|部長|課長|係長|主任|店長|支配人|マネージャー|担当|CEO|COO|CTO|Director|Manager|オーナー|所長|理事)/i, 'title', (m,l)=>l);
  take(/〒|都|道|府|県|市|区|町|村/, 'address', (m,l)=> /\d/.test(l) ? l : null);
  for (let i=0;i<lines.length;i++){
    if (used.has(i)) continue;
    const l = lines[i];
    if (/^[\p{sc=Hiragana}\s]+$/u.test(l) && !out.kana){ out.kana = l; used.add(i); continue; }
    if (!out.name && l.length <= 14 && !/\d/.test(l)){ out.name = l; used.add(i); }
  }
  return out;
}

/* ━━━━━━━━━━ 名刺の写真を読み取る ━━━━━━━━━━ */
const Reader = {
  key: () => LS.get('gemini', ''),
  MODELS: ['gemini-3.5-flash-lite', 'gemini-3.1-flash-lite', 'gemini-3.6-flash', 'gemini-2.5-flash'],
  PROMPT: 'これは名刺を真上から撮った画像です。書かれている情報を読み取り、指定のJSONで返してください。\n' +
    '・書かれていない項目は空文字にする。推測で補わない。\n' +
    '・name は人の名前（姓と名の間に半角スペース）。kana はふりがな（ひらがな）、nameEn はローマ字・英語表記。\n' +
    '・company は会社名・屋号・店名。title は部署と役職をまとめたもの。\n' +
    '・phone は携帯があれば携帯、なければ代表番号。ハイフン区切り。\n' +
    '・web はURL（https:// から）。address は郵便番号を含む住所。\n' +
    '・hasLogo は、文字以外のロゴマーク・図形、またはデザインされたロゴタイプがあれば true。\n' +
    '・logoBox はそのロゴの範囲を [ymin, xmin, ymax, xmax]（0〜1000の整数）で。ロゴがなければ空配列。\n' +
    '・boxes には、読み取った項目ごとに、名刺のどこに書かれていたかを入れる。field は name, kana, nameEn, company, title, phone, email, web, address のどれか、box は [ymin, xmin, ymax, xmax]（0〜1000の整数）。',
  SCHEMA: { type:'OBJECT', properties:{ name:{type:'STRING'}, kana:{type:'STRING'}, nameEn:{type:'STRING'}, company:{type:'STRING'}, title:{type:'STRING'},
    phone:{type:'STRING'}, email:{type:'STRING'}, web:{type:'STRING'}, address:{type:'STRING'}, hasLogo:{type:'BOOLEAN'}, logoBox:{type:'ARRAY', items:{type:'INTEGER'}},
    boxes:{type:'ARRAY', items:{type:'OBJECT', properties:{field:{type:'STRING'}, box:{type:'ARRAY', items:{type:'INTEGER'}}}}} },
    required:['name','company','phone','email','hasLogo','logoBox'] },
  async call(prompt, b64, schema){
    const body = JSON.stringify({ contents:[{ parts:[{text:prompt}].concat(b64 ? [{inline_data:{mime_type:'image/jpeg', data:b64}}] : []) }],
      generationConfig:{ responseMimeType:'application/json', responseSchema:schema, temperature:0 } });
    const tried = [LS.get('geminiModel', '')].concat(this.MODELS).filter((m, i, a) => m && a.indexOf(m) === i);
    let why = '使えるモデルが見つかりません';
    if (!this.key()) throw new Error('Gemini のAPIキーが入っていません');
    for (const m of tried){
      let res;
      try{ res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + m + ':generateContent?key=' + encodeURIComponent(this.key()), {method:'POST', headers:{'Content-Type':'application/json'}, body}); }
      catch(e){ throw new Error('Gemini につながりません（電波を確認してください）'); }
      const j = await res.json().catch(() => ({}));
      if (res.status === 404){ why = 'モデル ' + m + ' が見つかりません'; continue; }
      if (!res.ok){
        const msg = String((j.error && j.error.message) || '');
        throw new Error(/API key not valid|API_KEY_INVALID/i.test(msg) ? 'APIキーが正しくありません。コピーし直して貼ってください' :
          res.status === 403 ? 'このAPIキーでは使えません（' + msg.slice(0, 80) + '）' :
          res.status === 429 ? '無料枠の回数を超えました。少し時間をおいてください' :
          ('Gemini のエラー ' + res.status + (msg ? '：' + msg.slice(0, 100) : '')));
      }
      LS.set('geminiModel', m); this.model = m;
      const t = ((j.candidates || [])[0] || {}).content;
      return JSON.parse(((t && t.parts) || []).map(p => p.text || '').join('') || '{}');
    }
    throw new Error(why);
  },
  toBox(a, pad){
    if (!Array.isArray(a) || a.length !== 4) return null;
    const [y0, x0, y1, x1] = a.map(v => Math.max(0, Math.min(1000, +v)) / 1000);
    if (!(x1 > x0 && y1 > y0)) return null;
    const px = (x1 - x0) * pad, py = (y1 - y0) * pad;
    return {x:Math.max(0, x0 - px), y:Math.max(0, y0 - py), w:Math.min(1, x1 + px) - Math.max(0, x0 - px), h:Math.min(1, y1 + py) - Math.max(0, y0 - py)};
  },
  async gemini(b64){
    const o = await this.call(this.PROMPT, b64, this.SCHEMA);
    const f = {}; for (const k of ['name','kana','nameEn','company','title','phone','email','web','address']) if (o[k]) f[k] = String(o[k]).trim();
    const boxes = {};
    for (const x of (Array.isArray(o.boxes) ? o.boxes : [])){ const b = this.toBox(x && x.box, .02); if (b && FIELD_JA[x.field] && f[x.field]) boxes[x.field] = b; }
    return {fields:f, boxes, logoBox:o.hasLogo ? this.toBox(o.logoBox, .06) : null, hasLogo:!!o.hasLogo, by:'Gemini'};
  },
  async text(b64, k){
    const hint = {phone:'電話番号はハイフン区切りで。', email:'メールアドレスだけを。', web:'URLだけを。', kana:'ふりがな（ひらがな）で。', name:'姓と名の間に半角スペース。', address:'郵便番号から住所まで1行で。'}[k] || '';
    const o = await this.call('この画像は名刺の一部を切り出したものです。写っている文字だけを、そのまま書き出してください。推測で補わない。' + hint, b64, {type:'OBJECT', properties:{text:{type:'STRING'}}, required:['text']});
    return String(o.text || '');
  }
};
function jpegB64(c, maxW, q){
  const s = Math.min(1, maxW / c.width), o = document.createElement('canvas'); o.width = Math.round(c.width * s); o.height = Math.round(c.height * s);
  o.getContext('2d').drawImage(c, 0, 0, o.width, o.height);
  return o.toDataURL('image/jpeg', q).split(',')[1];
}
function engineFor(mode){
  if (mode === 'self') return Reader.key() ? 'gemini' : null;
  if (Store.remote) return 'drive';
  if (Reader.key() && LS.get('geminiOthers', false)) return 'gemini';
  return null;
}
const ENGINE_JA = {gemini:'Gemini', drive:'Googleドライブ', local:'スマホ'};
async function readCard(engine, card, A, box, say){
  if (engine === 'gemini'){ say('Gemini で読み取っています…'); return await Reader.gemini(jpegB64(card, 1600, .88)); }
  if (engine === 'drive'){ say('Googleドライブの文字認識で読み取っています…'); const r = await Store.call({action:'ocr', key:Store.key(), image:jpegB64(card, 1800, .9)}); return {fields:parseCardText(r.text || ''), text:r.text, by:'Googleドライブ'}; }
  say('文字を読み取る準備をしています…（初回は約14MBをダウンロード）');
  const t = await Scan.ocr(Scan.forOcr(card, A, box), p => say('スマホの中で読み取っています… ' + Math.round(p * 100) + '%'));
  return {fields:parseCardText(t), text:t, by:'スマホ'};
}
function cropCanvas(src, b, minH){
  const sx = b.x * src.width, sy = b.y * src.height, sw = Math.max(4, b.w * src.width), sh = Math.max(4, b.h * src.height);
  const k = Math.max(1, Math.min(3, minH / sh, 1800 / sw));
  const c = document.createElement('canvas'); c.width = Math.round(sw * k); c.height = Math.round(sh * k);
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(src, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c;
}
function cleanField(k, t){
  let s = String(t || '').trim();
  if (['phone','email','web'].includes(k)) s = toHalf(s);
  if (k === 'phone'){ const m = s.match(/(\+?\d[\d\s\-()]{7,}\d)/); return m ? m[1].replace(/[()]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-') : s.replace(/\s+/g, ''); }
  if (k === 'email'){ const m = s.replace(/\s+/g, '').match(/[\w.+-]+@[\w-]+(\.[\w-]+)+/); return m ? m[0] : s.replace(/\s+/g, ''); }
  if (k === 'web'){ const m = s.replace(/\s+/g, '').match(/(https?:\/\/\S+|www\.\S+|[\w-]+(\.[\w-]+)+\/?\S*)/i); return m ? m[0] : s.replace(/\s+/g, ''); }
  return s.split(/\r?\n/).map(x => x.trim()).filter(Boolean).join(' ');
}
function toHex(rgb){ return '#' + rgb.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join(''); }
function cardColor(logo, A){
  if (A.dark) return toHex(A.bgRGB);
  if (!logo) return null;
  let c = logo.color, n = parseInt(c.slice(1), 16), rgb = [n >> 16, (n >> 8) & 255, n & 255];
  while (lum(toHex(rgb)) > 150) rgb = rgb.map(v => v * .85);          // 白い地で読める濃さまで下げる
  return toHex(rgb);
}
const FIELD_JA = {name:'お名前', kana:'ふりがな', nameEn:'英語表記', company:'会社・屋号', title:'肩書き', phone:'電話', email:'メール', web:'Web', address:'住所'};

function scanSheet(mode, onDone){
  const body = el('div', {class:'scan'});
  const sheet = el('div', {class:'sheet full-sheet'}, el('div', {class:'panel'},
    el('div', {class:'bar'}, el('button', {class:'close', onclick:()=>sheet.remove()}, 'やめる'),
      el('div', {class:'bt'}, mode === 'self' ? '名刺を撮って作る' : '名刺を撮って登録'), el('span', {style:'width:44px'})),
    body));
  document.body.append(sheet);
  const engine = mode === 'self'
    ? (Reader.key() ? '文字とロゴの場所は Google の Gemini で読み取ります（設定したAPIキーを使います）。' : '文字はスマホの中で読み取ります。初回だけ読み取り用のデータ（約14MB）をダウンロードします。「設定」で Gemini のAPIキーを入れると、精度が大きく上がります。')
    : (Store.remote ? '文字は、自分のGoogleドライブの文字認識で読み取ります。' : '文字はスマホの中で読み取ります。初回だけ読み取り用のデータ（約14MB）をダウンロードします。');
  // ボタンそのものを本物のファイル選択にする（プログラムから押す方式は、環境によって無視されるため）
  function picker(camera, cls, text){

    if (camera) i.setAttribute('capture', 'environment');
    i.addEventListener('change', async () => {
