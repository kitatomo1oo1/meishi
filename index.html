<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="名刺">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>デジタル名刺</title>
<style>
:root{
  --ink:#1c1c1e; --sub:#6b6b70; --line:#e4e2dd; --bg:#ffffff; --paper:#faf9f6;
  --accent:#1f2a44; --danger:#b3261e;
  --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --sans:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 80px)}
.wrap{max-width:480px;margin:0 auto;padding:20px 18px}
h2{font-family:var(--serif);font-weight:600;font-size:19px;margin:28px 0 12px;letter-spacing:.04em}
p.note{color:var(--sub);font-size:13px;line-height:1.7;margin:6px 0 14px}
a{color:inherit}
button,.btn{font:inherit;border:0;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:600;cursor:pointer;display:block;width:100%;text-align:center;text-decoration:none}
.btn-main{background:var(--accent);color:#fff}
.btn-sub{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn-danger{background:#fff;color:var(--danger);border:1px solid #e8c5c2}
.row{display:flex;gap:10px}.row>*{flex:1}
.stack>*+*{margin-top:10px}

/* 名刺 */
.card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:26px 24px 22px;aspect-ratio:1.75/1;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 10px 30px -18px rgba(0,0,0,.35);overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}
.card .label-row{display:flex;align-items:center;gap:10px}
.card .logo{width:28px;height:28px;flex:none}
.card .label{font-size:11px;letter-spacing:.18em;color:var(--accent);font-weight:700}
.card .name{font-family:var(--serif);font-size:28px;letter-spacing:.08em;line-height:1.2}
.card .kana{font-size:11px;color:var(--sub);letter-spacing:.12em;margin-top:4px}
.card .org{font-size:13px;line-height:1.6}
.card .org .title{color:var(--sub)}
.contact-list{margin:18px 0 0;border-top:1px solid var(--line)}
.contact-list a{display:flex;justify-content:space-between;align-items:center;padding:15px 4px;border-bottom:1px solid var(--line);text-decoration:none;font-size:15px}
.contact-list a span:first-child{color:var(--sub);font-size:12px;width:76px;flex:none}
.contact-list a span:last-child{flex:1;text-align:right;word-break:break-all}
.sections{margin-top:6px}
.sec{padding:16px 0;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h3{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.05em;margin:0 0 6px;color:var(--accent)}
.sec p{margin:0;font-size:14px;line-height:1.8;white-space:pre-wrap}
.about{font-size:14px;line-height:1.8;margin:16px 0 0;white-space:pre-wrap}

/* フォーム */
label{display:block;font-size:12px;color:var(--sub);margin:14px 0 6px}
label b{color:var(--danger);font-weight:600;margin-left:4px}
input,textarea{font:inherit;font-size:16px;width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.msg{padding:14px;border-radius:10px;font-size:14px;line-height:1.7;margin:14px 0}
.msg.ok{background:#eef5ee;color:#1e4d2b}.msg.ng{background:#fbeeee;color:var(--danger)}.msg.info{background:var(--paper);color:var(--sub);border:1px solid var(--line)}

/* 自分用 */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;width:auto;padding:9px 14px;font-size:13px;font-weight:600;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.qrbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center;margin-top:14px}
.qrbox svg{width:100%;max-width:300px;height:auto;display:block;margin:0 auto}
.qrbox .cap{font-family:var(--serif);font-size:17px;margin-top:12px;letter-spacing:.06em}
.qrbox .url{font-size:11px;color:var(--sub);margin-top:6px;word-break:break-all}
.full{position:fixed;inset:0;background:#fff;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.full svg{width:88vmin;height:88vmin}
.full .cap{font-family:var(--serif);font-size:20px;margin-top:18px}
.full .hint{color:var(--sub);font-size:12px;margin-top:8px}

.search{margin-bottom:12px}
.item{display:block;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:14px 4px;font-weight:400}
.item .n{font-family:var(--serif);font-size:17px}
.item .m{font-size:12px;color:var(--sub);margin-top:4px;line-height:1.6}
.empty{color:var(--sub);text-align:center;padding:40px 0;font-size:14px}
.tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:999px;background:var(--paper);border:1px solid var(--line);margin-left:6px;vertical-align:2px;color:var(--sub)}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:flex;align-items:flex-end}
.sheet .panel{background:#fff;width:100%;max-width:480px;margin:0 auto;border-radius:18px 18px 0 0;max-height:92vh;overflow:auto;padding:20px 18px calc(env(safe-area-inset-bottom) + 24px)}
.sheet .close{width:auto;background:none;color:var(--sub);padding:4px 0;font-weight:500;font-size:14px;margin-left:auto}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);z-index:30}
nav.tabs button{background:none;color:#8a8a8f;font-size:11px;font-weight:600;padding:7px 4px 6px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:4px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent)}
nav.tabs button.on svg{stroke-width:2.2}

/* アニメーション */
.fade{animation:fadeUp .55s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.06s}.d2{animation-delay:.12s}.d3{animation-delay:.18s}.d4{animation-delay:.24s}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}

/* 相手の画面：すぐ押せるボタン */
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0 4px}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:84px;padding:12px 6px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);font-size:12px;font-weight:600;text-decoration:none;width:auto}
.act svg{width:24px;height:24px;color:var(--accent)}
.act.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.act.primary svg{color:#fff}
.act:active{transform:scale(.97)}
.intro{font-family:var(--serif);font-size:16px;line-height:1.8;margin:26px 0 2px;letter-spacing:.02em}
details.send{margin-top:26px;border:1px solid var(--line);border-radius:16px;padding:0 18px;background:#fff}
details.send summary{list-style:none;cursor:pointer;padding:18px 0;display:flex;justify-content:space-between;align-items:center;gap:12px}
details.send summary::-webkit-details-marker{display:none}
details.send summary .t{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.04em}
details.send summary .s{display:block;font-size:12px;color:var(--sub);font-family:var(--sans);font-weight:400;margin-top:4px;letter-spacing:0}
details.send summary svg{width:20px;height:20px;color:var(--sub);transition:transform .2s;flex:none}
details.send[open] summary svg{transform:rotate(180deg)}
details.send form{padding-bottom:18px}
.foot{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--sub);font-size:11px;letter-spacing:.12em;margin-top:40px}
.foot svg{width:18px;height:18px}
.promo{margin-top:28px;padding:22px 20px;border-radius:16px;background:var(--paper);border:1px solid var(--line)}
.promo-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.promo-head svg{width:26px;height:26px;flex:none}
.promo h3{margin:0;font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.05em}
.promo p{margin:0 0 16px;font-size:14px;line-height:1.85;white-space:pre-wrap}
.fortune .fres{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0 18px}
.fbox{border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;background:var(--paper)}
.fbox p{font-size:12px;line-height:1.7;margin:6px 0 0;text-align:left}
.fk{font-size:11px;color:var(--sub);letter-spacing:.08em}
.fnum{font-family:var(--serif);font-size:40px;line-height:1.2;color:var(--accent)}
.fname{font-family:var(--serif);font-size:15px;font-weight:600}
.fpair{grid-column:1 / -1;border-top:1px solid var(--line);padding-top:12px}
.fpair p{margin:4px 0 0;font-size:14px;line-height:1.8}
details.fortune{padding-bottom:0}
details.fortune>.msg,details.fortune>label,details.fortune>input{margin-left:0}
.consent{grid-column:1 / -1;border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:6px;background:#fff}
.consent .ct{font-family:var(--serif);font-size:15px;font-weight:600}
.consent p{font-size:12px;line-height:1.7;color:var(--sub);margin:6px 0 12px}
.consent button{padding:12px;font-size:14px}
.ftab{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0 16px}
.ftab td{padding:7px 4px;border-bottom:1px solid var(--line)}
.ftab td:last-child{text-align:right;color:var(--sub);white-space:nowrap}
.ftab .bar{display:inline-block;height:6px;border-radius:3px;background:var(--accent);opacity:.6;margin-right:6px;vertical-align:middle}
.check{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink);margin:14px 0 0}
.check input{width:20px;height:20px;flex:none;accent-color:var(--accent)}
.policy h1{font-family:var(--serif);font-size:24px;font-weight:600;margin:8px 0 16px}
.policy h2{font-size:16px;margin:24px 0 8px}
.policy p{font-size:14px;line-height:1.9;white-space:pre-wrap;margin:0}
.stage{perspective:900px}
.card.live{transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out;transform-style:preserve-3d;will-change:transform}
.card.live::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:
    radial-gradient(circle at var(--gx,50%) var(--gy,30%), rgba(255,255,255,.45), rgba(255,255,255,0) 34%),
    linear-gradient(115deg, rgba(31,42,68,0) 25%, rgba(31,42,68,.07) 40%, rgba(196,160,110,.16) 50%, rgba(31,42,68,.07) 60%, rgba(31,42,68,0) 75%);
  background-size:100% 100%, 260% 100%;
  background-position:0 0, calc(100% - var(--gx,50%)) 0;
  transition:background-position .25s ease-out}
.card.live::before{z-index:1}
.card.live{box-shadow:calc(var(--ry,0deg) / 1deg * -1.2px) calc(14px + var(--rx,0deg) / 1deg * 1.2px) 34px -20px rgba(0,0,0,.45)}
.card.live .sweep{position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(115deg, transparent 38%, rgba(196,160,110,.22) 47%, rgba(255,255,255,.6) 50%, rgba(196,160,110,.22) 53%, transparent 62%);background-size:300% 100%;background-position:120% 0;}
.card.live.shine .sweep{animation:sweep 1.4s .1s cubic-bezier(.5,0,.3,1) forwards}
@keyframes sweep{to{background-position:-20% 0}}
.logo.draw path{stroke-dasharray:100;stroke-dashoffset:100;animation:drawST 1.2s .3s cubic-bezier(.65,0,.25,1) forwards}
.logo.draw path.stem{animation-duration:.45s;animation-delay:1.45s}
@keyframes drawST{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.logo.draw path{animation:none;stroke-dashoffset:0}.card.live .sweep{display:none}.card.live{transform:none}}
#app{transition:opacity .8s ease}
#app.pre{opacity:0}
.opening{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;cursor:pointer}
.opening::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%, color-mix(in srgb, var(--accent) 70%, #fff 8%) 0%, color-mix(in srgb, var(--accent) 80%, #000) 60%, color-mix(in srgb, var(--accent) 45%, #000) 100%);transition:opacity .75s ease}
.opening.out::before{opacity:0}
.opening .big{position:relative;width:172px;height:172px;filter:drop-shadow(0 0 26px rgba(214,178,118,.55)) drop-shadow(0 0 60px rgba(214,178,118,.25));will-change:transform}
.opening .big path{transition:stroke .8s ease}
.opening.out .big path{stroke:#fff}
.opening .big.draw path{animation-duration:1.3s;animation-delay:.3s}
.opening .big.draw path.stem{animation-duration:.45s;animation-delay:1.55s}
.opening .brand{position:relative;color:#e9d6ad;font-size:13px;font-weight:600;letter-spacing:.55em;padding-left:.55em;opacity:0;transform:translateY(6px);animation:brandIn .9s 1.35s ease forwards}
@keyframes brandIn{to{opacity:1;transform:none}}
.opening .fx{position:absolute;left:50%;top:50%;width:0;height:0;margin-top:-22px}
.opening .ring{position:absolute;left:-86px;top:-86px;width:172px;height:172px;border-radius:36px;border:1px solid rgba(233,214,173,.7);opacity:0;animation:ring 1.5s 1.1s cubic-bezier(.2,.7,.2,1) forwards}
.opening .ring.r2{animation-delay:1.3s;border-color:rgba(233,214,173,.4)}
@keyframes ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.4)}}
.opening .spark{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:radial-gradient(circle,#fff 0%,#f1d9a2 45%,rgba(241,217,162,0) 70%);opacity:0;animation:spark 1.2s ease-out forwards}
@keyframes spark{0%{opacity:0;transform:translate(0,0) scale(.3)}25%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.4)}}
.opening.out .brand,.opening.out .fx{opacity:0!important;transition:opacity .35s}
.wheel-wrap{display:flex;justify-content:center;margin:18px 0 6px}
.wheel{width:min(320px,86vw);height:auto;display:block;border-radius:50%;box-shadow:0 18px 40px -18px rgba(13,19,34,.7)}
.wheel .wk,.wheel .wrel{font-family:var(--serif)}
.wheel-wrap.landed .wheel{animation:wpulse 1.2s ease-out}
@keyframes wpulse{0%{box-shadow:0 0 0 0 rgba(233,214,173,.55),0 18px 40px -18px rgba(13,19,34,.7)}100%{box-shadow:0 0 0 26px rgba(233,214,173,0),0 18px 40px -18px rgba(13,19,34,.7)}}
.fres.rest{opacity:0;transform:translateY(10px);transition:opacity .6s ease,transform .6s ease;pointer-events:none}
.fres.rest.show{opacity:1;transform:none;pointer-events:auto}
.share-btn{display:flex!important;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,#1f2a44,#3a4a72)}
.share-btn svg{width:20px;height:20px}
.tlink{display:block;width:auto;margin:10px auto 0;background:none;color:var(--sub);font-size:12px;font-weight:500;padding:8px 12px;letter-spacing:.05em}
.tarot-ov{position:fixed;inset:0;z-index:120;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:calc(env(safe-area-inset-top) + 36px) 22px calc(env(safe-area-inset-bottom) + 24px);overflow-y:auto;background:radial-gradient(ellipse at 50% 30%,#2c3d63,#0d1322 75%);opacity:0;transition:opacity .4s ease;color:#fff}
.tarot-ov.in{opacity:1}.tarot-ov.out{opacity:0}
.tkicker{font-family:var(--serif);color:#e9d6ad;letter-spacing:.25em;font-size:14px;margin-bottom:18px}
.tstage{position:relative;perspective:1300px}
.tcard{display:block;width:min(62vw,230px);aspect-ratio:200/330;padding:0;background:none;border:0;border-radius:14px;cursor:pointer;animation:tdrop 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes tdrop{0%{opacity:0;transform:translateY(-60px) rotate(-8deg) scale(.85)}100%{opacity:1;transform:none}}
.tinner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.3,.7,.2,1)}
.tcard.flipped .tinner{transform:rotateY(180deg)}
.tback,.tfront{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;overflow:hidden;box-shadow:0 22px 50px -18px rgba(0,0,0,.8),0 0 0 1px rgba(233,214,173,.25)}
.tback svg,.tfront svg{width:100%;height:100%;display:block}
.tfront{transform:rotateY(180deg)}
.tcard.flipped .tfront{animation:tglow 1.8s .9s ease-out}
@keyframes tglow{0%{box-shadow:0 0 0 0 rgba(233,214,173,.55),0 0 40px 6px rgba(233,214,173,.45)}100%{box-shadow:0 0 0 30px rgba(233,214,173,0),0 0 60px 0 rgba(233,214,173,0)}}
.tsparks{position:absolute;left:50%;top:50%;width:0;height:0;z-index:2;pointer-events:none}
.tsparks i{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:radial-gradient(circle,#fff 0%,#f1d9a2 45%,rgba(241,217,162,0) 70%);opacity:0;animation:spark 1.3s ease-out forwards}
.thint{margin-top:16px;font-size:12px;color:rgba(255,255,255,.65);letter-spacing:.15em;animation:twk 1.6s ease-in-out infinite}
@keyframes twk{0%,100%{opacity:.35}50%{opacity:1}}
.tresult{width:100%;max-width:420px;margin-top:22px;opacity:0;transform:translateY(10px);transition:opacity .7s ease,transform .7s ease}
.tresult.show{opacity:1;transform:none}
.tr-name{font-family:var(--serif);font-size:24px;text-align:center;color:#fff}
.tr-name span{font-size:14px;color:#e9d6ad;letter-spacing:.1em}
.tr-k{font-size:11px;color:#e9d6ad;letter-spacing:.15em;margin-top:16px}
.tresult p{margin:4px 0 0;font-size:15px;line-height:1.85}
.tresult .tr-note{font-size:11px;color:rgba(255,255,255,.55);margin-top:16px;text-align:center}
.tclose{width:auto;margin-top:22px;background:rgba(255,255,255,.08);border:1px solid rgba(233,214,173,.4);color:#fff;padding:12px 34px;font-weight:500}
@media (prefers-reduced-motion:reduce){.tcard{animation:none}.tinner{transition:none}.thint{animation:none}}
.work{border:1px solid var(--line);border-radius:16px;padding:18px 16px;margin-top:14px;background:#fff}
.w-k{font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:.06em}
.w-today{margin-top:10px;padding:14px;border-radius:12px;background:linear-gradient(135deg,var(--paper),#fff);border:1px solid var(--line)}
.w-d{font-size:12px;color:var(--sub)}
.w-l{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--accent);margin-top:2px}
.w-today p,.w-year p{margin:6px 0 0;font-size:14px;line-height:1.8}
.wst{font-size:13px;color:#c8a96c;letter-spacing:1px;font-family:var(--sans);font-weight:400}
.w-sub{font-size:11px;color:var(--sub);letter-spacing:.12em;margin:16px 0 8px}
.w-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.w-day{text-align:center;padding:8px 2px;border-radius:10px;background:var(--paper)}
.w-day .wd{font-size:10px;color:var(--sub)}
.w-day .wdot{width:10px;height:10px;border-radius:50%;margin:6px auto;background:var(--line)}
.w-day.s2 .wdot{background:#e2cfa3}.w-day.s3 .wdot{background:#c8a96c;box-shadow:0 0 0 3px rgba(200,169,108,.25)}
.w-day .wl{font-size:9.5px;line-height:1.35}
.w-year{margin-top:4px}
.w-months{display:grid;gap:0}
.w-mon{display:grid;grid-template-columns:5.6em 4em 1fr;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13px}
.w-mon:last-child{border-bottom:0}
.wm{color:var(--sub);font-size:12px}
.more{margin-top:14px}
.more summary{font-size:13px;color:var(--accent);cursor:pointer;padding:4px 0}

/* ── 名刺の写真を読み取る：切り出し・ロゴの線データ化・色 ──

const Scan = (()=>{
  const cnv = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, w|0); c.height = Math.max(1, h|0); return c; };

  /* 写真を読み込む（向きは写真の情報どおり、長い辺を最大 maxSide に） */

    let src;

    catch(e){ src = await new Promise((ok, ng) => { const im = new Image(); im.onload = () => ok(im); im.onerror = ng; im.src = URL.createObjectURL(file); }); }
    const w = src.width || src.naturalWidth, h = src.height || src.naturalHeight, s = Math.min(1, maxSide / Math.max(w, h));

  /* 名刺の四隅を探す：まわり（机）と違う色のいちばん大きな塊の、四方の端 */

    for (let i = 0, j = 0; i < d.length; i += 4, j += 3){ lab[j] = d[i]; lab[j+1] = d[i+1]; lab[j+2] = d[i+2]; }

    const fg = new Uint8Array(w * h);

      const a = lab[p*3]-m[0], b = lab[p*3+1]-m[1], cc = lab[p*3+2]-m[2];
      if (Math.sqrt(a*a + b*b + cc*cc) > T) fg[p] = 1;

    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
      if (lbl[y*w+x] !== bi + 1) continue;
      if (x + y < tl[2]) tl = [x, y, x + y];
      if (x + y > br[2]) br = [x, y, x + y];
      if (x - y > tr[2]) tr = [x, y, x - y];
      if (x - y < bl[2]) bl = [x, y, x - y];

    const q = [tl, tr, br, bl].map(([x, y]) => [(x + .5) / s, (y + .5) / s]);

  function fallback(c, k = 0.08){ const W = c.width, H = c.height; return [[W*k, H*k], [W*(1-k), H*k], [W*(1-k), H*(1-k)], [W*k, H*(1-k)]]; }

  function morph(src, w, h, r, dil){

    for (let x = 0; x < w; x++) for (let y = 0; y < h; y++){ let hit = dil ? 0 : 1;
      for (let k = -r; k <= r; k++){ const yy = y + k; if (yy < 0 || yy >= h){ if (!dil){ hit = 0; break; } continue; } const val = t[yy*w+x]; if (dil && val){ hit = 1; break; } if (!dil && !val){ hit = 0; break; } }

  /* 四隅から名刺をまっすぐに切り出す（射影変換） */

    const A = [], b = [];
    for (let i = 0; i < 4; i++){
      const [x, y] = dst[i], [u, v] = src[i];
      A.push([x, y, 1, 0, 0, 0, -u*x, -u*y]); b.push(u);
      A.push([0, 0, 0, x, y, 1, -v*x, -v*y]); b.push(v);

    for (let i = 0; i < 8; i++){
      let mx = i; for (let r = i + 1; r < 8; r++) if (Math.abs(A[r][i]) > Math.abs(A[mx][i])) mx = r;
      [A[i], A[mx]] = [A[mx], A[i]]; [b[i], b[mx]] = [b[mx], b[i]];
      for (let r = 0; r < 8; r++){ if (r === i) continue; const f = A[r][i] / A[i][i]; for (let k = i; k < 8; k++) A[r][k] -= f * A[i][k]; b[r] -= f * b[i]; }

    if (ratio < 1 && Math.abs(ratio * STD - 1) < .16) ratio = 1 / STD;

  /* 名刺の地の色と、地の明るさのむら（光）を求める */
  function analyze(card, workW = 700){
    const {c, d, w, h, s} = small(card, workW);
    const L = new Float32Array(w * h);
    for (let p = 0, i = 0; p < w * h; p++, i += 4) L[p] = .299*d[i] + .587*d[i+1] + .114*d[i+2];
    const sorted = Float32Array.from(L).sort(), med = sorted[(sorted.length / 2) | 0];
    const dark = med < 110;                                    // 濃い色の名刺（文字が明るい）
    // 地の明るさ：文字を消すように大きめの最大値（濃い名刺は最小値）→ ぼかし

  /* ロゴの場所の候補：文字や絵をまとまりにして、ロゴらしいものを選ぶ */
  function findLogo(A){
    const {w, h, d, fg} = A;
    const grow = morph(fg, w, h, Math.max(3, Math.round(w / 110)), 1);
    const {lbl, sizes} = label(grow, w, h);
    const B = sizes.map(() => ({x0:1e9, y0:1e9, x1:-1, y1:-1, n:0, sat:0, cnt:0}));
    for (let p = 0; p < w * h; p++){
      const id = lbl[p]; if (!id) continue; const b = B[id-1], x = p % w, y = (p / w) | 0;
      if (x < b.x0) b.x0 = x; if (x > b.x1) b.x1 = x; if (y < b.y0) b.y0 = y; if (y > b.y1) b.y1 = y;
      if (fg[p]){ b.n++; b.sat += sat(d[p*4], d[p*4+1], d[p*4+2]); }

      if (b.y0 < h * .45) sc += .5;                              // 上のほう

  }

  /* ロゴの切り出し範囲を、線データ（SVGのpath）にする。色は2色まで */
  function vectorize(card, box, A, budget = 900){

    const scale = Math.min(4, 560 / Math.max(W, H));                 // なめらかに拡大して、輪郭を細かくたどる
    const w = Math.max(8, Math.round(W * scale)), h = Math.max(8, Math.round(H * scale));

    // この範囲の地の明るさ（全体の解析結果から）

    const strong = cols.slice().sort((a, b) => b[4] - a[4]);
    const core = strong.slice(0, Math.max(30, Math.round(strong.length * .55)));

    for (let it = 0; it < 10; it++){

      core.forEach(p => { const s = near(p) ? s2 : s1; s[0] += p[0]; s[1] += p[1]; s[2] += p[2]; s[3]++; });

    const as = new Uint8Array(cols.length);
    const bgd = c => Math.hypot(c[0]-A.bgRGB[0], c[1]-A.bgRGB[1], c[2]-A.bgRGB[2]);
    cols.forEach((p, j) => {

/* ── 宿曜の円盤：27宿が回り、ふたりの位置で止まって光の線でつながる ── */
function shukuWheel(r, done){
  const NS = 'http://www.w3.org/2000/svg', N = 27, C = 160, R = 122, step = 360 / N;
  const mk = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
  const pt = (deg, rad) => [C + rad * Math.sin(deg * Math.PI / 180), C - rad * Math.cos(deg * Math.PI / 180)];
  const svg = mk('svg', {viewBox:'0 0 320 320', class:'wheel', role:'img', 'aria-label':'宿曜の円盤。あなたは' + r.shuku + '宿、' + CONFIG.FORTUNE.name + 'は' + r.meShuku + '宿、関係は' + r.rel6});
  svg.innerHTML = '<defs><radialGradient id="wbg" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#2c3d63"/><stop offset="1" stop-color="#141c30"/></radialGradient>'
    + '<filter id="wgl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';
  svg.append(mk('circle', {cx:C, cy:C, r:156, fill:'url(#wbg)'}));
  svg.append(mk('circle', {cx:C, cy:C, r:R + 18, fill:'none', stroke:'rgba(233,214,173,.35)', 'stroke-width':1}));
  svg.append(mk('circle', {cx:C, cy:C, r:R - 18, fill:'none', stroke:'rgba(233,214,173,.25)', 'stroke-width':1}));
  const ring = mk('g', {class:'ring'});
  for (let i = 0; i < N; i++){
    const a = i * step, [x, y] = pt(a, R), [tx, ty] = pt(a + step/2, R + 18), [ix, iy] = pt(a + step/2, R - 18);
    ring.append(mk('line', {x1:tx, y1:ty, x2:ix, y2:iy, stroke:'rgba(233,214,173,.18)', 'stroke-width':1}));
    const isMe = i === r.meIdx, isYou = i === r.shIdx;
    const t = mk('text', {x, y, 'text-anchor':'middle', 'dominant-baseline':'central', transform:`rotate(${a} ${x} ${y})`,
      fill: isYou ? '#ffffff' : isMe ? '#e9d6ad' : 'rgba(255,255,255,.55)', 'font-size': (isMe || isYou) ? 17 : 13, 'font-weight': (isMe || isYou) ? 700 : 400, class:'wk'});
    t.textContent = Kyureki.SHUKU[i]; ring.append(t);
  }
  svg.append(ring);
  // 円盤は「北崎の宿が真上」に来て止まる
  const final = -r.meIdx * step, youDeg = (r.shIdx - r.meIdx) * step;
  const [mx, my] = pt(0, R), [yx, yy] = pt(youDeg, R);
  const fx = mk('g', {class:'wfx', opacity:0});
  const chord = mk('path', {d:`M${mx} ${my} Q ${C} ${C} ${yx} ${yy}`, fill:'none', stroke:'#e9d6ad', 'stroke-width':2.2, 'stroke-linecap':'round', filter:'url(#wgl)', pathLength:100, 'stroke-dasharray':100, 'stroke-dashoffset':100, class:'chord'});
  if (r.shIdx !== r.meIdx) fx.append(chord);
  const dot = (x, y, col) => { const g = mk('g', {}); g.append(mk('circle', {cx:x, cy:y, r:16, fill:'none', stroke:col, 'stroke-width':1.5, filter:'url(#wgl)'})); return g; };
  fx.append(dot(mx, my, '#e9d6ad')); fx.append(dot(yx, yy, '#ffffff'));
  svg.append(fx);
  const center = mk('g', {class:'wcenter', opacity:0});
  const t1 = mk('text', {x:C, y:C - 8, 'text-anchor':'middle', fill:'#f3e3c3', 'font-size':40, class:'wrel'}); t1.textContent = r.rel6;
  const t2 = mk('text', {x:C, y:C + 26, 'text-anchor':'middle', fill:'rgba(255,255,255,.75)', 'font-size':12, 'letter-spacing':'.2em'}); t2.textContent = 'ふたりの関係';
  const t3 = mk('text', {x:C, y:C + 50, 'text-anchor':'middle', fill:'rgba(255,255,255,.6)', 'font-size':11}); t3.textContent = 'あなた ' + r.shuku + '宿　' + CONFIG.FORTUNE.name + ' ' + r.meShuku + '宿';
  center.append(t1, t2, t3); svg.append(center);
  const wrap = el('div', {class:'wheel-wrap'}, svg);
  ring.style.transformBox = 'view-box'; ring.style.transformOrigin = `${C}px ${C}px`;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const finish = () => { fx.setAttribute('opacity', 1); chord.setAttribute('stroke-dashoffset', 0); center.setAttribute('opacity', 1); done(); };
  if (reduce || !ring.animate){ ring.style.transform = `rotate(${final}deg)`; finish(); return wrap; }
  ring.style.transform = `rotate(${final}deg)`;
  const start = () => {
  const spin = ring.animate([{transform:`rotate(${final + 1080 + Math.random()*90}deg)`}, {transform:`rotate(${final}deg)`}], {duration:2600, easing:'cubic-bezier(.12,.75,.15,1)'});
  spin.onfinish = () => {
    try{ navigator.vibrate && navigator.vibrate(18); }catch(e){}
    fx.setAttribute('opacity', 1);
    fx.animate([{opacity:0, transform:'scale(1.15)'}, {opacity:1, transform:'scale(1)'}], {duration:400, easing:'ease-out'});
    chord.animate([{strokeDashoffset:100}, {strokeDashoffset:0}], {duration:900, delay:200, easing:'cubic-bezier(.6,0,.2,1)', fill:'forwards'});
    center.animate([{opacity:0}, {opacity:1}], {duration:700, delay:700, fill:'forwards'}).onfinish = () => { center.setAttribute('opacity', 1); done(); };
    wrap.classList.add('landed');
  };
  };
  if ('IntersectionObserver' in window){
    const io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)){ io.disconnect(); start(); } }, {threshold:.6});
    io.observe(wrap);
  } else start();
  return wrap;
}

const lum = hex => { const n = parseInt(String(hex).slice(1), 16); return .299*(n >> 16) + .587*((n >> 8) & 255) + .114*(n & 255); };

/* 傾けると光る名刺（スマホの傾き、またはマウス／指の位置に合わせる） */
function liveCard(card){
  card.classList.add('live'); card.append(el('div', {class:'sweep', 'aria-hidden':'true'}));
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return card;
  let raf = 0, tx = 0, ty = 0;
  const apply = () => { raf = 0;
    card.style.setProperty('--ry', (tx * 11).toFixed(2) + 'deg');
    card.style.setProperty('--rx', (-ty * 11).toFixed(2) + 'deg');
    card.style.setProperty('--gx', (50 + tx * 45).toFixed(1) + '%');
    card.style.setProperty('--gy', (50 + ty * 45).toFixed(1) + '%');
  };
  const set = (x, y) => { tx = Math.max(-1, Math.min(1, x)); ty = Math.max(-1, Math.min(1, y)); if (!raf) raf = requestAnimationFrame(apply); };
  window.addEventListener('deviceorientation', e => {
    if (e.gamma == null || e.beta == null) return;
    set(e.gamma / 30, (e.beta - 45) / 30);
  }, {passive:true});
  card.addEventListener('pointermove', e => {
    const r = card.getBoundingClientRect();
    set((e.clientX - r.left) / r.width * 2 - 1, (e.clientY - r.top) / r.height * 2 - 1);
  });
  card.addEventListener('pointerleave', () => set(0, 0));
  return card;
}

/* ── vCard（相手の電話帳に1タップ登録）── */
function vcard(o){
  const esc = s => String(s||'').replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/([,;])/g,'\\$1');
  // 「姓 名」とスペースで区切られていれば、電話帳の姓・名に分けて入れる
  const nm = String(o.name||'').trim().split(/[\s　]+/), kn = String(o.kana||'').trim().split(/[\s　]+/);
  const L = ['BEGIN:VCARD','VERSION:3.0', nm.length===2 ? 'N:'+esc(nm[0])+';'+esc(nm[1])+';;;' : 'N:'+esc(o.name)+';;;;', 'FN:'+esc(o.name)];
  if (o.kana && kn.length===2){ L.push('X-PHONETIC-LAST-NAME:'+esc(kn[0])); L.push('X-PHONETIC-FIRST-NAME:'+esc(kn[1])); }
  else if (o.kana) L.push('X-PHONETIC-LAST-NAME:'+esc(o.kana));
  if (o.company) L.push('ORG:'+esc(o.company));
  if (o.title) L.push('TITLE:'+esc(o.title));
  if (o.phone) L.push('TEL;TYPE=CELL:'+esc(o.phone));
  if (o.email) L.push('EMAIL;TYPE=INTERNET:'+esc(o.email));
  if (o.web) L.push('URL:'+esc(o.web));
  if (o.address) L.push('ADR:;;'+esc(o.address)+';;;;');
  const note = [o.place && ('出会った場所：'+o.place), o.memo].filter(Boolean).join('\n');
  if (note) L.push('NOTE:'+esc(note));
  L.push('END:VCARD');
  return L.join('\r\n');
}
function downloadVcard(o){
  const blob = new Blob([vcard(o)], {type:'text/vcard;charset=utf-8'});
  const a = el('a', {href:URL.createObjectURL(blob), download:(o.name||'contact')+'.vcf'});
  document.body.append(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function myVcard(c){ return {name:CONFIG.NAME, kana:CONFIG.KANA, company:c.company, title:c.title, phone:c.phone, email:c.email, web:c.web, address:c.address}; }

/* ── QRコード（SVG）── */
function qrSvg(text){
  const q = new QRLib.QRCode(-1, QRLib.ECL.M);
  q.addData(unescape(encodeURIComponent(text))); q.make();
  const n = q.getModuleCount(), pad = 4, size = n + pad*2;
  let d = '';
  for (let r=0;r<n;r++) for (let c=0;c<n;c++) if (q.isDark(r,c)) d += 'M'+(c+pad)+' '+(r+pad)+'h1v1h-1z';
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 '+size+' '+size);
  svg.setAttribute('shape-rendering','crispEdges');
  svg.innerHTML = '<rect width="'+size+'" height="'+size+'" fill="#fff"/><path fill="#111" d="'+d+'"/>';
  return svg;
}

/* ── 保存先（GAS があればスプレッドシート、なければこの端末内）── */
const Store = {
  get remote(){ return !!CONFIG.GAS_URL; },
  async call(payload){
    const res = await fetch(CONFIG.GAS_URL, {method:'POST', body:JSON.stringify(payload)});
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'error');
    return j;
  },
  key(){ return LS.get('key',''); },
  async list(){
    if (this.remote) return (await this.call({action:'list', key:this.key()})).items;
    return LS.get('contacts', []).slice().sort((a,b)=>String(b.created).localeCompare(String(a.created)));
  },
  async add(rec){
    rec = Object.assign({}, rec, {source: rec.source === 'meet' ? 'meet' : 'manual'});
    if (this.remote) return this.call({action:'add', key:this.key(), data:rec});
    const all = LS.get('contacts', []);
    all.push(Object.assign(rec, {id:'L'+Date.now().toString(36), created:new Date().toISOString()}));
    LS.set('contacts', all);
  },
  async update(id, patch){
    if (this.remote) return this.call({action:'update', key:this.key(), id, data:patch});
    LS.set('contacts', LS.get('contacts', []).map(x => x.id===id ? Object.assign(x, patch, {updated:new Date().toISOString()}) : x));
  },
  async remove(id){
    if (this.remote) return this.call({action:'delete', key:this.key(), id});
    LS.set('contacts', LS.get('contacts', []).filter(x => x.id!==id));
  }
};

function contactRows(c){
  const rows = [];
  if (c.phone) rows.push(['電話', c.phone, 'tel:'+c.phone.replace(/[^\d+]/g,'')]);
  if (c.email) rows.push(['メール', c.email, 'mailto:'+c.email]);
  if (c.web) rows.push(['Web', c.web.replace(/^https?:\/\//,''), safeUrl(c.web)]);
  for (const l of (c.links||[])) if (safeUrl(l.url)) rows.push([l.label, '開く', safeUrl(l.url)]);
  if (c.address) rows.push(['住所', c.address, 'https://maps.google.com/?q='+encodeURIComponent(c.address)]);
  if (!rows.length) return null;
  return el('div', {class:'contact-list'}, rows.map(([k,v,href]) =>
    el('a', {href, target: /^https?:/.test(href) ? '_blank' : null, rel:'noopener'}, el('span',{},k), el('span',{},v))));
}

    for (const v of cards){ const d = Math.abs(v.offsetLeft + v.offsetWidth/2 - mid); if (d < bd){ bd = d; best = v; } }
    const c = cardById(best.dataset.id);
    if (c.id !== cur.id){ cur = c; LS.set('card', c.id); drawQr(); }

  drawQr();
  return el('div', {}, car, dots, qrArea);
}

/* 紙の名刺の文字を貼り付けて、項目に振り分ける */
function toHalf(s){ return s.replace(/[０-９Ａ-Ｚａ-ｚ＠．－＋（）]/g, ch => String.fromCharCode(ch.charCodeAt(0)-0xFEE0)).replace(/(\d)[ー―‐−](?=\d)/g, '$1-'); }
function parseCardText(t){
  const out = {};
  const lines = toHalf(t).split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const used = new Set();
  const take = (re, key, fn) => { for (let i=0;i<lines.length;i++){ if (used.has(i)) continue; const m = lines[i].match(re); if (!m) continue; const v = fn ? fn(m, lines[i]) : m[0]; if (v == null) continue; out[key] = v; used.add(i); return; } };
  take(/[\w.+-]+@[\w-]+(\.[\w-]+)+/, 'email');
  take(/(https?:\/\/\S+|www\.\S+)/i, 'web');
  // 携帯を優先、なければ固定電話
  take(/(\+81[\s-]?|0)[789]0[\s-]?\d{4}[\s-]?\d{4}/, 'phone', m => m[0].replace(/\s/g,'-'));
  if (!out.phone) take(/(\+81[\s-]?|0)\d{1,4}[\s-]?\d{1,4}[\s-]?\d{3,4}/, 'phone', m => m[0].replace(/\s/g,'-'));
  take(/(株式会社|有限会社|合同会社|一般社団法人|社団法人|財団法人|NPO法人|事務所|協会|組合|Inc\.?|Co\.,?|Ltd\.?|LLC)/i, 'company', (m,l)=>l);
  take(/(代表|取締役|社長|部長|課長|係長|主任|店長|支配人|マネージャー|担当|CEO|COO|CTO|Director|Manager|オーナー|所長|理事)/i, 'title', (m,l)=>l);
  take(/〒|都|道|府|県|市|区|町|村/, 'address', (m,l)=> /\d/.test(l) ? l : null);
  for (let i=0;i<lines.length;i++){
    if (used.has(i)) continue;
    const l = lines[i];
    if (/^[\p{sc=Hiragana}\s]+$/u.test(l) && !out.kana){ out.kana = l; used.add(i); continue; }
    if (!out.name && l.length <= 14 && !/\d/.test(l)){ out.name = l; used.add(i); }
  }
  return out;
}

const Reader = {
  key: () => LS.get('gemini', ''),
  MODELS: ['gemini-3.1-flash-lite', 'gemini-3.5-flash-lite', 'gemini-3-flash-preview', 'gemini-2.5-flash'],
  PROMPT: 'これは名刺を真上から撮った画像です。書かれている情報を読み取り、指定のJSONで返してください。\n' +
    '・書かれていない項目は空文字にする。推測で補わない。\n' +
    '・name は人の名前（姓と名の間に半角スペース）。kana はふりがな（ひらがな）、nameEn はローマ字・英語表記。\n' +
    '・company は会社名・屋号・店名。title は部署と役職をまとめたもの。\n' +
    '・phone は携帯があれば携帯、なければ代表番号。ハイフン区切り。\n' +
    '・web はURL（https:// から）。address は郵便番号を含む住所。\n' +
    '・hasLogo は、文字以外のロゴマーク・図形、またはデザインされたロゴタイプがあれば true。\n' +
    '・logoBox はそのロゴの範囲を [ymin, xmin, ymax, xmax]（0〜1000の整数）で。ロゴがなければ空配列。\n' +
    '・boxes には、読み取った項目ごとに、名刺のどこに書かれていたかを入れる。field は name, kana, nameEn, company, title, phone, email, web, address のどれか、box は [ymin, xmin, ymax, xmax]（0〜1000の整数）。',
  SCHEMA: { type:'OBJECT', properties:{ name:{type:'STRING'}, kana:{type:'STRING'}, nameEn:{type:'STRING'}, company:{type:'STRING'}, title:{type:'STRING'},
    phone:{type:'STRING'}, email:{type:'STRING'}, web:{type:'STRING'}, address:{type:'STRING'}, hasLogo:{type:'BOOLEAN'}, logoBox:{type:'ARRAY', items:{type:'INTEGER'}},
    boxes:{type:'ARRAY', items:{type:'OBJECT', properties:{field:{type:'STRING'}, box:{type:'ARRAY', items:{type:'INTEGER'}}}}} },
    required:['name','company','phone','email','hasLogo','logoBox'] },
  async call(prompt, b64, schema){
    const body = JSON.stringify({ contents:[{ parts:[{text:prompt}, {inline_data:{mime_type:'image/jpeg', data:b64}}] }],
      generationConfig:{ responseMimeType:'application/json', responseSchema:schema, temperature:0 } });
    const tried = [LS.get('geminiModel', '')].concat(this.MODELS).filter((m, i, a) => m && a.indexOf(m) === i);
    let why = '使えるモデルが見つかりません';
    for (const m of tried){
      const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + m + ':generateContent?key=' + encodeURIComponent(this.key()), {method:'POST', headers:{'Content-Type':'application/json'}, body});
      const j = await res.json().catch(() => ({}));
      if (res.status === 404){ why = 'モデル ' + m + ' が見つかりません'; continue; }
      if (!res.ok) throw new Error(res.status === 400 || res.status === 403 ? 'APIキーを確認してください' : res.status === 429 ? '無料枠の回数を超えました。少し時間をおいてください' : ((j.error && j.error.message) || res.status));
      LS.set('geminiModel', m);
      const t = ((j.candidates || [])[0] || {}).content;
      return JSON.parse(((t && t.parts) || []).map(p => p.text || '').join('') || '{}');
    }
    throw new Error(why);
  },
  toBox(a, pad){
    if (!Array.isArray(a) || a.length !== 4) return null;
    const [y0, x0, y1, x1] = a.map(v => Math.max(0, Math.min(1000, +v)) / 1000);
    if (!(x1 > x0 && y1 > y0)) return null;
    const px = (x1 - x0) * pad, py = (y1 - y0) * pad;
    return {x:Math.max(0, x0 - px), y:Math.max(0, y0 - py), w:Math.min(1, x1 + px) - Math.max(0, x0 - px), h:Math.min(1, y1 + py) - Math.max(0, y0 - py)};
  },
  async gemini(b64){
    const o = await this.call(this.PROMPT, b64, this.SCHEMA);
    const f = {}; for (const k of ['name','kana','nameEn','company','title','phone','email','web','address']) if (o[k]) f[k] = String(o[k]).trim();
    const boxes = {};
    for (const x of (Array.isArray(o.boxes) ? o.boxes : [])){ const b = this.toBox(x && x.box, .02); if (b && FIELD_JA[x.field] && f[x.field]) boxes[x.field] = b; }
    return {fields:f, boxes, logoBox:o.hasLogo ? this.toBox(o.logoBox, .06) : null, hasLogo:!!o.hasLogo, by:'Gemini'};
  },
  async text(b64, k){
    const hint = {phone:'電話番号はハイフン区切りで。', email:'メールアドレスだけを。', web:'URLだけを。', kana:'ふりがな（ひらがな）で。', name:'姓と名の間に半角スペース。', address:'郵便番号から住所まで1行で。'}[k] || '';
    const o = await this.call('この画像は名刺の一部を切り出したものです。写っている文字だけを、そのまま書き出してください。推測で補わない。' + hint, b64, {type:'OBJECT', properties:{text:{type:'STRING'}}, required:['text']});
    return String(o.text || '');
  }
};
function jpegB64(c, maxW, q){
  const s = Math.min(1, maxW / c.width), o = document.createElement('canvas'); o.width = Math.round(c.width * s); o.height = Math.round(c.height * s);
  o.getContext('2d').drawImage(c, 0, 0, o.width, o.height);
  return o.toDataURL('image/jpeg', q).split(',')[1];
}
async function readCard(mode, card, A, box, say){

}
function cropCanvas(src, b, minH){
  const sx = b.x * src.width, sy = b.y * src.height, sw = Math.max(4, b.w * src.width), sh = Math.max(4, b.h * src.height);
  const k = Math.max(1, Math.min(3, minH / sh, 1800 / sw));
  const c = document.createElement('canvas'); c.width = Math.round(sw * k); c.height = Math.round(sh * k);
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(src, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c;
}
function cleanField(k, t){
  let s = String(t || '').trim();
  if (['phone','email','web'].includes(k)) s = toHalf(s);
  if (k === 'phone'){ const m = s.match(/(\+?\d[\d\s\-()]{7,}\d)/); return m ? m[1].replace(/[()]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-') : s.replace(/\s+/g, ''); }
  if (k === 'email'){ const m = s.replace(/\s+/g, '').match(/[\w.+-]+@[\w-]+(\.[\w-]+)+/); return m ? m[0] : s.replace(/\s+/g, ''); }
  if (k === 'web'){ const m = s.replace(/\s+/g, '').match(/(https?:\/\/\S+|www\.\S+|[\w-]+(\.[\w-]+)+\/?\S*)/i); return m ? m[0] : s.replace(/\s+/g, ''); }
  return s.split(/\r?\n/).map(x => x.trim()).filter(Boolean).join(' ');
}
function toHex(rgb){ return '#' + rgb.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join(''); }
function cardColor(logo, A){
  if (A.dark) return toHex(A.bgRGB);
  if (!logo) return null;
  let c = logo.color, n = parseInt(c.slice(1), 16), rgb = [n >> 16, (n >> 8) & 255, n & 255];
  while (lum(toHex(rgb)) > 150) rgb = rgb.map(v => v * .85);          // 白い地で読める濃さまで下げる
  return toHex(rgb);
}
const FIELD_JA = {name:'お名前', kana:'ふりがな', nameEn:'英語表記', company:'会社・屋号', title:'肩書き', phone:'電話', email:'メール', web:'Web', address:'住所'};

  }
  function step2(photo){
    let q = Scan.findCard(photo);
    const prev = document.createElement('canvas'), ps = Math.min(1, 1000 / Math.max(photo.width, photo.height));
    const paint = () => { prev.width = Math.round(photo.width * ps); prev.height = Math.round(photo.height * ps); prev.getContext('2d').drawImage(photo, 0, 0, prev.width, prev.height); };
    paint();

    const draw = () => {
      ov.setAttribute('viewBox', '0 0 ' + photo.width + ' ' + photo.height);

    };
    let drag = -1;

  function step3(photo, q){

        let h = '';
        for (const k in boxes) h += R(boxes[k], 'fb' + (target === k ? ' on' : ''), FIELD_JA[k]);
        if (logoBox && useLogo.checked) h += R(logoBox, 'lb', 'ロゴ');
        if (drawing) h += R(drawing, 'drw', '');
        ov.innerHTML = h;
      };
      const pt = e => { const b = ov.getBoundingClientRect(); return [Math.max(0, Math.min(1, (e.clientX - b.left) / b.width)), Math.max(0, Math.min(1, (e.clientY - b.top) / b.height))]; };
      ov.addEventListener('pointerdown', e => { if (!target) return; start = pt(e); drawing = {x:start[0], y:start[1], w:0, h:0}; ov.setPointerCapture(e.pointerId); e.preventDefault(); drawOv(); });
      ov.addEventListener('pointermove', e => { if (!start) return; const [x, y] = pt(e); drawing = {x:Math.min(x, start[0]), y:Math.min(y, start[1]), w:Math.abs(x - start[0]), h:Math.abs(y - start[1])}; drawOv(); });
      ov.addEventListener('pointerup', () => {
        if (!start) return; const b = drawing, k = target; start = null; drawing = null;
        if (!b || b.w < .02 || b.h < .02){ drawOv(); return; }
        setTarget(null); finish(k, b);
      });
      const hint = el('div', {class:'msg info hint hidden', 'aria-live':'polite'});
      const cropBox = el('div', {class:'crop card-crop'}, show, ov);
      function setTarget(k){
        target = k;
        Object.entries(rows).forEach(([kk, r]) => r.classList.toggle('on', kk === k));
        cropBox.classList.toggle('drawing', !!k);
        if (k){ hint.textContent = '名刺の画像の上で、「' + (k === 'logo' ? 'ロゴ' : FIELD_JA[k]) + '」の所を指でなぞって囲んでください。'; hint.classList.remove('hidden'); cropBox.scrollIntoView({behavior:'smooth', block:'start'}); }
        else hint.classList.add('hidden');
        drawOv();
      }
      async function finish(k, b){
        if (k === 'logo'){ logoBox = b; logoTouched = true; useLogo.checked = true; drawOv(); return; }
        boxes[k] = b; drawOv();
        const inp = inputs[k], old = inp.value; inp.value = ''; inp.placeholder = 'この範囲を読み取っています…'; rows[k].classList.add('busy');
        try{ inp.value = await readRegion(k, b) || old; inp.placeholder = ''; }
        catch(e){ inp.value = old; inp.placeholder = ''; toast('読み取れませんでした（' + e.message + '）'); }
        rows[k].classList.remove('busy');
      }
      async function readRegion(k, b){
        const p = {x:Math.max(0, b.x - .01), y:Math.max(0, b.y - .02)}; p.w = Math.min(1 - p.x, b.w + .02); p.h = Math.min(1 - p.y, b.h + .04);
        if (mode === 'self' && Reader.key()) return cleanField(k, await Reader.text(jpegB64(cropCanvas(card, p, 140), 1600, .92), k));
        if (mode === 'other' && Store.remote){ const r = await Store.call({action:'ocr', key:Store.key(), image:jpegB64(cropCanvas(card, p, 140), 1600, .92)}); return cleanField(k, r.text); }
        if (!ocrCanvas) ocrCanvas = Scan.forOcr(card, A, null);
        return cleanField(k, await Scan.ocr(cropCanvas(ocrCanvas, p, 90), null, k === 'address' || k === 'title' ? 6 : 7));
      }
      const fieldRows = keys.map(k => {
        const inp = el('input', {maxlength:'200', 'aria-label':FIELD_JA[k], type:k === 'email' ? 'email' : k === 'phone' ? 'tel' : 'text'});
        inputs[k] = inp;
        return rows[k] = el('div', {class:'frow'}, el('span', {class:'fl'}, FIELD_JA[k]), inp,
          el('button', {class:'rbtn', 'aria-label':FIELD_JA[k] + 'を、名刺の範囲を選んで読み取る', onclick:()=>setTarget(target === k ? null : k)}, '範囲'));
      });
      if (mode === 'self') rows.logo = el('div', {class:'frow logo-row'}, el('label', {class:'check', for:'uselogo', style:'margin:0'}, useLogo, el('span', {}, 'ロゴを取り込む')),
        el('span'), el('button', {class:'rbtn', 'aria-label':'ロゴの範囲を選ぶ', onclick:()=>setTarget(target === 'logo' ? null : 'logo')}, '範囲'));
      useLogo.addEventListener('change', () => { if (useLogo.checked && !logoBox) setTarget('logo'); drawOv(); });
      drawOv();
      const status = el('div', {class:'msg info', 'aria-live':'polite'}, '読み取りを始めます…');
      const go = el('button', {class:'btn-main', onclick:()=>{
        const logo = (mode === 'self' && useLogo.checked && logoBox) ? Scan.vectorize(card, logoBox, A) : null;
        const fields = {}; for (const k of keys){ const v = inputs[k].value.trim(); if (v) fields[k] = v; }
        sheet.remove();
        onDone({fields, logo, color:cardColor(logo, A), dark:A.dark, by});
      }}, 'この内容で進む');
      body.replaceChildren(cropBox, hint, status,
        el('p', {class:'note', style:'margin:10px 0 4px'}, '違っている所は、そのまま書き直すか、「範囲」を押して名刺の上をなぞると、その部分だけ読み直します。'),
        rows.logo || null, fieldRows, el('div', {style:'margin-top:16px'}, go));
      readCard(mode, card, A, logoBox, t => status.textContent = t).then(r => {
        by = r.by;
        for (const k of keys) if (r.fields[k] && !inputs[k].value) inputs[k].value = r.fields[k];
        Object.assign(boxes, r.boxes || {});
        if (mode === 'self' && !logoTouched){
          if (r.logoBox){ logoBox = r.logoBox; useLogo.checked = true; }
          else if (r.by === 'Gemini' && r.hasLogo === false){ useLogo.checked = false; }
        }
        drawOv();
        const n = keys.filter(k => r.fields[k]).length;
        status.className = 'msg ' + (n ? 'ok' : 'ng');
        status.textContent = n ? r.by + 'で ' + n + ' 項目を読み取りました。' : '文字を読み取れませんでした。「範囲」で項目ごとに読み取るか、入力してください。';
      }).catch(e => {
        status.className = 'msg ng'; status.textContent = '自動では読み取れませんでした（' + e.message + '）。「範囲」で項目ごとに読み取るか、入力してください。';
      });
    }, 30);
  }
  step1();
}
function cardFromScan(r, base){
  const f = r.fields || {}, c = Object.assign(base || blankCard(), {});
  for (const k of ['company','title','phone','email','web','address']) if (f[k]) c[k] = f[k];
  if (f.web) c.web = safeUrl(f.web) || f.web;
  if (r.logo){ c.logo = {w:r.logo.w, h:r.logo.h, p:r.logo.p}; c.mark = true; }
  if (r.color) c.color = r.color;
  c.tpl = r.dark ? 'ink' : (c.tpl || 'line');
  if (!c.label || c.label === '仕事用') c.label = f.company || c.label || '仕事用';
  return c;
}

/* ━━━━━━━━━━ はじめて開いたとき：名刺を作る ━━━━━━━━━━ */
function renderSetup(pre){
  document.querySelector('nav.tabs')?.remove();
  pre = pre || {};
  const name = el('input', {maxlength:'40', autocomplete:'name', placeholder:'例：山田 花子', value:pre.name || ''});
  const kana = el('input', {maxlength:'40', placeholder:'例：やまだ はなこ', value:pre.kana || ''});
  const info = el('div');
  const c = pre.card || Object.assign(blankCard(), {label:'仕事用'});
  const ed = cardEditor(c, {hasBirth:false});
  const nameSync = () => { CONFIG.NAME = name.value.trim() || 'あなたの名前'; ed.node.querySelector('.pv .stage').replaceChildren(cardView(ed.c)); };
  name.addEventListener('input', nameSync);
  CONFIG.NAME = name.value.trim() || 'あなたの名前'; ed.node.querySelector('.pv .stage').replaceChildren(cardView(ed.c));
  $app.replaceChildren(el('div', {class:'setup'},
    el('div', {class:'hero'},
      el('div', {class:'eyebrow'}, 'DIGITAL MEISHI'),
      el('h1', {}, 'スマホで渡せる名刺を、', el('br'), '1分で。'),
      el('p', {}, '無料・登録なし。作った名刺は、QRコードを見せるだけで相手に渡せます。相手はアプリを入れなくても、そのまま電話帳に登録できます。')),
    pre.card ? el('div', {class:'msg ok'}, '名刺の写真から読み取りました。間違いがないか確認して、足りない所を入れてください。' + (pre.card.logo ? 'ロゴも取り込みました。' : ''))
      : el('div', {class:'scan-cta'},
          el('button', {class:'btn-main', onclick:()=>scanSheet('self', r => renderSetup({name:(r.fields||{}).name, kana:(r.fields||{}).kana, nameEn:(r.fields||{}).nameEn, card:cardFromScan(r, Object.assign(blankCard(), {label:'仕事用'}))}))}, '今の名刺を撮って作る'),
          el('p', {class:'note', style:'text-align:center;margin:8px 0 0'}, '紙の名刺を1枚撮るだけで、文字もロゴも取り込みます。下から手で入力することもできます。')),
    el('h2', {}, 'あなたの名前'),
    el('label', {}, 'お名前', el('b',{},'必須')), name,
    el('label', {}, 'ふりがな'), kana,
    el('p', {class:'note'}, '入れた情報は、このスマホの中にだけ保存されます。'),
    ed.node, info,
    el('div', {style:'margin-top:22px'}, el('button', {class:'btn-main', onclick: async ()=>{
      if (!name.value.trim()){ info.replaceChildren(el('div', {class:'msg ng'}, 'お名前を入れてください')); name.focus(); name.scrollIntoView({block:'center'}); return; }
      const cc = ed.c; if (!String(cc.label||'').trim()) cc.label = '仕事用';
      cc.fortune = false;
      cc.links = (cc.links || []).filter(l => safeUrl(l.url)).map(l => ({label:String(l.label||'').trim() || 'リンク', url:safeUrl(l.url)}));
      await Profile.save({name:name.value.trim(), kana:kana.value.trim(), nameEn:pre.nameEn || '', birth:'', gas:'', cards:[cc]});
      LS.set('card', cc.id); tab = 'show'; renderOwner(); window.scrollTo(0, 0); toast('名刺ができました');
    }}, 'この名刺で始める'))));
}

/* ── アプリとしてインストール ── */
let installEvt = null;
const isInstalled = () => matchMedia('(display-mode: standalone)').matches;
let OWNER = false;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (OWNER && tab==='set') renderOwner(); });
window.addEventListener('appinstalled', () => { installEvt = null; if (OWNER) renderOwner(); });
if ('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
function installBox(){
  if (isInstalled()) return el('div', {class:'msg ok'}, 'アプリとしてインストール済みです。');
  if (installEvt) return el('button', {class:'btn-main', onclick: async ()=>{ installEvt.prompt(); await installEvt.userChoice; installEvt = null; renderOwner(); }}, 'アプリとしてインストール');
  return el('p', {class:'note'}, 'ボタンが出ないときは、Chromeの右上「︙」→「アプリをインストール」（または「ホーム画面に追加」）から入れられます。');
}

/* ━━━━━━━━━━ プライバシーポリシー（?privacy）━━━━━━━━━━ */
function renderPrivacy(){
  const P = CONFIG.PRIVACY;
  document.title = 'プライバシーポリシー｜' + P.operator;
  $app.replaceChildren(el('div', {class:'policy'},
    el('h1', {}, 'プライバシーポリシー'),
    el('p', {}, P.operator + '（以下「当方」）は、このデジタル名刺で取得する個人情報を、次のとおり取り扱います。'),
    P.items.map(([h, b]) => [el('h2', {}, h), el('p', {}, b)]),
    el('p', {class:'note'}, 'このページは、デジタル名刺の持ち主の情報をもとに表示しています。')));
}

/* 起動：# に名刺があれば相手の画面、なければ自分の画面 */
(async () => {
  const code = location.hash.slice(1);
  if (code){
    let d = null; try{ d = await Codec.dec(code); }catch(e){}
    if (d && d.v === 1 && d.c && d.n){ applyPayload(d, code); return params.has('privacy') ? renderPrivacy() : renderVisitor(); }
    $app.replaceChildren(el('div', {class:'msg ng', style:'margin-top:40px'}, 'この名刺のリンクは読み込めませんでした。リンクが途中で切れていないか、送った人に確認してください。'));
    return;
  }
  OWNER = true;
  const p = Profile.get();
  if (!p || !Array.isArray(p.cards) || !p.cards.length) return renderSetup();
  await Profile.save(p);
  renderOwner();
})();
window.addEventListener('hashchange', () => location.reload());
})();
</script>
