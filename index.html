      body.replaceChildren(el('p', {class:'note', style:'margin-top:30px;text-align:center'}, '写真を読み込んでいます…'));
      try{ step2(await Scan.load(f)); }catch(e){ step1('写真を読み込めませんでした。別の写真で試してください。'); }
    });
    return el('label', {class:'btn filebtn ' + cls}, text, i);
  }
  function step1(err){
    body.replaceChildren(
      el('div', {class:'scan-hero'},
        el('div', {class:'scan-ill', 'aria-hidden':'true'}, el('span')),
        el('h2', {}, mode === 'self' ? '今お使いの名刺を、1枚撮ってください' : '受け取った名刺を、1枚撮ってください'),
        el('p', {class:'note'}, '名刺と色が違う平らな所（机など）に置いて、なるべく真上から。明るい場所で、影や光の反射が入らないように撮ると、きれいに読み取れます。')),
      err ? el('div', {class:'msg ng'}, err) : null,
      el('div', {class:'stack'}, picker(true, 'btn-main', 'カメラで撮る'), picker(false, 'btn-sub', '写真から選ぶ')),
      el('p', {class:'note', style:'margin-top:10px'}, 'カメラが開かないときは、このページをChromeで開いてください。アプリの中のブラウザ（LINEやファイルのプレビューなど）では、カメラを使えないことがあります。'),
      el('p', {class:'note', style:'margin-top:16px'}, engine));
  }
  function step2(photo){
    let q = Scan.findCard(photo);
    const prev = document.createElement('canvas'), ps = Math.min(1, 1000 / Math.max(photo.width, photo.height));
    const paint = () => { prev.width = Math.round(photo.width * ps); prev.height = Math.round(photo.height * ps); prev.getContext('2d').drawImage(photo, 0, 0, prev.width, prev.height); };
    paint();
    const NS = 'http://www.w3.org/2000/svg', ov = document.createElementNS(NS, 'svg');
    const draw = () => {
      ov.setAttribute('viewBox', '0 0 ' + photo.width + ' ' + photo.height);
      const r = Math.max(photo.width, photo.height) * .03;
      ov.innerHTML = '<path class="shade" fill-rule="evenodd" d="M0 0H' + photo.width + 'V' + photo.height + 'H0Z M' + q.map(p => p.join(' ')).join(' L') + 'Z"/><polygon class="edge" points="' + q.map(p => p.join(',')).join(' ') + '"/>'
        + q.map((p, i) => '<g class="hd" data-i="' + i + '"><circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + (r * 2.2) + '" fill="transparent"/><circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + r + '"/></g>').join('');
    };
    let drag = -1;
    const toPhoto = e => { const b = ov.getBoundingClientRect(); return [Math.max(0, Math.min(photo.width, (e.clientX - b.left) / b.width * photo.width)), Math.max(0, Math.min(photo.height, (e.clientY - b.top) / b.height * photo.height))]; };
    ov.addEventListener('pointerdown', e => {
      const g = e.target.closest('.hd'); let i = g ? +g.dataset.i : -1;
      if (i < 0){ const p = toPhoto(e); let bd = 1e18; q.forEach((c, k) => { const d = (c[0]-p[0])**2 + (c[1]-p[1])**2; if (d < bd){ bd = d; i = k; } }); }
      drag = i; ov.setPointerCapture(e.pointerId); q[i] = toPhoto(e); draw(); e.preventDefault();
    });
    ov.addEventListener('pointermove', e => { if (drag < 0) return; q[drag] = toPhoto(e); draw(); });
    ov.addEventListener('pointerup', () => { drag = -1; });
    draw();
    body.replaceChildren(
      el('p', {class:'note'}, '名刺の四隅に、丸を合わせてください。丸を指で動かせます。'),
      el('div', {class:'crop'}, prev, ov),
      el('div', {class:'row', style:'margin-top:12px'},
        el('button', {class:'btn-sub', onclick:()=>{ photo = Scan.rotate(photo); q = Scan.findCard(photo); paint(); draw(); }}, '90°回す'),
        el('button', {class:'btn-sub', onclick:()=>step1()}, '撮り直す')),
      el('div', {style:'margin-top:10px'}, el('button', {class:'btn-main', onclick:()=>step3(photo, q)}, 'この範囲で読み取る')));
  }
  function step3(photo, q){
    body.replaceChildren(el('p', {class:'note', style:'margin-top:30px;text-align:center'}, '名刺をまっすぐにしています…'));
    setTimeout(() => {
      const card = Scan.warp(photo, q), A = Scan.analyze(card);
      const keys = ['name','kana'].concat(mode === 'self' ? ['nameEn'] : [], ['company','title','phone','email','web','address']);
      const boxes = {}, inputs = {}, rows = {};
      let logoBox = mode === 'self' ? Scan.findLogo(A) : null, logoTouched = false, target = null, drawing = null, start = null, ocrCanvas = null, by = '', engine = null;
      const useLogo = el('input', {type:'checkbox', id:'uselogo'}); useLogo.checked = !!logoBox;
      const show = document.createElement('canvas'); show.width = Math.min(1000, card.width); show.height = Math.round(card.height * show.width / card.width);
      show.getContext('2d').drawImage(card, 0, 0, show.width, show.height);
      const H = 1000 * card.height / card.width;
      const NS = 'http://www.w3.org/2000/svg', ov = document.createElementNS(NS, 'svg');
      ov.setAttribute('viewBox', '0 0 1000 ' + Math.round(H)); ov.setAttribute('preserveAspectRatio', 'none');
      const R = (b, cls, label) => '<rect class="' + cls + '" x="' + b.x*1000 + '" y="' + b.y*H + '" width="' + b.w*1000 + '" height="' + b.h*H + '"/>' + (label ? '<text class="' + cls + 't" x="' + b.x*1000 + '" y="' + Math.max(24, b.y*H - 8) + '">' + label + '</text>' : '');
      const drawOv = () => {
        let h = '';
        for (const k in boxes) h += R(boxes[k], 'fb' + (target === k ? ' on' : ''), FIELD_JA[k]);
        if (logoBox && useLogo.checked) h += R(logoBox, 'lb', 'ロゴ');
        if (drawing) h += R(drawing, 'drw', '');
        ov.innerHTML = h;
      };
      const pt = e => { const b = ov.getBoundingClientRect(); return [Math.max(0, Math.min(1, (e.clientX - b.left) / b.width)), Math.max(0, Math.min(1, (e.clientY - b.top) / b.height))]; };
      ov.addEventListener('pointerdown', e => { if (!target) return; start = pt(e); drawing = {x:start[0], y:start[1], w:0, h:0}; ov.setPointerCapture(e.pointerId); e.preventDefault(); drawOv(); });
      ov.addEventListener('pointermove', e => { if (!start) return; const [x, y] = pt(e); drawing = {x:Math.min(x, start[0]), y:Math.min(y, start[1]), w:Math.abs(x - start[0]), h:Math.abs(y - start[1])}; drawOv(); });
      ov.addEventListener('pointerup', () => {
        if (!start) return; const b = drawing, k = target; start = null; drawing = null;
        if (!b || b.w < .02 || b.h < .02){ drawOv(); return; }
        setTarget(null); finish(k, b);
      });
      const hint = el('div', {class:'msg info hint hidden', 'aria-live':'polite'});
      const cropBox = el('div', {class:'crop card-crop'}, show, ov);
      function setTarget(k){
        target = k;
        Object.entries(rows).forEach(([kk, r]) => r.classList.toggle('on', kk === k));
        cropBox.classList.toggle('drawing', !!k);
        if (k){ hint.textContent = '名刺の画像の上で、「' + (k === 'logo' ? 'ロゴ' : FIELD_JA[k]) + '」の所を指でなぞって囲んでください。'; hint.classList.remove('hidden'); cropBox.scrollIntoView({behavior:'smooth', block:'start'}); }
        else hint.classList.add('hidden');
        drawOv();
      }
      async function finish(k, b){
        if (k === 'logo'){ logoBox = b; logoTouched = true; useLogo.checked = true; drawOv(); return; }
        boxes[k] = b; drawOv();
        const inp = inputs[k], old = inp.value; inp.value = ''; inp.placeholder = 'この範囲を読み取っています…'; rows[k].classList.add('busy');
        try{ inp.value = await readRegion(k, b) || old; inp.placeholder = ''; }
        catch(e){ inp.value = old; inp.placeholder = ''; toast('読み取れませんでした（' + e.message + '）'); }
        rows[k].classList.remove('busy');
      }
      async function readRegion(k, b){
        const p = {x:Math.max(0, b.x - .01), y:Math.max(0, b.y - .02)}; p.w = Math.min(1 - p.x, b.w + .02); p.h = Math.min(1 - p.y, b.h + .04);
        const eng = engine || engineFor(mode);
        if (!eng) throw new Error('読み取り方法が決まっていません。上の案内から選んでください');
        if (eng === 'gemini') return cleanField(k, await Reader.text(jpegB64(cropCanvas(card, p, 140), 1600, .92), k));
        if (eng === 'drive'){ const r = await Store.call({action:'ocr', key:Store.key(), image:jpegB64(cropCanvas(card, p, 140), 1600, .92)}); return cleanField(k, r.text); }
        if (!ocrCanvas) ocrCanvas = Scan.forOcr(card, A, null);
        return cleanField(k, await Scan.ocr(cropCanvas(ocrCanvas, p, 90), null, k === 'address' || k === 'title' ? 6 : 7));
      }
      const fieldRows = keys.map(k => {
        const inp = el('input', {maxlength:'200', 'aria-label':FIELD_JA[k], type:k === 'email' ? 'email' : k === 'phone' ? 'tel' : 'text'});
        inputs[k] = inp;
        return rows[k] = el('div', {class:'frow'}, el('span', {class:'fl'}, FIELD_JA[k]), inp,
          el('button', {class:'rbtn', 'aria-label':FIELD_JA[k] + 'を、名刺の範囲を選んで読み取る', onclick:()=>setTarget(target === k ? null : k)}, '範囲'));
      });
      if (mode === 'self') rows.logo = el('div', {class:'frow logo-row'}, el('label', {class:'check', for:'uselogo', style:'margin:0'}, useLogo, el('span', {}, 'ロゴを取り込む')),
        el('span'), el('button', {class:'rbtn', 'aria-label':'ロゴの範囲を選ぶ', onclick:()=>setTarget(target === 'logo' ? null : 'logo')}, '範囲'));
      useLogo.addEventListener('change', () => { if (useLogo.checked && !logoBox) setTarget('logo'); drawOv(); });
      drawOv();
      const status = el('div', {class:'msg info', 'aria-live':'polite'}, '読み取りを始めます…');
      const go = el('button', {class:'btn-main', onclick:()=>{
        const logo = (mode === 'self' && useLogo.checked && logoBox) ? Scan.vectorize(card, logoBox, A) : null;
        const fields = {}; for (const k of keys){ const v = inputs[k].value.trim(); if (v) fields[k] = v; }
        sheet.remove();
        onDone({fields, logo, color:cardColor(logo, A), dark:A.dark, by});
      }}, 'この内容で進む');
      body.replaceChildren(cropBox, hint, status,
        el('p', {class:'note', style:'margin:10px 0 4px'}, '違っている所は、そのまま書き直すか、「範囲」を押して名刺の上をなぞると、その部分だけ読み直します。'),
        rows.logo || null, fieldRows, el('div', {style:'margin-top:16px'}, go));
      const choose = el('div');
      function chooser(why){
        const kin = el('input', {type:'password', autocomplete:'off', placeholder:'AIza… で始まるキーを貼る', value:Reader.key()});
        const canGem = mode === 'self' || LS.get('geminiOthers', false);
        choose.replaceChildren(el('div', {class:'choose'},
          why ? el('div', {class:'msg ng', style:'margin-top:0'}, why) : null,
          mode === 'self' || canGem ? [
            el('p', {class:'note', style:'margin-top:0'}, 'Gemini を使うと、文字とロゴの場所を正確に読み取れます（無料）。APIキーを貼って「読み取る」を押してください。'),
            el('a', {class:'small-link', href:'https://aistudio.google.com/apikey', target:'_blank', rel:'noopener'}, 'APIキーを作る（Google AI Studio が開きます）'),
            kin,
            el('button', {class:'btn-main', style:'margin-top:10px', onclick:()=>{ const v = kin.value.trim(); if (!v){ kin.focus(); return; } LS.set('gemini', v); LS.set('geminiModel', ''); run('gemini'); }}, 'Gemini で読み取る')
          ] : el('p', {class:'note', style:'margin-top:0'}, '受け取った名刺を正確に読むには、「設定」でGoogleスプレッドシートにつなぐか、「受け取った名刺にもGeminiを使う」をオンにしてください。'),
          el('button', {class:'btn-sub', style:'margin-top:10px', onclick:()=>run('local')}, 'スマホの中で読む（精度は低め）')));
      }
      function run(eng){
        engine = eng; choose.replaceChildren();
        status.className = 'msg info'; status.classList.remove('hidden');
        readCard(eng, card, A, logoBox, t => status.textContent = t).then(r => {
          by = r.by;
          for (const k of keys) if (r.fields[k] && !inputs[k].value) inputs[k].value = r.fields[k];
          Object.assign(boxes, r.boxes || {});
          if (mode === 'self' && !logoTouched){
            if (r.logoBox){ logoBox = r.logoBox; useLogo.checked = true; }
            else if (r.by === 'Gemini' && r.hasLogo === false){ useLogo.checked = false; }
          }
          drawOv();
          const n = keys.filter(k => r.fields[k]).length;
          status.className = 'msg ' + (n ? 'ok' : 'ng');
          status.textContent = n ? r.by + 'で ' + n + ' 項目を読み取りました。' : r.by + 'では文字を読み取れませんでした。';
          if (eng === 'local') choose.replaceChildren(el('p', {class:'note'}, 'スマホの中の読み取りは精度が低めです。読み間違いが多いときは、Gemini で読み直せます。'), el('button', {class:'btn-sub', onclick:()=>chooser()}, 'Gemini で読み直す'));
        }).catch(e => {
          status.classList.add('hidden');
          chooser(ENGINE_JA[eng] + 'で読み取れませんでした：' + e.message);
        });
      }
      body.insertBefore(choose, status.nextSibling);
      const first = engineFor(mode);
      if (first) run(first); else { status.classList.add('hidden'); chooser(mode === 'self' ? 'Gemini のAPIキーが入っていないので、まだ読み取っていません。' : ''); }
    }, 30);
  }
  step1();
}
function cardFromScan(r, base){
  const f = r.fields || {}, c = Object.assign(base || blankCard(), {});
  for (const k of ['company','title','phone','email','web','address']) if (f[k]) c[k] = f[k];
  if (f.web) c.web = safeUrl(f.web) || f.web;
  if (r.logo){ c.logo = {w:r.logo.w, h:r.logo.h, p:r.logo.p}; c.mark = true; }
  if (r.color) c.color = r.color;
  c.tpl = r.dark ? 'ink' : (c.tpl || 'line');
  if (!c.label || c.label === '仕事用') c.label = f.company || c.label || '仕事用';
  return c;
}

/* ━━━━━━━━━━ はじめて開いたとき：名刺を作る ━━━━━━━━━━ */
function renderSetup(pre){
  document.querySelector('nav.tabs')?.remove();
  pre = pre || {};
  const name = el('input', {maxlength:'40', autocomplete:'name', placeholder:'例：山田 花子', value:pre.name || ''});
  const kana = el('input', {maxlength:'40', placeholder:'例：やまだ はなこ', value:pre.kana || ''});
  const info = el('div');
  const c = pre.card || Object.assign(blankCard(), {label:'仕事用'});
  const ed = cardEditor(c, {hasBirth:false});
  const nameSync = () => { CONFIG.NAME = name.value.trim() || 'お名前'; ed.node.querySelector('.pv .stage').replaceChildren(cardView(ed.c)); };
  name.addEventListener('input', nameSync);
  CONFIG.NAME = name.value.trim() || 'お名前'; ed.node.querySelector('.pv .stage').replaceChildren(cardView(ed.c));
  $app.replaceChildren(el('div', {class:'setup'},
    el('div', {class:'hero'},
      el('div', {class:'eyebrow'}, 'DIGITAL MEISHI'),
      el('h1', {}, 'スマホで渡せる名刺を、', el('br'), '1分で。'),
      el('p', {}, '無料・登録なし。作った名刺は、QRコードを見せるだけで相手に渡せます。相手はアプリを入れなくても、そのまま電話帳に登録できます。')),
    pre.card ? el('div', {class:'msg ok'}, '名刺の写真から読み取りました。間違いがないか確認して、足りない所を入れてください。' + (pre.card.logo ? 'ロゴも取り込みました。' : ''))
      : el('div', {class:'scan-cta'},
          el('button', {class:'btn-main', onclick:()=>scanSheet('self', r => renderSetup({name:(r.fields||{}).name, kana:(r.fields||{}).kana, nameEn:(r.fields||{}).nameEn, card:cardFromScan(r, Object.assign(blankCard(), {label:'仕事用'}))}))}, '今の名刺を撮って作る'),
          el('p', {class:'note', style:'text-align:center;margin:8px 0 0'}, '紙の名刺を1枚撮るだけで、文字もロゴも取り込みます。下から手で入力することもできます。')),
    el('h2', {}, 'お名前'),
    el('label', {}, 'お名前', el('b',{},'必須')), name,
    el('label', {}, 'ふりがな'), kana,
    el('p', {class:'note'}, '入れた情報は、このスマホの中にだけ保存されます。'),
    ed.node, info,
    el('div', {style:'margin-top:22px'}, el('button', {class:'btn-main', onclick: async ()=>{
      if (!name.value.trim()){ info.replaceChildren(el('div', {class:'msg ng'}, 'お名前を入れてください')); name.focus(); name.scrollIntoView({block:'center'}); return; }
      const cc = ed.c; if (!String(cc.label||'').trim()) cc.label = '仕事用';
      cc.fortune = false;
      cc.links = (cc.links || []).filter(l => safeUrl(l.url)).map(l => ({label:String(l.label||'').trim() || 'リンク', url:safeUrl(l.url)}));
      await Profile.save({name:name.value.trim(), kana:kana.value.trim(), nameEn:pre.nameEn || '', birth:'', gas:'', cards:[cc]});
      LS.set('card', cc.id); tab = 'show'; renderOwner(); window.scrollTo(0, 0); toast('名刺ができました');
    }}, 'この名刺で始める'))));
}

/* ── アプリとしてインストール ── */
let installEvt = null;
const isInstalled = () => matchMedia('(display-mode: standalone)').matches;
let OWNER = false;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (OWNER && tab==='set') renderOwner(); });
window.addEventListener('appinstalled', () => { installEvt = null; if (OWNER) renderOwner(); });
if ('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
function installBox(){
  if (isInstalled()) return el('div', {class:'msg ok'}, 'アプリとしてインストール済みです。');
  if (installEvt) return el('button', {class:'btn-main', onclick: async ()=>{ installEvt.prompt(); await installEvt.userChoice; installEvt = null; renderOwner(); }}, 'アプリとしてインストール');
  return el('p', {class:'note'}, 'ボタンが出ないときは、Chromeの右上「︙」→「アプリをインストール」（または「ホーム画面に追加」）から入れられます。');
}

/* ━━━━━━━━━━ プライバシーポリシー（?privacy）━━━━━━━━━━ */
function renderPrivacy(){
  const P = CONFIG.PRIVACY;
  document.title = 'プライバシーポリシー｜' + P.operator;
  $app.replaceChildren(el('div', {class:'policy'},
    el('h1', {}, 'プライバシーポリシー'),
    el('p', {}, P.operator + '（以下「当方」）は、このデジタル名刺で取得する個人情報を、次のとおり取り扱います。'),
    P.items.map(([h, b]) => [el('h2', {}, h), el('p', {}, b)]),
    el('p', {class:'note'}, 'このページは、デジタル名刺の持ち主の情報をもとに表示しています。')));
}

function renderImport(src, contacts){
  const p = {name:String(src.name || '').slice(0, 40), kana:String(src.kana || '').slice(0, 40), nameEn:String(src.nameEn || '').slice(0, 60),
    birth:/^\d{4}-\d{2}-\d{2}$/.test(src.birth || '') ? src.birth : '', gas:/^https:\/\/script\.google\.com\//.test(src.gas || '') ? src.gas : '', cards:src.cards.slice(0, 12).map(safeCard)};
  const inC = Array.isArray(contacts) ? contacts.filter(x => x && x.name).slice(0, 3000) : [];
  const had = Profile.get();
  CONFIG.NAME = p.name; CONFIG.CARDS = p.cards;
  $app.replaceChildren(el('div', {class:'setup'},
    el('div', {class:'hero'}, el('div', {class:'eyebrow'}, 'DIGITAL MEISHI'), el('h1', {}, p.name + ' さんの名刺を', el('br'), '読み込みます')),
    el('p', {class:'note'}, '次の ' + p.cards.length + ' 枚の名刺' + (inC.length ? 'と、受け取った名刺 ' + inC.length + ' 件' : '') + 'を、このスマホに入れます。入れたあとも、自由に編集できます。'),
    p.cards.map(c => el('div', {class:'stage', style:'margin:12px 0'}, cardView(c))),
    had ? el('div', {class:'msg info'}, 'このスマホにはもう名刺の設定があります。読み込むと、今の名刺の設定は置き換わります（受け取った名刺は消えません）。') : null,
    el('div', {class:'stack', style:'margin-top:18px'},
      el('button', {class:'btn-main', onclick: async () => {
        if (inC.length){ const all = LS.get('contacts', []), ids = new Set(all.map(x => x.id)); inC.forEach(x => { if (!ids.has(x.id)) all.push(x); }); LS.set('contacts', all); }
        await Profile.save(p); LS.set('card', p.cards[0].id); history.replaceState(null, '', BASE); tab = 'show'; renderOwner(); window.scrollTo(0, 0); toast('読み込みました'); }}, '読み込む'),
      el('button', {class:'btn-sub', onclick:()=>{ location.href = BASE; }}, 'やめる'))));
}

/* 起動：# に名刺があれば相手の画面、なければ自分の画面 */
(async () => {
  const code = location.hash.slice(1);
  if (code && params.has('import')){
    let d = null; try{ d = await Codec.dec(code); }catch(e){}
    if (d && d.v === 1 && d.profile && Array.isArray(d.profile.cards) && d.profile.cards.length){ OWNER = true; return renderImport(d.profile, d.contacts); }
    $app.replaceChildren(el('div', {class:'msg ng', style:'margin-top:40px'}, 'この読み込みリンクは使えませんでした。リンクが途中で切れていないか確認してください。'));
    return;
  }
  if (code){
    let d = null; try{ d = await Codec.dec(code); }catch(e){}
    if (d && d.v === 1 && d.c && d.n){ applyPayload(d, code); return params.has('privacy') ? renderPrivacy() : renderVisitor(); }
    $app.replaceChildren(el('div', {class:'msg ng', style:'margin-top:40px'}, 'この名刺のリンクは読み込めませんでした。リンクが途中で切れていないか、送った人に確認してください。'));
    return;
  }
  OWNER = true;
  const p = Profile.get();
  if (!p || !Array.isArray(p.cards) || !p.cards.length) return renderSetup();
  await Profile.save(p);
  renderOwner();
  // アプリを開いたら、名刺を画面いっぱいに（演出つき）
  if (LS.get('launchShow', true)){
    const cur = cardById(LS.get('card', CONFIG.CARDS[0].id));
    showCard(cur, cardUrl(cur, cur.fortune ? LS.get('mode', 'c') : 'c'), {intro:true});
  }
})();
window.addEventListener('hashchange', () => location.reload());
})();
