<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>本音の相性診断（試作）</title>
<style>
  :root{--glow:#4fe3d0;--dim:#5c7a80;--bg:#03060a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:#d8f3ef;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-user-select:none;user-select:none}
  .screen{display:none;min-height:100%;padding:28px 22px 40px;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;
    background-image:linear-gradient(rgba(79,227,208,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(79,227,208,.05) 1px,transparent 1px);background-size:28px 28px}
  .screen.on{display:flex}
  .label{font-size:12px;letter-spacing:.3em;color:var(--dim);margin-bottom:10px}
  h1{font-size:26px;font-weight:600;margin:0 0 14px;line-height:1.5}
  h2{font-size:21px;font-weight:600;margin:0 0 12px;line-height:1.6}
  p{line-height:1.8;margin:6px 0;color:#a9c7c3}
  .q{font-size:22px;line-height:1.7;color:#fff;margin:14px 0;padding:16px;border:1px solid rgba(79,227,208,.35);border-radius:12px;background:rgba(79,227,208,.06);max-width:520px}
  button{font-size:18px;padding:15px 34px;border-radius:40px;border:1px solid var(--glow);background:transparent;color:var(--glow);margin:10px 6px;letter-spacing:.08em;box-shadow:0 0 14px rgba(79,227,208,.35)}
  button.sub{border-color:#3a4c50;color:#7d9a9e;box-shadow:none;font-size:15px;padding:11px 22px}
  input{font-size:18px;padding:12px 14px;border-radius:10px;border:1px solid #2c3f43;background:#0a1216;color:#fff;width:220px;margin:6px;text-align:center}
  canvas.wave{width:100%;max-width:520px;height:120px;margin:16px 0 8px}
  .bpm{font-size:15px;color:var(--dim);letter-spacing:.1em}
  .count{font-size:64px;font-weight:200;color:var(--glow);text-shadow:0 0 18px var(--glow);margin:6px 0}
  .who{font-size:15px;color:#fff;background:rgba(79,227,208,.12);border-radius:20px;padding:5px 16px;margin-bottom:10px}
  .flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}
  .note{font-size:11px;color:#4d6266;margin-top:22px;line-height:1.7}
  /* 鑑定書 */
  #result{background:#fff;color:#222;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;justify-content:flex-start;background-image:none}
  #result .cert{max-width:520px;width:100%;border:1px solid #222;padding:30px 22px;position:relative}
  #result .cert:before{content:"";position:absolute;inset:5px;border:1px solid #bbb;pointer-events:none}
  #result .t{font-size:13px;letter-spacing:.5em;color:#777}
  #result .ttl{font-size:26px;margin:8px 0 18px;letter-spacing:.2em}
  #result .ratio{font-size:15px;color:#555;margin-top:10px}
  #result .ratio b{font-size:38px;color:#111;font-weight:500;margin:0 6px}
  #result .bar{height:8px;background:#ddd;margin:10px 0 22px;position:relative}
  #result .bar i{position:absolute;left:0;top:0;bottom:0;background:#111}
  #result .type{font-size:23px;line-height:1.6;margin:6px 0 8px}
  #result .one{font-size:15px;color:#444;margin-bottom:18px}
  #result .line{font-size:14px;color:#333;border-top:1px solid #ddd;padding:12px 0 0;margin-top:12px;line-height:1.9}
  #result .reveal{font-size:15px;margin-top:16px;padding:12px;background:#f4f4f2}
  #result .foot{font-size:10px;color:#999;margin-top:18px}
  #result button{color:#222;border-color:#222;box-shadow:none;font-family:-apple-system,"Hiragino Sans",sans-serif}
  #result button.sub{color:#777;border-color:#bbb}
  #cam{position:fixed;width:2px;height:2px;opacity:0;left:0;top:0}
</style>
</head>
<body>
<div class="flash" id="flash"></div>
<video id="cam" playsinline muted autoplay></video>

<!-- 1. はじまり -->
<section class="screen on" id="intro">
  <div class="label">HONNE AISHO</div>
  <h1>2人の本音の相性、<br>体で測ります</h1>
  <p>指先の脈から、どちらの気持ちが大きいかを読みます。<br>スマホ1台を2人で交代で使います。</p>
  <div style="margin:18px 0 6px">
    <input id="nameA" placeholder="1人目のニックネーム" maxlength="10"><br>
    <input id="nameB" placeholder="2人目のニックネーム" maxlength="10">
  </div>
  <button id="go">はじめる</button>
  <button class="sub" id="demo">カメラなしで試す（デモ）</button>
  <div class="note">遊び用の推定です。医療目的ではありません。<br>カメラの映像は保存も送信もしません。</div>
</section>

<!-- 2. 交代・説明 -->
<section class="screen" id="handoff">
  <div class="label" id="hoLabel"></div>
  <div class="who" id="hoWho"></div>
  <h2 id="hoTitle"></h2>
  <p id="hoText"></p>
  <button id="hoOk">準備OK</button>
</section>

<!-- 3. 計測 -->
<section class="screen" id="measure">
  <div class="label" id="msLabel"></div>
  <div class="who" id="msWho"></div>
  <div class="q" id="msQ" style="display:none"></div>
  <p id="msText"></p>
  <canvas class="wave" id="wave" width="1040" height="240"></canvas>
  <div class="count" id="msCount"></div>
  <div class="bpm" id="msBpm"></div>
  <button class="sub" id="msRetry" style="display:none">もう一度測る</button>
</section>

<!-- 4. 鑑定中 -->
<section class="screen" id="analyze">
  <div class="label">ANALYZING</div>
  <h2>鑑定中…</h2>
  <canvas class="wave" id="wave2" width="1040" height="240"></canvas>
</section>

<!-- 5. 鑑定書 -->
<section class="screen" id="result">
  <div class="cert" id="cert"></div>
  <div style="margin-top:18px">
    <button id="save">鑑定書を保存・送る</button><br>
    <button class="sub" id="again">質問を変えてもう1回</button>
  </div>
</section>

<script>
// ━━━ 文章データ（引き継ぎメモ第1案） ━━━
const Q_R2 = ["〇〇の第一印象、正直に言って","〇〇を初めて意識した瞬間は？","〇〇の好きなところを、今ここで3つ","〇〇のどこにドキッとする？","〇〇にしてほしいけど言えてないことを1つ","〇〇にもっと言われたい一言は？","〇〇と2人で行きたい場所は？","〇〇と出会ってなかったら、今ごろ何してた？"];
const Q_R3 = ["笑顔を褒めて","声を1つ褒めて","今日の見た目で1つ褒めて","一緒にいて楽しいところを言って"];
const HIDDEN = [
  {q:"〇〇が他の人と2人で飲みに行ったら、何て言う？", theme:"独占欲"},
  {q:"来年の今日、2人は何してると思う？", theme:"本気度"},
  {q:"疲れた日に〇〇にしてほしいことを1つ", theme:"甘えたい度"}
];
const TYPES = {
  lead:{ big:["〇〇の一目惚れ全開型","言葉より先に、心臓が告白しています"],
         mid:["〇〇の片思いリード型","追いかける側がいるから、この2人は続きます"],
         low:["〇〇のこっそり意識型","平気な顔をして、体は少しだけ正直でした"] },
  even:{ big:["両想いの共鳴コンビ","2人の心拍が、同じだけ跳ねました"],
         mid:["照れ隠し同士のじれったいコンビ","どちらかが一歩踏み出せば、話が早い"],
         low:["大人の余裕コンビ","この程度では動じない。次はもっと攻めた質問で"] }
};
// 判定の目安（仮）
const LEAD_SHARE = 0.6, BIG = 15, MID = 6;
const SEC = {base:10, stare:10, q:20, praise:10, final:10};

// ━━━ 共通 ━━━
const $ = id => document.getElementById(id);
const pick = a => a[Math.floor(Math.random()*a.length)];
const hon = n => /(さん|ちゃん|くん|君|様)$/.test(n) ? n : n + "さん";
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on', s.id===id)); window.scrollTo(0,0); }
function flash(){ const f=$('flash'); f.style.opacity=.85; setTimeout(()=>f.style.opacity=0,180); }
let actx=null;
function beep(freq=880, dur=.18){
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=freq; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(.35, actx.currentTime); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime+dur);
    o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}
const sleep = ms => new Promise(r=>setTimeout(r,ms));

// ━━━ 脈の読み取り ━━━
let demo=false, track=null, running=false;
const samples=[]; // {t,r,g}
const work=document.createElement('canvas'); work.width=work.height=40;
const wctx=work.getContext('2d',{willReadFrequently:true});
let fakeBpm=72, fakePhase=0, fakeLast=0;

async function startCamera(){
  const s = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:640},height:{ideal:480}},audio:false});
  track = s.getVideoTracks()[0]; const v=$('cam'); v.srcObject=s; await v.play();
  try{ await track.applyConstraints({advanced:[{torch:true}]}); }catch(e){}
}
function sampleOnce(){
  const t = performance.now()/1000;
  if (demo){
    const dt = fakeLast ? t-fakeLast : 0; fakeLast=t; fakePhase += dt*fakeBpm/60*2*Math.PI;
    samples.push({t, r:150 - 4*Math.max(0,Math.sin(fakePhase))**3 + (Math.random()-.5)*.6, g:40});
  } else {
    const v=$('cam'); if (v.readyState<2) return;
    wctx.drawImage(v, v.videoWidth/2-20, v.videoHeight/2-20, 40, 40, 0, 0, 40, 40);
    const d=wctx.getImageData(0,0,40,40).data; let r=0,g=0; for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];}
    const n=d.length/4; samples.push({t, r:r/n, g:g/n});
  }
  while (samples.length && t-samples[0].t > 40) samples.shift();
}
function loop(){ if(!running) return; sampleOnce(); drawWave($('wave')); if($('analyze').classList.contains('on')) drawWave($('wave2'),true); requestAnimationFrame(loop); }

function filteredBetween(t0,t1){
  const idx=[]; samples.forEach((s,i)=>{ if(s.t>=t0-0.5 && s.t<=t1+0.5) idx.push(i); });
  const out=[];
  for (const i of idx){
    const s=samples[i]; if (s.t<t0||s.t>t1) continue;
    let sum=0,c=0;
    for(let j=i;j>=0&&s.t-samples[j].t<0.5;j--){sum+=samples[j].r;c++;}
    for(let j=i+1;j<samples.length&&samples[j].t-s.t<0.5;j++){sum+=samples[j].r;c++;}
    out.push({t:s.t, y:-(s.r-sum/c)});
  }
  return out;
}
function bpmBetween(t0,t1){
  const f=filteredBetween(t0,t1), peaks=[];
  for(let i=2;i<f.length-2;i++){ const y=f[i].y;
    if(y>0&&y>=f[i-1].y&&y>=f[i-2].y&&y>f[i+1].y&&y>f[i+2].y){ if(!peaks.length||f[i].t-peaks[peaks.length-1]>0.33) peaks.push(f[i].t); } }
  if (peaks.length<4) return null;
  const iv=[]; for(let i=1;i<peaks.length;i++) iv.push(peaks[i]-peaks[i-1]); iv.sort((a,b)=>a-b);
  const b = 60/iv[Math.floor(iv.length/2)];
  return (b>40 && b<200) ? b : null;
}
function covered(){
  const s=samples[samples.length-1]; if(!s) return false;
  return demo || (s.r>60 && s.r>s.g*1.8);
}
function drawWave(cv, calm){
  const g=cv.getContext('2d'); g.clearRect(0,0,cv.width,cv.height);
  if (!samples.length) return;
  const now=samples[samples.length-1].t, f=filteredBetween(now-5,now);
  if (f.length<3) return;
  let mn=Infinity,mx=-Infinity; f.forEach(p=>{mn=Math.min(mn,p.y);mx=Math.max(mx,p.y);});
  const rng=(mx-mn)||1;
  g.strokeStyle='#4fe3d0'; g.lineWidth=3; g.shadowColor='#4fe3d0'; g.shadowBlur=14; g.beginPath();
  f.forEach((p,i)=>{ const x=(p.t-(now-5))/5*cv.width, y=cv.height/2+((p.y-mn)/rng-.5)*-(cv.height*.7)*(calm?.6:1); i?g.lineTo(x,y):g.moveTo(x,y); });
  g.stroke();
}

// ━━━ 流れ ━━━
let A="", B="", plan=[], res={};
function buildPlan(){
  const q2=[...Q_R2].sort(()=>Math.random()-.5), p3=[...Q_R3].sort(()=>Math.random()-.5), hid=pick(HIDDEN);
  res = {hidden:hid, base:{}, rows:[]};
  const other = w => w==='A'?B:A, me = w => w==='A'?A:B;
  plan = [
    {k:'ho', who:'A', label:'STEP 1', title:'落ち着いているときの心拍', text:()=>`${hon(A)}が人差し指で背面カメラとライトをふさぎます。2人とも黙って10秒。`},
    {k:'base', who:'A', sec:SEC.base, text:'そのまま動かさず、落ち着いて…'},
    {k:'m', who:'A', round:'見つめ合い', sec:SEC.stare, label:'ROUND 1', text:()=>`${hon(B)}と見つめ合って。目をそらさない。`},
    {k:'ho', who:'B', label:'交代', title:()=>`次は${hon(B)}の番`, text:()=>`${hon(A)}、目をそらさないで。まずは${hon(B)}の落ち着いた心拍から。`},
    {k:'base', who:'B', sec:SEC.base, text:'そのまま動かさず、落ち着いて…'},
    {k:'m', who:'B', round:'見つめ合い', sec:SEC.stare, label:'ROUND 1', text:()=>`${hon(A)}と見つめ合って。目をそらさない。`},
    {k:'ho', who:'A', label:'ROUND 2', title:'答えにくい質問', text:()=>`${hon(B)}が画面の質問を読み上げ、${hon(A)}が指を当てたまま答えます。`},
    {k:'m', who:'A', round:'答えにくい質問', sec:SEC.q, label:'ROUND 2', q:()=>q2[0].replace(/〇〇/g,hon(B)), text:()=>`読む人：${hon(B)}　答える人：${hon(A)}`},
    {k:'ho', who:'B', label:'交代', title:()=>`次は${hon(B)}が答える番`, text:()=>`${hon(A)}が質問を読み上げます。`},
    {k:'m', who:'B', round:'答えにくい質問', sec:SEC.q, label:'ROUND 2', q:()=>q2[1].replace(/〇〇/g,hon(A)), text:()=>`読む人：${hon(A)}　答える人：${hon(B)}`},
    {k:'ho', who:'A', label:'ROUND 3', title:'褒め合い', text:()=>`${hon(B)}が${hon(A)}を褒めます。褒められる人が指を当てます。`},
    {k:'m', who:'A', round:'褒め合い', sec:SEC.praise, label:'ROUND 3', q:()=>`${hon(B)}から${hon(A)}へ：${p3[0]}`, text:'照れずに受け止めて'},
    {k:'ho', who:'B', label:'交代', title:()=>`次は${hon(B)}が褒められる番`, text:()=>`${hon(A)}が褒めます。`},
    {k:'m', who:'B', round:'褒め合い', sec:SEC.praise, label:'ROUND 3', q:()=>`${hon(A)}から${hon(B)}へ：${p3[1]}`, text:'照れずに受け止めて'},
    {k:'ho', who:'A', label:'FINAL', title:'最後の質問', text:'何を測っているかは秘密です。正直に答えてください。'},
    {k:'m', who:'A', round:'最終問', sec:SEC.final, label:'FINAL', q:()=>hid.q.replace(/〇〇/g,hon(B)), text:()=>`答える人：${hon(A)}`},
    {k:'ho', who:'B', label:'交代', title:()=>`${hon(B)}も最後の質問`, text:'何を測っているかは、まだ秘密。'},
    {k:'m', who:'B', round:'最終問', sec:SEC.final, label:'FINAL', q:()=>hid.q.replace(/〇〇/g,hon(A)), text:()=>`答える人：${hon(B)}`},
  ];
}
const val = x => typeof x==='function' ? x() : (x||'');

async function run(){
  for (const st of plan){
    const name = st.who==='A'?A:B;
    if (st.k==='ho'){
      $('hoLabel').textContent=st.label; $('hoWho').textContent=`指を当てる人：${hon(name)}`;
      $('hoTitle').textContent=val(st.title); $('hoText').textContent=val(st.text);
      show('handoff'); await new Promise(r=>$('hoOk').onclick=r);
    } else {
      let bpm=null;
      while (bpm===null){ bpm = await measure(st, name); }
      if (st.k==='base') res.base[st.who]=bpm;
      else res.rows.push({who:st.who, round:st.round, bpm, rise:Math.max(0,bpm-res.base[st.who])});
      $('msText').textContent='記録しました…'; $('msCount').textContent=''; $('msBpm').textContent='';
      await sleep(1400);
    }
  }
  show('analyze'); beep(520,.3); await sleep(1200); beep(660,.3); await sleep(1200); beep(990,.5); await sleep(900);
  renderResult(); flash(); show('result');
}

async function measure(st, name){
  $('msLabel').textContent = st.k==='base' ? 'BASELINE' : st.label;
  $('msWho').textContent = `測定中：${hon(name)}`;
  const q=val(st.q); $('msQ').style.display=q?'block':'none'; $('msQ').textContent=q;
  $('msRetry').style.display='none'; $('msBpm').textContent=''; $('msCount').textContent='';
  show('measure');
  if (demo) fakeBpm = st.k==='base' ? 66+Math.random()*10 : (res.base[st.who]||70) + Math.random()*(st.round==='最終問'?20:28);
  // 指が当たるまで待つ
  while (!covered()){ $('msText').textContent='人差し指でカメラとライトを軽くふさいでください'; await sleep(200); }
  $('msText').textContent='脈を探しています…'; await sleep(2500);
  for (const n of [3,2,1]){ $('msCount').textContent=n; beep(660,.1); await sleep(700); }
  $('msText').textContent=val(st.text); beep(990,.25); flash();
  const t0=performance.now()/1000; let lost=0;
  while (true){
    const el=performance.now()/1000-t0, left=Math.ceil(st.sec-el);
    if (left<=0) break;
    $('msCount').textContent=left;
    if (!covered()){ lost+=0.2; $('msBpm').textContent='指が離れています'; } else { $('msBpm').textContent=''; }
    await sleep(200);
  }
  const t1=performance.now()/1000; beep(990,.25); beep(1320,.25); flash();
  const b = lost>2 ? null : bpmBetween(t0,t1);
  if (b===null){
    $('msText').textContent='うまく測れませんでした。指を当て直して、もう一度。'; $('msCount').textContent='';
    $('msRetry').style.display='inline-block'; await new Promise(r=>$('msRetry').onclick=r);
  }
  return b;
}

function renderResult(){
  const sum = w => res.rows.filter(r=>r.who===w).reduce((a,r)=>a+r.rise,0);
  const n = res.rows.length/2, sA=sum('A'), sB=sum('B'), tot=sA+sB;
  const share = tot>0 ? sA/tot : .5;
  let ra = Math.round(share*10); if (tot>0) ra=Math.min(9,Math.max(1,ra)); const rb=10-ra;
  const avg = (sA+sB)/2/n, lvl = avg>=BIG?'big':avg>=MID?'mid':'low';
  const lead = share>=LEAD_SHARE?'A':share<=1-LEAD_SHARE?'B':null;
  const t = lead ? TYPES.lead[lvl] : TYPES.even[lvl];
  const typeName = t[0].replace('〇〇', hon(lead==='A'?A:B));
  const top = res.rows.reduce((a,r)=>r.rise>a.rise?r:a, res.rows[0]);
  const praise = res.rows.filter(r=>r.round==='褒め合い').sort((a,b)=>a.rise-b.rise)[0];
  const fa = res.rows.find(r=>r.round==='最終問'&&r.who==='A').rise, fb = res.rows.find(r=>r.round==='最終問'&&r.who==='B').rise;
  const fw = Math.abs(fa-fb)<2 ? '2人とも同じくらい' : `大きかったのは${hon(fa>fb?A:B)}`;
  const nm = w => hon(w==='A'?A:B);
  const lines = [`一番ドキドキしたのは、${nm(top.who)}の『${top.round}』（+${Math.round(top.rise)}拍）`];
  if (praise.rise<=3) lines.push(`${nm(praise.who)}は『褒め合い』でも無反応。もっと褒めて`);
  const d = new Date(), date=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
  res.view = {ra, rb, typeName, one:t[1], lines, reveal:`実は最終問は「${res.hidden.theme}」チェックでした。反応が${fw}。`, date};
  $('cert').innerHTML = `
    <div class="t">鑑 定 書</div>
    <div class="ttl">本音の相性</div>
    <div class="ratio">ドキドキの比率<br>${esc(hon(A))}<b>${ra}</b>：<b>${rb}</b>${esc(hon(B))}</div>
    <div class="bar"><i style="width:${ra*10}%"></i></div>
    <div class="type">${esc(typeName)}</div>
    <div class="one">${esc(t[1])}</div>
    <div class="line">${lines.map(esc).join('<br>')}</div>
    <div class="reveal">${esc(res.view.reveal)}</div>
    <div class="foot">${date}　遊び用の推定です。医療目的ではありません。</div>`;
}
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// 鑑定書を画像に
function wrap(g, text, x, y, maxW, lh){
  let line=''; for (const ch of text){ if (g.measureText(line+ch).width>maxW){ g.fillText(line,x,y); y+=lh; line=ch; } else line+=ch; }
  if(line) g.fillText(line,x,y); return y+lh;
}
function certImage(){
  const v=res.view, W=1080, H=1440, c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d');
  const F='"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif';
  g.fillStyle='#fff'; g.fillRect(0,0,W,H); g.strokeStyle='#222'; g.lineWidth=3; g.strokeRect(50,50,W-100,H-100);
  g.strokeStyle='#bbb'; g.lineWidth=2; g.strokeRect(64,64,W-128,H-128);
  g.textAlign='center'; g.fillStyle='#777'; g.font=`28px ${F}`; g.fillText('鑑　定　書', W/2, 170);
  g.fillStyle='#111'; g.font=`56px ${F}`; g.fillText('本音の相性', W/2, 260);
  g.fillStyle='#555'; g.font=`32px ${F}`; g.fillText('ドキドキの比率', W/2, 360);
  g.fillStyle='#111'; g.font=`96px ${F}`; g.fillText(`${v.ra} ： ${v.rb}`, W/2, 480);
  g.font=`34px ${F}`; g.fillStyle='#444'; g.textAlign='left'; g.fillText(hon(A), 150, 560); g.textAlign='right'; g.fillText(hon(B), W-150, 560);
  g.fillStyle='#ddd'; g.fillRect(150,590,W-300,14); g.fillStyle='#111'; g.fillRect(150,590,(W-300)*v.ra/10,14);
  g.textAlign='center'; g.fillStyle='#111'; g.font=`50px ${F}`; let y=wrap(g, v.typeName, W/2, 720, W-240, 70);
  g.fillStyle='#444'; g.font=`32px ${F}`; y=wrap(g, v.one, W/2, y+10, W-240, 50);
  g.fillStyle='#ddd'; g.fillRect(150,y+10,W-300,2); y+=80; g.fillStyle='#333'; g.font=`30px ${F}`;
  for (const l of v.lines) y=wrap(g, l, W/2, y, W-240, 48);
  g.fillStyle='#f4f4f2'; g.fillRect(130,y+10,W-260,170); g.fillStyle='#222'; g.font=`32px ${F}`; wrap(g, v.reveal, W/2, y+80, W-320, 50);
  g.fillStyle='#999'; g.font=`22px ${F}`; g.fillText(`${v.date}　遊び用の推定です。医療目的ではありません。`, W/2, H-100);
  return c;
}
$('save').onclick = () => {
  certImage().toBlob(async blob => {
    const file = new File([blob], 'aisho.png', {type:'image/png'});
    if (navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:'本音の相性 鑑定書'}); return; }catch(e){ if(e.name==='AbortError') return; }
    }
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='aisho.png'; a.click();
  }, 'image/png');
};

// ━━━ 開始 ━━━
async function begin(isDemo){
  demo=isDemo; A=$('nameA').value.trim()||'Aさん'; B=$('nameB').value.trim()||'Bさん';
  beep(1,.01); // 音を使えるようにする
  if (!demo){
    try{ await startCamera(); }catch(e){ alert('カメラを使えませんでした：'+e.message); return; }
  }
  if (!running){ running=true; loop(); }
  buildPlan(); run();
}
$('go').onclick = () => begin(false);
$('demo').onclick = () => begin(true);
$('again').onclick = () => { buildPlan(); run(); };
</script>
