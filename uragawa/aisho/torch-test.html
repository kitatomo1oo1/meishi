<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ライト・心拍テスト</title>
<style>
  body{margin:0;background:#05070a;color:#cfe;font-family:-apple-system,"Hiragino Sans",sans-serif;padding:16px}
  h1{font-size:18px;margin:0 0 8px}
  button{font-size:17px;padding:12px 18px;border-radius:10px;border:0;background:#2a6;color:#fff;margin:4px 4px 4px 0}
  button.off{background:#555}
  #log{font-size:13px;white-space:pre-wrap;background:#0d1117;padding:10px;border-radius:8px;margin-top:10px;line-height:1.6}
  #bpm{font-size:48px;font-weight:700;color:#4fd;margin:10px 0 0}
  canvas{width:100%;height:140px;background:#000;border-radius:8px;margin-top:8px}
  video{display:none}
</style>
</head>
<body>
<h1>ライト・心拍テスト</h1>
<div>1. 「開始」を押してカメラを許可<br>2. ライトが点いたら、人差し指で背面カメラとライトを軽くふさぐ<br>3. 15秒ほど動かさずに待つ</div>
<button id="start">開始</button>
<button id="torchBtn" class="off" disabled>ライト切替</button>
<div id="bpm">-- bpm</div>
<canvas id="cv" width="600" height="140"></canvas>
<div id="log"></div>
<video id="v" playsinline muted></video>
<canvas id="work" width="40" height="40" style="display:none"></canvas>
<script>
const log = m => { document.getElementById('log').textContent += m + '\n'; };
const v = document.getElementById('v');
let track = null, torchOn = false;

log('端末: ' + navigator.userAgent);

async function setTorch(on){
  try{
    await track.applyConstraints({advanced:[{torch:on}]});
    torchOn = on;
    log('ライト ' + (on?'ON':'OFF') + ' を指示：エラーなし（実際に点いたか目で確認）');
  }catch(e){ log('ライト指示エラー: ' + e.name + ' ' + e.message); }
}

document.getElementById('start').onclick = async () => {
  try{
    const s = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:640},height:{ideal:480}},audio:false});
    track = s.getVideoTracks()[0];
    v.srcObject = s; await v.play();
    log('カメラ: ' + track.label);
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    log('torch対応表示: ' + ('torch' in caps ? JSON.stringify(caps.torch) : 'なし'));
    await setTorch(true);
    const b = document.getElementById('torchBtn'); b.disabled = false; b.classList.remove('off');
    b.onclick = () => setTorch(!torchOn);
    loop();
  }catch(e){ log('カメラ起動エラー: ' + e.name + ' ' + e.message); }
};

const work = document.getElementById('work').getContext('2d',{willReadFrequently:true});
const cv = document.getElementById('cv'), g = cv.getContext('2d');
const samples = []; // {t, r}

function loop(){
  if (v.readyState >= 2){
    work.drawImage(v, v.videoWidth/2-20, v.videoHeight/2-20, 40, 40, 0, 0, 40, 40);
    const d = work.getImageData(0,0,40,40).data;
    let r=0, gg=0; for(let i=0;i<d.length;i+=4){ r+=d[i]; gg+=d[i+1]; }
    const n = d.length/4; r/=n; gg/=n;
    const t = performance.now()/1000;
    samples.push({t, r, g:gg});
    while (samples.length && t - samples[0].t > 15) samples.shift();
    draw(); calc(r, gg);
  }
  requestAnimationFrame(loop);
}

function filtered(){
  // 0.5秒の移動平均を引いて、ゆっくりした明るさ変化を除く
  return samples.map((s,i)=>{
    let sum=0,c=0;
    for(let j=i;j>=0 && s.t-samples[j].t<0.5;j--){sum+=samples[j].r;c++;}
    for(let j=i+1;j<samples.length && samples[j].t-s.t<0.5;j++){sum+=samples[j].r;c++;}
    return {t:s.t, y:-(s.r - sum/c)}; // 血液が増えると暗くなるので反転
  });
}

function draw(){
  const f = filtered().filter(p=>p.t > samples[samples.length-1].t - 6);
  g.fillStyle='#000'; g.fillRect(0,0,cv.width,cv.height);
  if (f.length<2) return;
  let mn=Infinity,mx=-Infinity; f.forEach(p=>{mn=Math.min(mn,p.y);mx=Math.max(mx,p.y);});
  const t0=f[0].t, span=f[f.length-1].t-t0||1, rng=(mx-mn)||1;
  g.strokeStyle='#4fd'; g.lineWidth=2; g.shadowColor='#4fd'; g.shadowBlur=8; g.beginPath();
  f.forEach((p,i)=>{const x=(p.t-t0)/span*cv.width, y=cv.height-10-(p.y-mn)/rng*(cv.height-20); i?g.lineTo(x,y):g.moveTo(x,y);});
  g.stroke(); g.shadowBlur=0;
}

let lastCalc = 0;
function calc(r, gg){
  const now = samples[samples.length-1].t;
  if (now - lastCalc < 1) return; lastCalc = now;
  const covered = r > 60 && r > gg * 1.8; // 指でふさぐと画面が赤一色になる
  if (!covered){ document.getElementById('bpm').textContent = '指を当ててください'; return; }
  if (now - samples[0].t < 8){ document.getElementById('bpm').textContent = '測定中…'; return; }
  const f = filtered().filter(p=>p.t > now - 10);
  const peaks=[];
  for(let i=2;i<f.length-2;i++){
    const y=f[i].y;
    if (y>0 && y>=f[i-1].y && y>=f[i-2].y && y>f[i+1].y && y>f[i+2].y){
      if (!peaks.length || f[i].t-peaks[peaks.length-1] > 0.33) peaks.push(f[i].t);
    }
  }
  if (peaks.length < 4){ document.getElementById('bpm').textContent = '測定中…'; return; }
  const iv=[]; for(let i=1;i<peaks.length;i++) iv.push(peaks[i]-peaks[i-1]);
  iv.sort((a,b)=>a-b);
  const med = iv[Math.floor(iv.length/2)];
  document.getElementById('bpm').textContent = Math.round(60/med) + ' bpm';
}
</script>
<script src="../lib/nav.js"></script>
</body>
</html>
