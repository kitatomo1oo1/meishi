<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05080b">
<title>ウラガワ｜心拍計測 試作</title>
<style>
  :root{
    --bg:#05080b; --line:#5ff5d0; --dim:#2a3a40; --text:#cfe9e2; --sub:#6f8a86; --warn:#ffb86b;
    --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
    -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  body{min-height:100svh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 16px calc(16px + env(safe-area-inset-bottom))}
  header{display:flex;justify-content:space-between;align-items:center;padding:14px 0 8px;font-size:12px;letter-spacing:.2em;color:var(--sub)}
  #preview{width:44px;height:44px;border-radius:50%;object-fit:cover;border:1px solid var(--dim);background:#000}
  #guide{font-size:17px;line-height:1.6;min-height:3.2em;margin:6px 0 10px;text-align:center}
  #guide.warn{color:var(--warn)}
  .scope{position:relative;border:1px solid var(--dim);border-radius:10px;overflow:hidden;background:#03060a}
  #wave{display:block;width:100%;height:170px}
  .scope .tag{position:absolute;top:8px;left:10px;font-size:10px;letter-spacing:.15em;color:var(--sub)}
  .readout{display:flex;align-items:baseline;justify-content:center;gap:8px;margin:16px 0 4px}
  #bpm{font-size:64px;font-weight:200;font-variant-numeric:tabular-nums;color:var(--line);text-shadow:0 0 18px rgba(95,245,208,.45)}
  .unit{font-size:14px;color:var(--sub);letter-spacing:.1em}
  #delta{text-align:center;font-size:15px;color:var(--sub);min-height:1.4em;font-variant-numeric:tabular-nums}
  .bar{height:4px;background:var(--dim);border-radius:2px;margin:14px 0;overflow:hidden;opacity:0;transition:opacity .2s}
  .bar.on{opacity:1}
  .bar i{display:block;height:100%;width:0;background:var(--line);box-shadow:0 0 10px var(--line)}
  .btns{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  button{font:inherit;font-size:16px;padding:15px;border-radius:12px;border:1px solid var(--dim);background:#0c1418;color:var(--text)}
  button.primary{background:var(--line);color:#03110d;border-color:var(--line);font-weight:600}
  button:disabled{opacity:.35}
  .row{display:flex;gap:10px}.row button{flex:1;font-size:14px;padding:12px}
  #result{display:none;margin:14px 0 0;background:#fbfaf6;color:#1b1b1b;border-radius:4px;padding:18px 20px;font-family:var(--mincho)}
  #result h3{font-weight:600;font-size:15px;letter-spacing:.3em;text-align:center;border-bottom:1px solid #1b1b1b;padding-bottom:8px;margin-bottom:12px}
  #result{position:relative;overflow:hidden}
  .stampWrap{display:flex;justify-content:center;margin:6px 0 4px}
  #stamp{display:inline-block;padding:6px 18px;border:3px solid #b3261e;border-radius:6px;color:#b3261e;font-size:30px;font-weight:700;
    letter-spacing:.12em;transform:rotate(-10deg);opacity:0}
  #stamp.hit{animation:stamp .38s cubic-bezier(.2,1.6,.4,1) forwards}
  @keyframes stamp{0%{opacity:0;transform:scale(2.6) rotate(-22deg)}100%{opacity:.9;transform:scale(1) rotate(-10deg)}}
  .big{display:flex;align-items:baseline;justify-content:center;gap:6px;margin-top:10px}
  .big span{font-size:13px;color:#555}
  .big b{font-size:46px;font-weight:600;font-variant-numeric:tabular-nums}
  #rLevel{text-align:center;font-size:17px;font-weight:600;margin-top:2px}
  #rComment{text-align:center;font-size:16px;line-height:1.7;margin:10px 0 12px}
  #rGraph{display:block;width:100%;height:auto;border-top:1px solid #ccc;padding-top:8px}
  #rEvidence{font-size:12px;color:#444;text-align:center;margin-top:4px;font-variant-numeric:tabular-nums}
  #result .note{font-size:10px;color:#888;text-align:center;margin-top:8px}
  details{margin-top:18px;font-size:12px;color:var(--sub)}
  details pre{white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.6;margin-top:6px}
  footer{margin-top:auto;padding-top:18px;font-size:11px;line-height:1.7;color:var(--sub);text-align:center}
</style>
</head>
<body>
<header>
  <span>URAGAWA ／ 心拍計測 試作</span>
  <video id="preview" playsinline muted autoplay></video>
</header>

<div id="guide">スタートを押すと、背面カメラとライトを使います</div>

<div class="scope">
  <span class="tag">PULSE</span>
  <canvas id="wave"></canvas>
</div>

<div class="readout"><span id="bpm">--</span><span class="unit">BPM</span></div>
<div id="delta"></div>
<div class="bar" id="bar"><i id="barFill"></i></div>

<div class="btns">
  <button class="primary" id="startBtn">スタート</button>
  <div class="row">
    <button id="lieBtn" disabled>嘘発見器（7秒）</button>
    <button id="dokiBtn" disabled>ドキドキ度（10秒）</button>
  </div>
  <div class="row">
    <button id="soundBtn">心音：ON</button>
    <button id="resetBtn" disabled>基準を測り直す</button>
  </div>
</div>

<div id="result">
  <h3 id="rTitle">鑑 定 書</h3>
  <div class="stampWrap"><div id="stamp">シロ</div></div>
  <div class="big"><span id="rLabel">怪しい度</span><b id="rScore">0</b><span>%</span></div>
  <div id="rLevel"></div>
  <p id="rComment"></p>
  <svg id="rGraph" viewBox="0 0 300 96"></svg>
  <p id="rEvidence"></p>
  <p class="note">心拍の変化から出した遊び用の推定です</p>
</div>

<details>
  <summary>計測の詳細（調整用）</summary>
  <pre id="debug">-</pre>
</details>

<footer>遊び用の推定です。医療目的ではありません。<br>カメラ映像は保存も送信もしません（スマホの中だけで処理）。</footer>

<script>
// ==PULSE-CORE==
// 指先の明るさの変化（脈波）から拍を検出する部分。カメラに依存しないので単体で検証できる。
function median(a){ if(!a.length) return NaN; const s=[...a].sort((x,y)=>x-y); const m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2; }

class PulseCore{
  constructor(){ this.reset(); }
  reset(){
    this.raw=[];      // {t,v} 直近1.2秒（ゆっくりした明るさの変化を取り除く用）
    this.hp=[];       // 平滑化用
    this.sig=[];      // {t,s} 描画・判定用の脈波（直近6秒）
    this.cand=null;   // 拍の候補（山の頂点）
    this.lastCandT=-1e9;
    this.lastBeat=-1e9;
    this.beats=[];    // {t,ok}
    this.ibis=[];     // 採用した拍の間隔（秒）
    this.ibiTimes=[]; // その拍の時刻
    this.rejectStreak=0;
    this.amp=0;
  }
  push(t,v){
    const raw=this.raw; raw.push({t,v});
    while(raw.length && t-raw[0].t>1.2) raw.shift();
    let sum=0,n=0; for(const p of raw){ if(t-p.t<=1.0){sum+=p.v;n++;} }
    const x=v-sum/n;
    this.hp.push(x); if(this.hp.length>4) this.hp.shift();
    const s=-(this.hp.reduce((a,b)=>a+b,0)/this.hp.length); // 血液が増えると暗くなるので反転して山にする
    const prev=this.sig.length?this.sig[this.sig.length-1].s:s;
    this.sig.push({t,s}); while(this.sig.length && t-this.sig[0].t>6) this.sig.shift();

    let amp=0; for(const p of this.sig){ if(t-p.t<=2.5) amp=Math.max(amp,Math.abs(p.s)); }
    this.amp=amp;
    const thresh=0.3*amp;

    let beat=null;
    if(this.cand){
      if(s>this.cand.s && t-this.cand.t0<0.3){ this.cand.s=s; this.cand.t=t; }
      else if(t-this.cand.t>=0.15){ const c=this.cand; this.cand=null; this.lastCandT=c.t; beat=this._accept(c.t); }
    }else if(amp>0 && s>thresh && s>prev && t-this.lastCandT>this._refractory()){
      this.cand={t,t0:t,s};
    }
    return beat;
  }
  _refractory(){ // 拍の直後は少し待つ（脈の2つ目の小さな山を拍と間違えないため）
    return this.ibis.length>=3 ? Math.max(0.3, 0.55*median(this.ibis.slice(-5))) : 0.3;
  }
  _accept(tb){
    const ibi=tb-this.lastBeat; this.lastBeat=tb;
    let ok=true;
    if(ibi<0.33||ibi>1.5) ok=false;               // 180bpm超 / 40bpm未満は捨てる
    else if(this.ibis.length>=3){
      const med=median(this.ibis.slice(-5));
      if(Math.abs(ibi-med)/med>0.3){               // 前後と比べて飛びすぎ → ノイズ扱い
        ok=false;
        if(++this.rejectStreak>=4){ this.ibis=[]; this.ibiTimes=[]; this.rejectStreak=0; } // リズム自体が変わった
      }
    }
    if(ok){ this.rejectStreak=0; this.ibis.push(ibi); this.ibiTimes.push(tb); if(this.ibis.length>30){this.ibis.shift();this.ibiTimes.shift();} }
    const b={t:tb,ok}; this.beats.push(b); if(this.beats.length>30) this.beats.shift();
    return b;
  }
  bpm(){ return this.ibis.length>=3 ? 60/median(this.ibis.slice(-6)) : null; }
  quality(){
    if(this.ibis.length<4) return 0;
    const a=this.ibis.slice(-6), m=a.reduce((x,y)=>x+y,0)/a.length;
    const sd=Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/a.length);
    return Math.max(0,Math.min(1,1-(sd/m)/0.2));
  }
  ibisSince(t0,t1=Infinity){ const r=[]; this.ibiTimes.forEach((t,i)=>{ if(t>=t0&&t<=t1) r.push(this.ibis[i]); }); return r; }
}
// ==/PULSE-CORE==

// ---------- 画面とカメラ ----------
const $=id=>document.getElementById(id);
const video=$('preview'), cv=$('wave'), ctx=cv.getContext('2d');
const grab=document.createElement('canvas'); grab.width=40; grab.height=30;
const gctx=grab.getContext('2d',{willReadFrequently:true});

const core=new PulseCore();
let stream=null, track=null, torchOn=false, running=false;
let state='idle';           // idle / nofinger / warmup / baseline / ready / question
let stateT=0, fingerSince=null, fingerLostAt=null, channel='r';
let baseline=null, qStart=0;
let soundOn=true, ac=null;
let fpsCount=0, fpsT=0, fps=0, last={r:0,g:0,b:0,finger:false};

const BASE_SEC=10, WARM_SEC=3;

function setGuide(text,warn=false){ const g=$('guide'); g.textContent=text; g.classList.toggle('warn',warn); }
function setBar(p){ $('bar').classList.toggle('on',p!=null); $('barFill').style.width=((p||0)*100)+'%'; }
function setState(s,t){ state=s; stateT=t; }

async function start(){
  $('startBtn').disabled=true;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)(); ac.resume();
  }catch(e){}
  try{
    const base={width:{ideal:320},height:{ideal:240},frameRate:{ideal:30}};
    try{ stream=await navigator.mediaDevices.getUserMedia({video:{...base,facingMode:{exact:'environment'}},audio:false}); }
    catch(e){ stream=await navigator.mediaDevices.getUserMedia({video:{...base,facingMode:'environment'},audio:false}); }
  }catch(e){
    setGuide('カメラを使えませんでした。ブラウザのカメラ許可を確認してください（https のページでのみ動きます）',true);
    $('startBtn').disabled=false; return;
  }
  track=stream.getVideoTracks()[0];
  video.srcObject=stream; await video.play().catch(()=>{});
  await setTorch(true);
  running=true; core.reset(); setState('nofinger',performance.now()/1000);
  $('startBtn').textContent='計測中'; $('resetBtn').disabled=false;
  setGuide('人差し指の腹で、背面カメラとライトを軽く覆ってください');
  loop();
}

async function setTorch(on){
  try{
    const caps=track.getCapabilities?track.getCapabilities():{};
    if(caps.torch){ await track.applyConstraints({advanced:[{torch:on}]}); torchOn=on; return; }
  }catch(e){}
  torchOn=false;
}

function stop(){
  running=false;
  if(track){ setTorch(false).finally(()=>{ stream&&stream.getTracks().forEach(t=>t.stop()); stream=null; track=null; }); }
  setState('idle',0); setBar(null);
  $('startBtn').disabled=false; $('startBtn').textContent='スタート'; setQ(false);
  setGuide('止めました。スタートで再開します');
}

function loop(){
  if(!running) return;
  if(video.requestVideoFrameCallback) video.requestVideoFrameCallback(()=>{ sample(); loop(); });
  else requestAnimationFrame(()=>{ sample(); loop(); });
}

function sample(){
  const t=performance.now()/1000;
  if(video.readyState<2){ draw(t); return; }
  gctx.drawImage(video,0,0,40,30);
  const d=gctx.getImageData(10,7,20,16).data; // 中央部分だけ使う
  let r=0,g=0,b=0; const n=d.length/4;
  for(let i=0;i<d.length;i+=4){ r+=d[i]; g+=d[i+1]; b+=d[i+2]; }
  r/=n; g/=n; b/=n;
  const finger = r>60 && r>g*1.3 && r>b*1.3;  // 指で覆うと赤一色になる
  last={r,g,b,finger};
  fpsCount++; if(t-fpsT>=1){ fps=fpsCount/(t-fpsT); fpsCount=0; fpsT=t; }

  if(finger){
    fingerLostAt=null;
    if(fingerSince==null){ fingerSince=t; core.reset(); channel = r<240?'r':'g'; } // 赤が飽和していたら緑で測る
    const beat=core.push(t, channel==='r'?r:g);
    if(beat && state!=='nofinger') onBeat();
  }else{
    if(fingerSince!=null && fingerLostAt==null) fingerLostAt=t;
    if(fingerLostAt!=null && t-fingerLostAt>0.6){ fingerSince=null; fingerLostAt=null; core.reset(); }
  }
  step(t, finger || (fingerLostAt!=null));
  draw(t);
}

function step(t,fingerOn){
  const bpm=core.bpm();
  if(state==='analyzing'){ if(t-stateT>=1.5) showResult(t); return; } // 解析中の「ため」。指が離れても結果は出す
  if(!fingerOn){
    if(state!=='nofinger'){
      setState('nofinger',t); setBar(null); setQ(false);
      setGuide(baseline?'指が離れました。もう一度覆うと続きから測れます':'指が離れました。もう一度覆ってください',true);
    }
    $('bpm').textContent='--'; return;
  }
  $('bpm').textContent = bpm?Math.round(bpm):'--';
  if(baseline && bpm){ const dlt=bpm-baseline; $('delta').textContent=`基準 ${Math.round(baseline)}  ／  変化 ${dlt>=0?'+':''}${dlt.toFixed(1)}`; }

  switch(state){
    case 'nofinger':
      setState('warmup',t); setGuide('そのまま動かさずに…（脈を探しています）'); break;
    case 'warmup':
      setBar((t-stateT)/WARM_SEC);
      if(t-stateT>=WARM_SEC){
        if(baseline){ setState('ready',t); setBar(null); setGuide('準備OK。質問を読み上げてから「嘘発見器」か「ドキドキ度」を押してください'); setQ(true); }
        else { setState('baseline',t); setGuide('落ち着いた状態を測っています（10秒）。深呼吸して楽に'); }
      }
      break;
    case 'baseline':{
      const el=t-stateT; setBar(Math.min(1,el/BASE_SEC));
      if(el>=BASE_SEC){
        const ib=core.ibisSince(stateT);
        if(ib.length>=6){ baseline=60/median(ib); setState('ready',t); setBar(null); setQ(true);
          setGuide('基準が取れました。「嘘発見器」か「ドキドキ度」を選んでください'); }
        else if(el>=BASE_SEC*2){ setState('baseline',t); setGuide('うまく脈が取れません。押さえる強さを少し弱めてみてください',true); }
      }
      break;}
    case 'question':{
      const el=t-qStart; setBar(Math.min(1,el/qDur));
      const left=Math.ceil(qDur-el);
      setGuide((qMode==='lie'?'答えてください':'見つめ合ってください')+`　残り ${Math.max(0,left)} 秒`);
      if(el>=qDur) finishQuestion(t);
      break;}
  }
}

// ==RESULT-CORE==
// 心拍の変化 → 判定・一言。カメラに依存しないので単体で検証できる。
const LIE_TIERS=[
  {min:85,stamp:'真っ黒',lines:['心臓が大騒ぎしています','これは追及が必要です','動揺が針を振り切りました']},
  {min:60,stamp:'怪しい',lines:['口は落ち着いてても、心臓は正直でした','何か隠してる…かも？','この質問、もう一回聞いてみましょう']},
  {min:30,stamp:'グレー',lines:['ちょっと揺れました。何か思い当たる？','心臓が一瞬だけ反応しました','ほぼ本音。でも少しだけ盛った？']},
  {min:0, stamp:'シロ', lines:['動揺なし。この答えは信じてよさそう','心臓まで落ち着いています。本音っぽい','まっすぐな答え。逆に怖いくらい']},
];
const DOKI_TIERS=[
  {min:25,stamp:'限界突破',level:'バンジージャンプ直前レベル',lines:['測定史上まれに見るドキドキ','今日いちばんの記録かも']},
  {min:15,stamp:'バクバク',level:'告白の返事待ちレベル',lines:['心臓の音が聞こえてきそう','落ち着いて、深呼吸して']},
  {min:10,stamp:'ドキドキ',level:'初デートの待ち合わせ5分前レベル',lines:['これは完全にドキドキしてます','目が合うたびに上がってます']},
  {min:6, stamp:'ドキッ',  level:'好きな人からLINEが来たレベル',lines:['しっかりドキッとしてます','通知を待っている時の心臓です']},
  {min:3, stamp:'ちょいドキ',level:'エレベーターで上司と二人きりレベル',lines:['ほんのり反応あり','照れ隠し、バレてます']},
  {min:-1e9,stamp:'平常心',level:'お昼寝前レベル',lines:['余裕のある大人の心拍です','まだまだ本気を出していない？']},
];
const pick=a=>a[Math.floor(Math.random()*a.length)];

// 質問中の拍から、平均・最高（3拍ずつの中央値）・最高の時刻・グラフ用の点を出す
function windowStats(ibis,times,t0,base){
  const pts=[]; ibis.forEach((v,i)=>{ if(times[i]>=t0) pts.push({x:times[i]-t0,y:60/v}); });
  if(pts.length<3) return null;
  const sm=pts.map((p,i)=>({x:p.x,y:median(pts.slice(Math.max(0,i-1),i+2).map(q=>q.y))}));
  let pk=sm[0]; for(const p of sm) if(p.y>pk.y) pk=p;
  const avg=60/median(pts.map(p=>60/p.y));
  return {avg,peak:pk.y,peakAt:pk.x,pts:sm,dAvg:avg-base,dPeak:pk.y-base};
}
function judgeLie(st){
  const s=0.6*st.dPeak+0.4*st.dAvg;                       // 上がり幅（bpm）
  const score=Math.round(Math.max(3,Math.min(97,100/(1+Math.exp(-(s-4)/1.8)))));
  if(st.dAvg<-1.5 && st.dPeak<1) return {score,stamp:'大物',line:'質問されて逆に落ち着いた…大物か、慣れているか'};
  const tier=LIE_TIERS.find(x=>score>=x.min);
  return {score,stamp:tier.stamp,line:pick(tier.lines)};
}
function judgeDoki(st,base){
  const pct=((0.5*st.peak+0.5*st.avg)-base)/base*100;
  const tier=DOKI_TIERS.find(x=>pct>=x.min);
  return {score:Math.max(0,Math.round(pct)),stamp:tier.stamp,level:tier.level,line:pick(tier.lines)};
}
// ==/RESULT-CORE==

let qMode='lie', qDur=7, pending=null;
function askQuestion(mode){
  if(state!=='ready') return;
  qMode=mode; qDur=mode==='lie'?7:10;
  qStart=performance.now()/1000; setState('question',qStart); setQ(false);
  $('result').style.display='none';
}

function finishQuestion(t){
  const st=windowStats(core.ibis,core.ibiTimes,qStart,baseline);
  if(!st){ setState('ready',t); setBar(null); setQ(true); setGuide('心臓が隠れました。指をそのままにして、もう一度どうぞ',true); return; }
  pending=st; setState('analyzing',t); setBar(null); setGuide('解析中…');
}

function showResult(t){
  const st=pending, lie=qMode==='lie';
  const j=lie?judgeLie(st):judgeDoki(st,baseline);
  $('rTitle').textContent=lie?'鑑 定 書':'ド キ ド キ 鑑 定';
  $('rLabel').textContent=lie?'怪しい度':'ドキドキ度';
  $('rScore').textContent=j.score;
  $('rLevel').textContent=lie?'':j.level;
  $('rComment').textContent=j.line;
  const sgn=v=>(v>=0?'+':'')+v.toFixed(0);
  $('rEvidence').textContent=`落ち着いた心拍 ${Math.round(baseline)} → 最高 ${Math.round(st.peak)}（${st.peakAt.toFixed(1)}秒目で ${sgn(st.dPeak)}）`;
  drawGraph(st);
  const stp=$('stamp'); stp.textContent=j.stamp; stp.classList.remove('hit'); $('result').style.display='block'; void stp.offsetWidth; stp.classList.add('hit');
  if(ac){ const w=ac.currentTime+0.02; thump(w,60,1.0); }
  if(navigator.vibrate) navigator.vibrate([80,60,40]);
  $('result').scrollIntoView({behavior:'smooth',block:'center'});
  setState('ready',t); setQ(true);
  setGuide(lie?'次の質問も「嘘発見器」で。交代するなら「基準を測り直す」':'もう一度、または相手と交代してどうぞ');
}

function drawGraph(st){
  const W=300,H=96,pad=8, xs=x=>pad+x/qDur*(W-2*pad);
  const ys=[baseline,...st.pts.map(p=>p.y)], lo=Math.min(...ys)-3, hi=Math.max(...ys)+3;
  const y=v=>H-14-(v-lo)/(hi-lo)*(H-28);
  const line=st.pts.map(p=>`${xs(p.x).toFixed(1)},${y(p.y).toFixed(1)}`).join(' ');
  $('rGraph').innerHTML=
    `<line x1="${pad}" x2="${W-pad}" y1="${y(baseline)}" y2="${y(baseline)}" stroke="#999" stroke-dasharray="3 3"/>`+
    `<text x="${W-pad}" y="${y(baseline)-3}" font-size="9" text-anchor="end" fill="#999">落ち着いた心拍</text>`+
    `<polyline points="${line}" fill="none" stroke="#1b1b1b" stroke-width="1.6"/>`+
    `<circle cx="${xs(st.peakAt)}" cy="${y(st.peak)}" r="4" fill="#b3261e"/>`+
    `<text x="${Math.min(W-40,Math.max(30,xs(st.peakAt)))}" y="${Math.max(10,y(st.peak)-7)}" font-size="10" text-anchor="middle" fill="#b3261e">ここ</text>`+
    `<text x="${pad}" y="${H-2}" font-size="9" fill="#999">0秒</text><text x="${W-pad}" y="${H-2}" font-size="9" text-anchor="end" fill="#999">${qDur}秒</text>`;
}

function setQ(on){ $('lieBtn').disabled=!on; $('dokiBtn').disabled=!on; }

function resetBaseline(){
  baseline=null; $('delta').textContent=''; $('result').style.display='none'; setQ(false);
  if(state!=='nofinger'&&state!=='idle'){ setState('baseline',performance.now()/1000); setGuide('落ち着いた状態を測っています（10秒）。深呼吸して楽に'); }
}

// ---------- 心音・振動 ----------
function thump(when,f0,vol){
  const o=ac.createOscillator(), g=ac.createGain();
  o.type='triangle'; o.frequency.setValueAtTime(f0,when); o.frequency.exponentialRampToValueAtTime(f0*0.55,when+0.12);
  g.gain.setValueAtTime(0.0001,when); g.gain.exponentialRampToValueAtTime(vol,when+0.012); g.gain.exponentialRampToValueAtTime(0.0001,when+0.15);
  o.connect(g).connect(ac.destination); o.start(when); o.stop(when+0.17);
}
function onBeat(){
  if(soundOn && ac){ const w=ac.currentTime+0.01; thump(w,95,0.7); thump(w+0.14,80,0.4); }
  if(navigator.vibrate) navigator.vibrate(35); // Androidのみ（iPhoneは非対応）
}

// ---------- 波形の描画 ----------
function fit(){ const dpr=window.devicePixelRatio||1; cv.width=cv.clientWidth*dpr; cv.height=cv.clientHeight*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
function draw(t){
  const W=cv.clientWidth, H=cv.clientHeight, span=5;
  ctx.fillStyle='#03060a'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(95,245,208,.07)'; ctx.lineWidth=1;
  for(let x=0;x<W;x+=W/10){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=0;y<H;y+=H/5){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  const mid=H/2, amp=core.amp||1, X=tt=>W-(t-tt)/span*W, Y=s=>mid-s/amp*H*0.36;
  ctx.save(); ctx.strokeStyle='#5ff5d0'; ctx.lineWidth=2; ctx.shadowColor='#5ff5d0'; ctx.shadowBlur=12;
  ctx.beginPath();
  if(core.sig.length>1 && state!=='nofinger'){ core.sig.forEach((p,i)=>{ const x=X(p.t),y=Y(p.s); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); }
  else { ctx.moveTo(0,mid); ctx.lineTo(W,mid); }
  ctx.stroke(); ctx.restore();
  ctx.fillStyle='#fff';
  for(const b of core.beats){ if(t-b.t<span && b.ok){ ctx.beginPath(); ctx.arc(X(b.t),10,2.5,0,7); ctx.fill(); } }
  $('debug').textContent=
`状態: ${state}   fps: ${fps.toFixed(0)}
ライト: ${track?(torchOn?'点灯':'点灯できない端末'):'-'}   指: ${last.finger?'あり':'なし'}   使う色: ${channel}
明るさ R ${last.r.toFixed(0)} / G ${last.g.toFixed(0)} / B ${last.b.toFixed(0)}
脈の大きさ: ${core.amp.toFixed(2)}   安定度: ${(core.quality()*100).toFixed(0)}%
採用した拍: ${core.ibis.length}   直近の間隔: ${core.ibis.slice(-4).map(v=>v.toFixed(2)).join(' ')}`;
}

// ---------- ボタン ----------
$('startBtn').onclick=start;
$('lieBtn').onclick=()=>askQuestion('lie');
$('dokiBtn').onclick=()=>askQuestion('doki');
$('resetBtn').onclick=resetBaseline;
$('soundBtn').onclick=()=>{ soundOn=!soundOn; $('soundBtn').textContent='心音：'+(soundOn?'ON':'OFF'); if(ac) ac.resume(); };
document.addEventListener('visibilitychange',()=>{ if(document.hidden && running) stop(); });
window.addEventListener('resize',fit);
fit(); draw(0);
</script>
</body>
