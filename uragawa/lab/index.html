<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>計測ラボ｜ウラガワ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#05070a;color:#cfefff;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
body{padding:max(12px,env(safe-area-inset-top)) 12px 24px;transition:background .3s}
body.light{background:#fff;color:#123}
h1{font-size:12px;font-weight:400;letter-spacing:.5em;text-align:center;color:rgba(207,239,255,.5);margin-bottom:8px}
#wrap{position:relative;width:min(100%,46vh);aspect-ratio:3/4;margin:0 auto;border-radius:18px;overflow:hidden;background:#000}
body.light #wrap{width:min(70%,34vh)}
video,#ov{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
video{opacity:.45}
#q{margin:8px auto;text-align:center;font-size:13px;padding:6px 10px;border-radius:999px;width:fit-content}
#q.ok{background:rgba(60,255,160,.15);color:#3cffa0}
#q.ng{background:rgba(255,120,120,.15);color:#ff8a8a}
.row{display:flex;gap:8px;justify-content:center;margin:8px 0}
button{font:inherit;font-size:13px;padding:10px 14px;border-radius:999px;border:1px solid #3cf0ff;background:transparent;color:#3cf0ff}
button.main{background:#3cf0ff;color:#05070a;font-weight:600}
button:disabled{opacity:.35}
body.light button{border-color:#0a6b78;color:#0a6b78}
body.light button.main{background:#0a6b78;color:#fff}
#cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:520px;margin:0 auto}
.card{border:1px solid rgba(60,240,255,.2);border-radius:12px;padding:8px 10px}
body.light .card{border-color:#cde}
.card .k{font-size:11px;color:rgba(207,239,255,.55)}
body.light .card .k{color:#678}
.card .v{font-size:22px;font-variant-numeric:tabular-nums;margin-top:2px}
.card .s{font-size:11px;color:rgba(207,239,255,.6);margin-top:2px;font-variant-numeric:tabular-nums}
body.light .card .s{color:#567}
.card.wide{grid-column:1/3}
canvas.spark{width:100%;height:36px;display:block;margin-top:4px}
#msg{text-align:center;font-size:12px;color:rgba(207,239,255,.6);margin:6px 0;min-height:1.2em}
small{display:block;text-align:center;font-size:10px;color:rgba(207,239,255,.4);margin-top:12px;line-height:1.6}
</style>
</head>
<body>
<h1>計 測 ラ ボ</h1>
<div id="wrap"><video id="video" playsinline muted autoplay></video><canvas id="ov"></canvas></div>
<div id="q" class="ng">準備中…</div>
<div class="row">
  <button id="light">ライト</button>
  <button id="base" class="main" disabled>基準を取る（10秒）</button>
  <button id="copy" disabled>数値をコピー</button>
</div>
<div id="msg"></div>
<div id="cards">
  <div class="card"><div class="k">頬の赤み</div><div class="v" id="vRed">-</div><div class="s" id="sRed"></div></div>
  <div class="card"><div class="k">頬−額の赤み差</div><div class="v" id="vDiff">-</div><div class="s" id="sDiff"></div></div>
  <div class="card"><div class="k">目の開き（EAR）</div><div class="v" id="vEar">-</div><div class="s" id="sEar"></div></div>
  <div class="card"><div class="k">まばたき（直近30秒）</div><div class="v" id="vBlink">-</div><div class="s" id="sBlink"></div></div>
  <div class="card"><div class="k">笑顔（口／目）</div><div class="v" id="vSmile">-</div><div class="s" id="sSmile"></div></div>
  <div class="card"><div class="k">顔の向き・明るさ</div><div class="v" id="vPose">-</div><div class="s" id="sPose"></div></div>
  <div class="card wide"><div class="k">顔からの心拍</div><div class="v" id="vHr">-</div><div class="s" id="sHr"></div><canvas class="spark" id="spark"></canvas></div>
</div>
<small>映像は保存も送信もしません。数値は遊び用の推定で、医療目的ではありません。<br>頬・額の水色の枠が、色を読んでいる場所です。</small>

<script type="module">
import { createFaceEngine, FaceLandmarker, C } from "../lib/face-engine.js";
import { DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const $ = id => document.getElementById(id);
const video = $("video"), ov = $("ov"), octx = ov.getContext("2d");
let eng, draw, baseEnd = null, sparkVals = [];
const f3 = v => v == null ? "-" : v.toFixed(3);
const sgn = (v, d = 3) => v == null ? "" : (v >= 0 ? "+" : "") + v.toFixed(d);

async function init() {
  try {
    const st = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 720 }, height: { ideal: 960 } }, audio: false });
    video.srcObject = st; await video.play();
  } catch (e) { $("q").textContent = "カメラを使えません（カメラを許可してください）"; return; }
  $("q").textContent = "AIを読み込み中…";
  try { eng = await createFaceEngine(video); }
  catch (e) { $("q").textContent = "AIの読み込みに失敗：" + e.message; return; }
  ov.width = video.videoWidth; ov.height = video.videoHeight;
  draw = new DrawingUtils(octx);
  $("base").disabled = false; $("copy").disabled = false;
  $("msg").textContent = `読み込み完了（${eng.delegate}）。まず正面を向いて10秒「基準を取る」と、その後の変化が出ます`;
  requestAnimationFrame(loop);
}

let lastUi = 0;
function loop() {
  const f = eng.process();
  if (f) render(f);
  requestAnimationFrame(loop);
}

function render(f) {
  octx.clearRect(0, 0, ov.width, ov.height);
  const q = $("q");
  q.className = f.quality.ok ? "ok" : "ng";
  q.textContent = f.quality.ok ? "読み取りOK" : f.quality.reason;
  if (!f.face) return;
  draw.drawConnectors(f.lm, FaceLandmarker.FACE_LANDMARKS_TESSELATION, { color: "rgba(60,240,255,.22)", lineWidth: .6 });
  draw.drawConnectors(f.lm, FaceLandmarker.FACE_LANDMARKS_LEFT_EYE, { color: f.blinkClosed ? "#ff6b8a" : "#3cf0ff", lineWidth: 1.6 });
  draw.drawConnectors(f.lm, FaceLandmarker.FACE_LANDMARKS_RIGHT_EYE, { color: f.blinkClosed ? "#ff6b8a" : "#3cf0ff", lineWidth: 1.6 });
  const sx = ov.width / f.hulls.W, sy = ov.height / f.hulls.H;
  octx.strokeStyle = "rgba(60,240,255,.9)"; octx.lineWidth = 2;
  for (const h of [f.hulls.cheekL, f.hulls.cheekR, f.hulls.forehead]) {
    octx.beginPath(); h.forEach(([x, y], i) => i ? octx.lineTo(x * sx, y * sy) : octx.moveTo(x * sx, y * sy)); octx.closePath(); octx.stroke();
  }

  if (f.t - lastUi < 250) return;   // 数字の表示は1秒に4回
  lastUi = f.t;
  const s = eng.summarize(f.t - 30000, f.t);
  const d = eng.baseline ? eng.diff(eng.summarize(Math.max(baseEnd, f.t - 10000), f.t)) : null;

  $("vRed").textContent = f3(f.red.cheek);
  $("sRed").textContent = d ? `基準から ${sgn(d.redCheek)}` : "基準なし";
  $("vDiff").textContent = f3(f.red.diff);
  $("sDiff").textContent = d ? `基準から ${sgn(d.redDiff)}` : "照明の色に強い指標";
  $("vEar").textContent = f3(f.ear);
  $("sEar").textContent = `自分の普段比 ${f.eyeRel == null ? "-" : Math.round(f.eyeRel * 100) + "%"}` + (d ? `　基準から ${sgn(d.ear)}` : "");
  $("vBlink").textContent = s.blinkPerMin == null ? "-" : `${Math.round(s.blinkPerMin)}回/分`;
  $("sBlink").textContent = `長さ ${s.blinkMs == null ? "-" : Math.round(s.blinkMs) + "ms"}` + (d && d.blinkPerMin != null ? `　基準から ${sgn(d.blinkPerMin, 0)}回/分` : "");
  $("vSmile").textContent = `${f.smile.mouth.toFixed(2)} / ${f.smile.eyes.toFixed(2)}`;
  $("sSmile").textContent = f.smile.smiling ? `本気度 ${Math.round(f.smile.genuine * 100)}%` + (f.smile.genuine < 0.5 ? "（口だけ）" : "（目まで笑っている）") : "笑っていない";
  $("vPose").textContent = `${Math.round(f.pose.yaw)}° / ${Math.round(f.pose.pitch)}°`;
  $("sPose").textContent = `明るさ ${f.light == null ? "-" : Math.round(f.light)}　テカリ ${Math.round(f.spec * 100)}%`;
  const h = f.hr;
  if (!h || h.warming) { $("vHr").textContent = "-"; $("sHr").textContent = `心拍を探しています（${h ? Math.round(h.span / 1000) : 0}/8秒　正面で静止）`; }
  else {
    $("vHr").textContent = h.bpm ? `${Math.round(h.bpm)} 拍/分` : "-";
    $("sHr").textContent = `確からしさ ${h.raw ? Math.round(h.raw.confidence * 100) : 0}%（38%以上で採用）` + (d && d.hr != null ? `　基準から ${sgn(d.hr, 0)}` : "");
  }
  sparkVals.push(h && h.raw ? h.raw.confidence : 0); if (sparkVals.length > 120) sparkVals.shift();
  spark();
}

function spark() {
  const c = $("spark"), x = c.getContext("2d");
  c.width = c.clientWidth * 2; c.height = 72;
  x.clearRect(0, 0, c.width, c.height);
  x.strokeStyle = "rgba(255,255,255,.15)"; x.beginPath(); const yT = c.height * (1 - 0.38); x.moveTo(0, yT); x.lineTo(c.width, yT); x.stroke();
  x.strokeStyle = "#3cf0ff"; x.lineWidth = 2; x.beginPath();
  sparkVals.forEach((v, i) => { const px = i / 119 * c.width, py = c.height * (1 - v); i ? x.lineTo(px, py) : x.moveTo(px, py); });
  x.stroke();
}

$("light").onclick = () => document.body.classList.toggle("light");
$("base").onclick = async () => {
  $("base").disabled = true; $("msg").textContent = "基準を取っています… 正面を向いて自然に";
  const b = await eng.startBaseline(10000);
  baseEnd = performance.now();
  $("base").disabled = false;
  $("msg").textContent = `基準OK（読めた割合 ${Math.round(b.okRatio * 100)}%）。ここからの変化を表示します`;
};
$("copy").onclick = async () => {
  const now = performance.now();
  const data = { at: new Date().toISOString(), engine: eng.delegate, baseline: eng.baseline, last30s: eng.summarize(now - 30000, now) };
  data.diff = eng.diff(data.last30s);
  const txt = JSON.stringify(data, (k, v) => typeof v === "number" ? +v.toFixed(4) : v, 1);
  try { await navigator.clipboard.writeText(txt); $("msg").textContent = "コピーしました。チャットに貼ってください"; }
  catch { $("msg").textContent = "コピーできませんでした"; console.log(txt); }
};
init();
</script>
<script src="../lib/nav.js"></script>
</body>
</html>
