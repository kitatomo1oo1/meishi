<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ウラガワ｜手相 試作</title>
<style>
  :root { --bg:#05080c; --line:#3ff2ff; --fg:#d8f6ff; --dim:#5d7a88; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; }
  header { padding:12px 16px 4px; font-size:13px; letter-spacing:.2em; color:var(--line); }
  .note { padding:0 16px; font-size:11px; color:var(--dim); line-height:1.6; }
  #stage { position:relative; width:100%; max-width:560px; margin:8px auto; aspect-ratio:3/4; background:#000; overflow:hidden; }
  #stage video { display:none; }
  #view { width:100%; height:100%; display:block; }
  #status { position:absolute; left:0; right:0; bottom:10px; text-align:center; font-size:14px; text-shadow:0 0 6px #000; }
  .bar { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; padding:8px 12px; }
  button,label.btn { background:#0c1a22; color:var(--fg); border:1px solid #1f4a5a; border-radius:999px; padding:10px 16px; font-size:14px; }
  button:disabled { opacity:.35; }
  button.main { border-color:var(--line); color:var(--line); box-shadow:0 0 12px #3ff2ff55; }
  input[type=file] { display:none; }
  #result { display:none; max-width:560px; margin:0 auto 40px; padding:0 12px; }
  #palm { width:100%; aspect-ratio:1; display:block; background:#000; border:1px solid #12313d; }
  table { width:100%; border-collapse:collapse; margin-top:10px; font-size:13px; }
  td { padding:6px 4px; border-bottom:1px solid #12313d; }
  td:first-child { color:var(--dim); width:38%; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:middle; }
  #debug { display:none; width:100%; aspect-ratio:1; margin-top:10px; image-rendering:pixelated; border:1px solid #12313d; }
  #cert { display:none; background:#f4f1ea; padding:16px 12px 40px; }
  .paper { max-width:520px; margin:0 auto; background:#fff; color:#1c1c1c; padding:28px 24px 20px;
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif CJK JP",serif;
    border:1px solid #d9d2c3; box-shadow:0 2px 18px rgba(0,0,0,.08); }
  .c-head { text-align:center; font-size:22px; letter-spacing:.35em; border-bottom:1px solid #1c1c1c; padding-bottom:10px; }
  .c-no { text-align:right; font-size:11px; color:#777; margin-top:6px; letter-spacing:.1em; }
  #cHand { width:72%; display:block; margin:10px auto 4px; }
  .c-type { text-align:center; font-size:13px; color:#555; margin-bottom:6px; }
  .c-type b { font-size:20px; color:#1c1c1c; font-weight:600; }
  .paper h3 { font-size:13px; letter-spacing:.3em; font-weight:600; margin:18px 0 6px; padding-left:8px; border-left:3px solid #b08d4a; }
  .paper p, .paper li { font-size:14px; line-height:1.85; margin:4px 0; }
  .paper ul { padding-left:1.2em; margin:4px 0; }
  .ln { font-size:12px; color:#b08d4a; margin-right:6px; letter-spacing:.1em; }
  .big { font-size:17px; }
  .big em { font-style:normal; font-size:22px; color:#8a2b2b; }
  .c-foot { font-size:10px !important; color:#888; border-top:1px solid #ddd; margin-top:18px !important; padding-top:8px; line-height:1.6 !important; }
  /* u-home-pad */ header{padding-left:84px}
</style>
</head>
<body>
<header>PALM SCAN — 試作</header>
<p class="note">手のひらの線を画像処理で浮かび上がらせる試作です。写真は端末の中だけで処理し、保存も送信もしません（最初に手の位置を読むAIのデータだけ読み込みます）。</p>

<div id="stage">
  <video id="video" playsinline muted></video>
  <canvas id="view"></canvas>
  <div id="status">準備中…</div>
</div>
<div class="bar">
  <button id="btnCam" class="main">カメラ開始</button>
  <button id="btnTorch" disabled>ライト</button>

</div>

<div id="result">
  <canvas id="palm" width="512" height="512"></canvas>
  <table id="table"></table>
  <div class="bar">
    <button id="btnCert" class="main" disabled>鑑定書を見る</button>
    <button id="btnReplay">もう一度光らせる</button>
    <button id="btnDebug">処理の途中を見る</button>

  </div>
  <canvas id="debug" width="256" height="256"></canvas>
</div>

<div id="cert">
  <div class="paper">
    <div class="c-head">手 相 鑑 定 書</div>
    <div class="c-no" id="cNo"></div>
    <canvas id="cHand" width="600" height="600"></canvas>
    <div class="c-type" id="cType"></div>
    <h3>珍しさ</h3><div id="cRare"></div>
    <h3>性格</h3><div id="cTraits"></div>
    <h3>予言</h3><div id="cProphecy"></div>
    <h3>今日の運勢</h3><div id="cToday"></div>
    <p class="c-foot">この鑑定は手のひらの線の画像から推定した遊びの占いです。写真は保存・送信していません（同じ手を見分けるための数値だけ、この端末に残ります）。</p>
  </div>
  <div class="bar"><button id="btnCertBack">戻る</button></div>
</div>

<script>
// ===== 手相の線を浮かび上がらせる処理（画像処理のみ・外部ライブラリなし） =====
// 入力: 手のひらを正規化した S×S のグレースケール（0-255）と、手のひら領域のマスク
// 出力: 線の強さマップ・検出した線の候補・4本の線への割り当て・特徴量

function boxBlur(src, w, h, r) {
  const tmp = new Float32Array(w * h), out = new Float32Array(w * h);
  const n = 2 * r + 1;
  for (let y = 0; y < h; y++) {
    let s = 0;
    for (let k = -r; k <= r; k++) s += src[y * w + Math.min(w - 1, Math.max(0, k))];
    for (let x = 0; x < w; x++) {
      tmp[y * w + x] = s / n;
      const a = Math.min(w - 1, x + r + 1), b = Math.max(0, x - r);
      s += src[y * w + a] - src[y * w + b];
    }
  }
  for (let x = 0; x < w; x++) {
    let s = 0;
    for (let k = -r; k <= r; k++) s += tmp[Math.min(h - 1, Math.max(0, k)) * w + x];
    for (let y = 0; y < h; y++) {
      out[y * w + x] = s / n;
      const a = Math.min(h - 1, y + r + 1), b = Math.max(0, y - r);
      s += tmp[a * w + x] - tmp[b * w + x];
    }
  }
  return out;
}

function rankFilter(src, w, h, r, useMax) {
  const tmp = new Float32Array(w * h), out = new Float32Array(w * h);
  const f = useMax ? Math.max : Math.min;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let v = src[y * w + x];
    for (let k = -r; k <= r; k++) {
      const xx = x + k; if (xx < 0 || xx >= w) continue;
      v = f(v, src[y * w + xx]);
    }
    tmp[y * w + x] = v;
  }
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let v = tmp[y * w + x];
    for (let k = -r; k <= r; k++) {
      const yy = y + k; if (yy < 0 || yy >= h) continue;
      v = f(v, tmp[yy * w + x]);
    }
    out[y * w + x] = v;
  }
  return out;
}

// 各画素の線の向き（構造テンソル）。0=横向きの線、±π/2=縦向きの線
function orientation(m, w, h) {
  const gxx = new Float32Array(w * h), gyy = new Float32Array(w * h), gxy = new Float32Array(w * h);
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const i = y * w + x, gx = m[i + 1] - m[i - 1], gy = m[i + w] - m[i - w];
    gxx[i] = gx * gx; gyy[i] = gy * gy; gxy[i] = gx * gy;
  }
  const r = Math.max(2, Math.round(w / 64));
  const a = boxBlur(gxx, w, h, r), b = boxBlur(gyy, w, h, r), c = boxBlur(gxy, w, h, r);
  const o = new Float32Array(w * h);
  for (let i = 0; i < o.length; i++) {
    let t = 0.5 * Math.atan2(2 * c[i], a[i] - b[i]) + Math.PI / 2;   // 勾配に直交＝線の向き
    if (t > Math.PI / 2) t -= Math.PI;
    o[i] = t;
  }
  return o;
}

function percentile(arr, mask, p) {
  const vals = [];
  for (let i = 0; i < arr.length; i++) if (mask[i]) vals.push(arr[i]);
  if (!vals.length) return 0;
  vals.sort((a, b) => a - b);
  return vals[Math.min(vals.length - 1, Math.floor(vals.length * p))];
}

// 多角形の内側を1にしたマスク
function polygonMask(poly, S) {
  const m = new Uint8Array(S * S);
  for (let y = 0; y < S; y++) {
    const xs = [];
    for (let i = 0; i < poly.length; i++) {
      const [x1, y1] = poly[i], [x2, y2] = poly[(i + 1) % poly.length];
      if ((y1 <= y && y2 > y) || (y2 <= y && y1 > y)) xs.push(x1 + (y - y1) / (y2 - y1) * (x2 - x1));
    }
    xs.sort((a, b) => a - b);
    for (let i = 0; i + 1 < xs.length; i += 2)
      for (let x = Math.max(0, Math.ceil(xs[i])); x <= Math.min(S - 1, Math.floor(xs[i + 1])); x++) m[y * S + x] = 1;
  }
  return m;
}

function components(bin, w, h) {
  const lab = new Int32Array(w * h).fill(-1), comps = [];
  const stack = [];
  for (let i = 0; i < w * h; i++) {
    if (!bin[i] || lab[i] >= 0) continue;
    const id = comps.length, px = [];
    lab[i] = id; stack.push(i);
    while (stack.length) {
      const p = stack.pop(); px.push(p);
      const x = p % w, y = (p / w) | 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const xx = x + dx, yy = y + dy;
        if (xx < 0 || yy < 0 || xx >= w || yy >= h) continue;
        const q = yy * w + xx;
        if (bin[q] && lab[q] < 0) { lab[q] = id; stack.push(q); }
      }
    }
    comps.push({ id, px });
  }
  return { lab, comps };
}

// 線の形を表す値（重心・向き・長さ・細長さ）
function shapeOf(c, w, bh, fixedStrength) {
  let sx = 0, sy = 0, ss = 0;
  for (const p of c.px) { sx += p % w; sy += (p / w) | 0; if (bh) ss += bh[p]; }
  const n = c.px.length, cx = sx / n, cy = sy / n;
  let xx = 0, yy = 0, xy = 0;
  for (const p of c.px) { const dx = p % w - cx, dy = ((p / w) | 0) - cy; xx += dx * dx; yy += dy * dy; xy += dx * dy; }
  xx /= n; yy /= n; xy /= n;
  const tr = xx + yy, det = xx * yy - xy * xy;
  const l1 = tr / 2 + Math.sqrt(Math.max(0, tr * tr / 4 - det)), l2 = Math.max(1e-6, tr - l1);
  const angle = 0.5 * Math.atan2(2 * xy, xx - yy); // 0=横, ±π/2=縦
  // 端から端の長さ（主軸方向の広がり）
  const ux = Math.cos(angle), uy = Math.sin(angle);
  let mn = 1e9, mx = -1e9;
  for (const p of c.px) { const t = (p % w - cx) * ux + (((p / w) | 0) - cy) * uy; mn = Math.min(mn, t); mx = Math.max(mx, t); }
  return Object.assign(c, { n, cx, cy, angle, span: mx - mn, elong: Math.sqrt(l1 / l2), strength: bh ? ss / n : fixedStrength });
}

// ===== 関節の点から「この線はこのあたりを通るはず」という道筋を手ごとに作る =====
// a: 正規化座標での関節の点 {0,1,2,5,9,13,17}（MediaPipeの番号）
const lerp = (p, q, t) => [p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t];
const add = (p, dx, dy) => [p[0] + dx, p[1] + dy];
function palmTemplates(a, S) {
  const A = lerp(a[5], a[2], 0.30);                   // 親指と人差し指の間（生命線・知能線の起点）
  const B = lerp(a[0], a[1], 0.15);                   // 手首の親指寄り（生命線の終点）
  const C = add(lerp(A, B, 0.45), 0.20 * S, 0);       // 生命線のふくらみ
  // 生命線・知能線・感情線の道筋は、人が線を塗った正解データ14枚の平均位置から作った（手のひらをそろえた座標、幅=1）
  const D = {"life": [[0.229, 0.22], [0.314, 0.3], [0.399, 0.38], [0.452, 0.46], [0.483, 0.54], [0.483, 0.62], [0.483, 0.7], [0.47, 0.78], [0.459, 0.86]], "head": [[0.22, 0.217], [0.3, 0.224], [0.38, 0.244], [0.46, 0.268], [0.54, 0.3], [0.62, 0.343], [0.7, 0.383], [0.78, 0.402], [0.86, 0.427]], "heart": [[0.38, 0.054], [0.46, 0.103], [0.54, 0.167], [0.62, 0.2], [0.7, 0.224], [0.78, 0.246], [0.86, 0.256], [0.94, 0.264], [0.98, 0.252]]};
  const sc = p => [p[0] * S, p[1] * S];
  return {
    life:  D.life.map(sc),
    head:  D.head.map(sc),
    heart: D.heart.map(sc),
    fate:  [lerp(a[0], a[17], 0.10), add(lerp(a[9], a[13], 0.5), 0, 0.35 * S)],
  };
}
// 手のひらの範囲（親指そのものは外す）
function palmPolygon(a, S) {
  const edge = add(lerp(a[17], a[0], 0.35), 0.10 * S, 0);
  const up = p => add(p, 0, -0.05 * S);   // 感情線は指の付け根の近くを通るので、範囲を少し上まで広げる
  let poly = [lerp(a[5], a[2], 0.35), up(a[5]), up(a[9]), up(a[13]), up(a[17]), edge, [0.80 * S, 0.97 * S], [a[0][0], Math.min(S - 1, a[0][1] + 0.02 * S)], a[1]];
  const cx = poly.reduce((s, p) => s + p[0], 0) / poly.length, cy = poly.reduce((s, p) => s + p[1], 0) / poly.length;
  return poly.map(([x, y]) => [cx + (x - cx) * 0.97, cy + (y - cy) * 0.97]);
}
function samplePath(path, n) {          // 道筋を等間隔の点に
  const seg = [], out = [];
  let total = 0;
  for (let i = 1; i < path.length; i++) { const d = Math.hypot(path[i][0] - path[i-1][0], path[i][1] - path[i-1][1]); seg.push(d); total += d; }
  for (let k = 0; k <= n; k++) {
    let t = total * k / n, i = 0;
    while (i < seg.length - 1 && t > seg[i]) { t -= seg[i]; i++; }
    out.push(lerp(path[i], path[i + 1], Math.min(1, t / seg[i])));
  }
  return { pts: out, total };
}
// 候補の線を道筋に割り当てる（1本の線が途切れていても、同じ道筋に沿う候補はまとめる）
function classifyByTemplate(cands, S, a) {
  const T = palmTemplates(a, S), tol = 0.07 * S, N = 40;
  const tp = {}; for (const k in T) tp[k] = samplePath(T[k], N);
  const fit = (c, k) => {
    const { pts } = tp[k], hit = new Uint8Array(N + 1);
    let near = 0;
    for (let j = 0; j < c.px.length; j += 2) {
      const x = c.px[j] % S, y = (c.px[j] / S) | 0;
      let bd = Infinity, bi = 0;
      for (let i = 0; i <= N; i++) { const d = Math.hypot(x - pts[i][0], y - pts[i][1]); if (d < bd) { bd = d; bi = i; } }
      if (bd <= tol) { near++; hit[bi] = 1; }
    }
    const frac = near / Math.ceil(c.px.length / 2);
    return { frac, hit };
  };
  const lines = { heart: null, head: null, life: null, fate: null };
  const best = cands.map(c => {
    let bk = null, bs = 0, bf = null;
    for (const k in T) {
      const f = fit(c, k), cover = f.hit.reduce((s, v) => s + v, 0) / (N + 1);
      const sc = f.frac >= 0.6 ? f.frac * f.frac * cover * c.strength : 0;
      if (sc > bs) { bs = sc; bk = k; bf = f; }
    }
    return { c, k:bk, f:bf };
  });
  const parts = { heart: [], head: [], life: [], fate: [] };
  for (const b of best) if (b.k) parts[b.k].push(b);
  for (const k in parts) {
    if (!parts[k].length) continue;
    // 同じ道筋の候補をまとめて1本の線にする（重なる画素は1回だけ）
    const px = new Set(), hit = new Uint8Array(N + 1);
    let ss = 0, n = 0;
    for (const { c, f } of parts[k]) { for (const p of c.px) px.add(p); f.hit.forEach((v, i) => { if (v) hit[i] = 1; }); ss += c.strength * c.n; n += c.n; }
    // 長さ＝道筋のうち線が乗っている範囲（最初と最後の間）
    let lo = hit.indexOf(1), hi = hit.lastIndexOf(1);
    const merged = shapeOf({ id: k, px: [...px] }, S, null, ss / n);
    merged.span = (hi - lo) / N * tp[k].total;
    merged.coverage = hit.reduce((s, v) => s + v, 0) / (N + 1);
    merged.parts = parts[k].length;
    if (merged.span >= 0.12 * S) lines[k] = merged;
  }
  return lines;
}

// ===== 道筋に沿って、実際のシワをなぞる（動的計画法） =====
// 道筋の左右 ±W の帯の中で、「線の強さが大きく、向きが道筋に沿い、急に曲がらない」なぞり方を探す。
function traceLine(map, ori, S, path, W, mask) {
  const N = 60, { pts } = samplePath(path, N);
  const W0 = Array.isArray(W) ? W[0] : W, W1 = Array.isArray(W) ? W[1] : W;   // [根元の幅, 終わりの幅]
  const U = Math.round(Math.max(W0, W1)), M = 2 * U + 1;
  const val = new Float32Array((N + 1) * M), pos = [];
  for (let i = 0; i <= N; i++) {
    const p = pts[i], q = pts[Math.min(N, i + 1)], o = pts[Math.max(0, i - 1)];
    let tx = q[0] - o[0], ty = q[1] - o[1]; const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
    const nx = -ty, ny = tx, ta = Math.atan2(ty, tx);
    const row = [];
    const Ui = W0 + (W1 - W0) * i / N;
    for (let u = -U; u <= U; u++) {
      const x = Math.round(p[0] + nx * u), y = Math.round(p[1] + ny * u);
      let v = 0;
      if (Math.abs(u) <= Ui && x >= 0 && y >= 0 && x < S && y < S && mask[y * S + x]) {
        const d = Math.cos(ori[y * S + x] - ta);                   // 線の向きが道筋と合うほど高く
        v = map[y * S + x] * (0.25 + 0.75 * d * d);
      }
      val[i * M + u + U] = v; row.push([x, y]);
    }
    pos.push(row);
  }
  // 累積スコア：前の点から横に1つ動くごとに少し減点
  const acc = new Float32Array((N + 1) * M), from = new Int16Array((N + 1) * M);
  for (let u = 0; u < M; u++) acc[u] = val[u] - 0.002 * Math.abs(u - U);
  for (let i = 1; i <= N; i++) for (let u = 0; u < M; u++) {
    let b = -1e9, bu = u;
    for (let du = -2; du <= 2; du++) {
      const w = u + du; if (w < 0 || w >= M) continue;
      const s = acc[(i - 1) * M + w] - 0.03 * Math.abs(du);
      if (s > b) { b = s; bu = w; }
    }
    acc[i * M + u] = b + val[i * M + u]; from[i * M + u] = bu;
  }
  let u = 0; for (let k = 1; k < M; k++) if (acc[N * M + k] > acc[N * M + u]) u = k;
  const route = [], resp = [];
  for (let i = N; i >= 0; i--) { route.unshift(pos[i][u]); resp.unshift(val[i * M + u]); u = from[i * M + u]; }
  // 線が実際に乗っている区間（弱い所が少し途切れても1本とみなす）を取り出す
  const sm = resp.map((_, i) => { let s = 0, n = 0; for (let k = i - 2; k <= i + 2; k++) if (k >= 0 && k <= N) { s += resp[k]; n++; } return s / n; });
  const thr = 0.16;
  let best = [0, -1], cur = -1, gap = 0;
  for (let i = 0; i <= N; i++) {
    if (sm[i] >= thr) { if (cur < 0) cur = i; gap = 0; if (i - cur > best[1] - best[0]) best = [cur, i]; }
    else if (cur >= 0 && ++gap > 6) { cur = -1; gap = 0; }
  }
  if (best[1] < best[0]) return null;
  const seg = route.slice(best[0], best[1] + 1);
  let len = 0; for (let i = 1; i < seg.length; i++) len += Math.hypot(seg[i][0] - seg[i-1][0], seg[i][1] - seg[i-1][1]);
  let st = 0; for (let i = best[0]; i <= best[1]; i++) st += sm[i];
  return { route: seg, span: len, strength: st / (best[1] - best[0] + 1) };
}

function palmLines(gray, S, mask, opt = {}) {
  const r = opt.radius || Math.round(S / 48);          // 線の太さに合わせた範囲
  const g = new Float32Array(gray.length);
  for (let i = 0; i < gray.length; i++) g[i] = gray[i];
  // 1) 照明のむらを取る（大きくぼかした明るさで割る）
  const lowR = Math.round(S / 10);
  const low = boxBlur(g, S, S, lowR);
  for (let i = 0; i < g.length; i++) g[i] = 128 * g[i] / Math.max(8, low[i]);
  const gs = boxBlur(g, S, S, 1);
  // 2) ブラックハット：周りより暗い細い溝＝手相の線
  const closed = rankFilter(rankFilter(gs, S, S, r, true), S, S, r, false);
  const bh = new Float32Array(g.length);
  for (let i = 0; i < g.length; i++) bh[i] = mask[i] ? Math.max(0, closed[i] - gs[i]) : 0;
  const bhs = boxBlur(bh, S, S, 1);
  const top = percentile(bhs, mask, 0.995) || 1;
  for (let i = 0; i < bhs.length; i++) bhs[i] = Math.min(1, bhs[i] / top);
  // 学習済みモデルの「線らしさ」（0〜1）があれば混ぜる。モデルが線を出せない手では画像処理だけになる
  if (opt.extMap) {
    const w = opt.extWeight == null ? 0.7 : opt.extWeight;
    for (let i = 0; i < bhs.length; i++) bhs[i] = mask[i] ? w * opt.extMap[i] + (1 - w) * bhs[i] : 0;

  const hi = percentile(bhs, mask, opt.hi || 0.93), lo = percentile(bhs, mask, opt.lo || 0.88);

  for (let i = 0; i < weak.length; i++) weak[i] = mask[i] && bhs[i] >= lo ? 1 : 0;

  const ori = orientation(bhs, S, S);
  const cands = [];
  for (const group of ['h', 'v']) {
    const sub = new Uint8Array(S * S);
    for (let i = 0; i < sub.length; i++) {
      if (!weak[i]) continue;
      const a = Math.abs(ori[i]) * 180 / Math.PI;      // 0=横, 90=縦
      if (group === 'h' ? a <= 55 : a >= 35) sub[i] = 1;   // 斜め(35〜55°)は両方に入れる
    }
    const { comps } = components(sub, S, S);
    for (const c of comps) {
      let strong = 0;
      for (const p of c.px) if (bhs[p] >= hi) strong++;
      if (strong < 4) continue;
      shapeOf(c, S, bhs);
      if (c.span < S * 0.06 || c.elong < 2.5) continue;   // 短い・丸いものはシワや毛穴として捨てる
      c.group = group; c.id = group + c.id;
      cands.push(c);

  }
  cands.sort((a, b) => b.span * b.strength - a.span * a.strength);
  const kept = cands.slice(0, 24);
  const lines = { heart: null, head: null, life: null, fate: null };
  if (opt.anchors) {
    const T = palmTemplates(opt.anchors, S);
    if (opt.templates) for (const k in opt.templates) T[k] = opt.templates[k].map(([x, y]) => [x * S, y * S]);
    const W = opt.widths ? Object.fromEntries(Object.entries(opt.widths).map(([k, v]) => [k, Array.isArray(v) ? v.map(z => z * S) : v * S])) : { life: 0.08 * S, head: 0.07 * S, heart: 0.07 * S, fate: 0.07 * S };
    const work = Float32Array.from(bhs);              // なぞった線の周りは、次の線の候補から外す
    const R = Math.max(3, Math.round(S / 64));
    for (const k of ['life', 'heart', 'head', 'fate']) {
      const tr = traceLine(work, ori, S, T[k], W[k], mask);
      if (!tr || tr.span < 0.12 * S) continue;
      // 表示用に、なぞった道を2画素の太さで塗る
      const px = new Set();
      for (let i = 1; i < tr.route.length; i++) {
        const [x0, y0] = tr.route[i - 1], [x1, y1] = tr.route[i], n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0)));
        for (let j = 0; j <= n; j++) { const x = Math.round(x0 + (x1 - x0) * j / n), y = Math.round(y0 + (y1 - y0) * j / n);
          for (const [dx, dy] of [[0,0],[1,0],[0,1]]) if (x + dx < S && y + dy < S) px.add((y + dy) * S + x + dx); }
      }
      for (const [x, y] of tr.route) for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++) {

      }
      const c = { id: k, px: [...px], route: tr.route };
      shapeOf(c, S, null, tr.strength);
      c.span = tr.span;
      c.ratio = tr.span / samplePath(T[k], 10).total;   // 道筋に対してどれだけ伸びているか
      const t0 = T[k][0], t1 = T[k][T[k].length - 1];
      c.tmplAngle = Math.atan2(Math.abs(t1[1] - t0[1]), Math.abs(t1[0] - t0[0]));
      lines[k] = c;
    }
  }
  // 4) 特徴量（鑑定に使う）
  const feat = {};
  for (const k of Object.keys(lines)) {
    const c = lines[k];
    let ang = c ? c.angle : 0;
    if (c && c.route) {   // 左から右へ向けた角度（下がるほどプラス）。縦の線は上から下へ
      let p = c.route[0], q = c.route[c.route.length - 1];
      if (k === 'life' || k === 'fate' ? p[1] > q[1] : p[0] > q[0]) [p, q] = [q, p];
      ang = Math.atan2(q[1] - p[1], q[0] - p[0]);
    }
    feat[k] = c ? { length: +(c.ratio != null ? c.ratio : c.span / S).toFixed(3), strength: +c.strength.toFixed(3), angle: +(ang * 180 / Math.PI).toFixed(1),
      bend: c.tmplAngle != null ? +((ang - c.tmplAngle) * 180 / Math.PI).toFixed(1) : 0 } : null;   // bend: 道筋より下がっているほどプラス
  }
  // ますかけ線の推定：手のひらを横切る1本の長い横線
  // ますかけ線：知能線と感情線の道筋をまたいで、1本の長い横線が手のひらを横切る
  const longH = kept.filter(c => c.group === 'h' && c.span > S * 0.50 && c.elong > 8);
  feat.masukake = longH.length >= 1 && !lines.heart && !!lines.head;
  return { map: bhs, cands: kept, lines, feat };
}


// ===== 鑑定ルール：線の特徴 → 区分 → 鑑定文・数字の予言 =====
// 同じ手なら同じ結果：測った値を少数の区分にまとめ、その区分の組み合わせだけで文章と数字を決める。

// 区分のしきい値：公開されている手のひら写真22枚で測った値の 1/3・2/3 の位置（各区分がほぼ同じ人数になる）
const READING_CUTS = {
  len: { life: [0.97, 1.04], head: [0.85, 0.94], heart: [0.79, 0.83] },   // 短い / 普通 / 長い（道筋に対して伸びている割合）
  str: { life: [0.47, 0.60], head: [0.51, 0.58], heart: [0.60, 0.73] },   // 細い / 普通 / 濃い
  slope: [2.1, 4.0],                                                       // 知能線の傾き（道筋との差・度）
  fateClear: 0.39,                                                         // 運命線「はっきり」の濃さ
  ratio: [0.97, 1.00],                                                     // 人差し指÷薬指

const pick3 = (v, cuts, names) => v < cuts[0] ? names[0] : v < cuts[1] ? names[1] : names[2];

function readingBuckets(m) {   // m: 測った値（複数フレームの中央値）
  const LEN = ['short', 'mid', 'long'], STR = ['thin', 'mid', 'deep'];
  const b = {
    lifeLen:  m.life  ? pick3(m.life.length,  READING_CUTS.len.life, LEN) : 'mid',
    lifeStr:  m.life  ? pick3(m.life.strength, READING_CUTS.str.life, STR) : 'mid',
    headLen:  m.head  ? pick3(m.head.length,  READING_CUTS.len.head, LEN) : 'mid',
    headSlope: m.head ? pick3(m.head.bend || 0, READING_CUTS.slope, ['flat', 'gentle', 'steep']) : 'gentle',
    heartLen: m.heart ? pick3(m.heart.length, READING_CUTS.len.heart, LEN) : 'mid',
    heartStr: m.heart ? pick3(m.heart.strength, READING_CUTS.str.heart, STR) : 'mid',
    fate:     m.fate  ? (m.fate.strength >= READING_CUTS.fateClear ? 'clear' : 'thin') : 'none',
    masukake: m.masukake ? 'yes' : 'no',
    ratio:    pick3(m.ratio, READING_CUTS.ratio, ['low', 'mid', 'high']),

// 区分の選択肢の数（「◯通り中の1つ」の計算用）
const READING_DIMS = [
  ['lifeLen', ['short', 'mid', 'long']], ['lifeStr', ['thin', 'mid', 'deep']],
  ['headLen', ['short', 'mid', 'long']], ['headSlope', ['flat', 'gentle', 'steep']],
  ['heartLen', ['short', 'mid', 'long']], ['heartStr', ['thin', 'mid', 'deep']],
  ['fate', ['none', 'thin', 'clear']], ['masukake', ['no', 'yes']], ['ratio', ['low', 'mid', 'high']],

function fnv1a(str) {

    traits.push({ line: '感情線', text: choose(T.heart.len[b.heartLen]) + (T.heart.str[b.heartStr] ? '。' + T.heart.str[b.heartStr] : '') });

  // 数字の予言：年は「今年から何年後か」を区分で決める（同じ手なら同じ年）
  const Y = now.getFullYear();

  const slopeShift = { flat: 0, gentle: 1, steep: 2 }[b.headSlope];
  const loveYear = Y + 1 + (heartShift + Math.floor(r() * 3)) % 4;
  const moneyYear = Y + 1 + (slopeShift + Math.floor(r() * 3)) % 4;
  const prophecy = [
    `モテ期のピークは ${loveYear}年の${choose(T.seasons)}`,
    `金運が大きく上がるのは ${moneyYear}年 ${1 + Math.floor(r() * 12)}月`,
    `あなたを助けてくれる人の誕生月は ${1 + Math.floor(r() * 12)}月`,
  ];

  const day = `${Y}-${now.getMonth() + 1}-${now.getDate()}`;
  const rd = rng(fnv1a(key + '#' + day));
  const today = {
    text: T.today[Math.floor(rd() * T.today.length)],
    number: 1 + Math.floor(rd() * 9),
    color: T.colors[Math.floor(rd() * T.colors.length)],

// 複数回測った値の中央値（撮るたびのブレを減らす）
function medianMeasure(list) {
  const med = a => { const s = a.slice().sort((x, y) => x - y); return s[Math.floor(s.length / 2)]; };
  const out = {};
  for (const k of ['life', 'head', 'heart', 'fate']) {
    const got = list.map(m => m[k]).filter(Boolean);
    out[k] = got.length * 2 > list.length   // 半分より多い回で見つかった線だけ「ある」とする
      ? { length: med(got.map(g => g.length)), strength: med(got.map(g => g.strength)), angle: med(got.map(g => g.angle || 0)), bend: med(got.map(g => g.bend || 0)) }
      : null;
  }
  out.masukake = list.filter(m => m.masukake).length * 2 > list.length;
  out.ratio = med(list.map(m => m.ratio));
  return out;
}

// ===== 同じ手を覚えておく（測った数値だけ。写真は残さない） =====
// 区分の境目付近の手は、撮るたびに区分が入れ替わることがある。
// そこで端末の中に「数値と区分」を覚え、近い数値の手が来たら前回と同じ区分を使う。
const MATCH_TOL = 0.07;
function handVector(m) {
  const L = k => m[k] ? [m[k].length, m[k].strength] : [-1, -1];
  return [...L('life'), ...L('head'), m.head ? (m.head.bend + 60) / 120 : -1, ...L('heart'), m.fate ? m.fate.strength : -1, m.ratio * 5, m.masukake ? 1 : 0];
}
function findSameHand(store, vec) {
  let best = null, bestD = Infinity;
  for (const e of store) {
    let d = 0;
    for (let i = 0; i < vec.length; i++) {
      if ((vec[i] < 0) !== (e.vec[i] < 0)) { d = Infinity; break; }   // 線のある・なしが違えば別人
      d = Math.max(d, Math.abs(vec[i] - e.vec[i]));
    }
    if (d < bestD) { bestD = d; best = e; }
  }
  return bestD <= MATCH_TOL ? best : null;
}
function readingWithMemory(measured, store, now = new Date()) {
  const vec = handVector(measured);
  const hit = findSameHand(store, vec);
  if (hit) { hit.n = (hit.n || 1) + 1; hit.t = now.getTime(); return { reading: makeReading(measured, now, hit.buckets), again: hit.n }; }
  const reading = makeReading(measured, now);
  store.push({ vec, buckets: reading.buckets, t: now.getTime(), n: 1 });
  store.sort((a, b) => b.t - a.t); store.length = Math.min(store.length, 300);   // 新しい300人分まで
  return { reading, again: 1 };
}

  await ready;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' }, width:{ ideal:1280 }, height:{ ideal:960 } }, audio:false });
  } catch (e) { $('status').textContent = 'カメラが使えません：' + e.message; return; }
  video.srcObject = stream; await video.play();
  track = stream.getVideoTracks()[0];
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  $('btnTorch').disabled = !caps.torch;
  if (!caps.torch) $('btnTorch').textContent = 'ライト（この端末は不可）';
  $('btnCam').disabled = true; live = true; showResult(false);
  requestAnimationFrame(loop);
};
$('btnTorch').onclick = async () => {
  torchOn = !torchOn;
  try { await track.applyConstraints({ advanced:[{ torch:torchOn }] }); } catch (e) { torchOn = false; }
  $('btnTorch').classList.toggle('main', torchOn);
};

function fitCover(cw, ch, iw, ih) {   // 画面いっぱいに映すための位置
  const s = Math.max(cw / iw, ch / ih);
  return { s, ox:(cw - iw * s) / 2, oy:(ch - ih * s) / 2 };
}

function loop() {
  if (!live) return;
  const r = view.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  view.width = r.width * dpr; view.height = r.height * dpr;
  const vw = video.videoWidth, vh = video.videoHeight;
  if (vw) {
    const f = fitCover(view.width, view.height, vw, vh);
    vctx.globalAlpha = 0.55; vctx.drawImage(video, f.ox, f.oy, vw * f.s, vh * f.s); vctx.globalAlpha = 1;
    const res = videoLM.detectForVideo(video, performance.now());
    const lm = res.landmarks && res.landmarks[0];
    if (lm) {
      const pts = lm.map(p => [f.ox + p.x * vw * f.s, f.oy + p.y * vh * f.s]);
      drawSkeleton(vctx, pts, dpr);
      const size = Math.hypot(pts[0][0] - pts[9][0], pts[0][1] - pts[9][1]) / Math.min(view.width, view.height);
      lastHand = lm;
      // 手全体（指先・手首まで）がカメラの画面に入っていないと、手のひらのそろえ方がずれる
      const inFrame = lm.every(p => p.x > 0.02 && p.x < 0.98 && p.y > 0.02 && p.y < 0.98);
      if (!inFrame) { steady = 0; $('status').textContent = '少し離して、指先から手首まで全部映してください'; }
      else if (size < 0.22) { steady = 0; $('status').textContent = 'もう少し近づけて'; }
      else { steady++; $('status').textContent = steady > 20 ? 'OK「読み取る」を押してください' : 'そのまま…'; }
    } else { lastHand = null; steady = 0; $('status').textContent = '手のひらを映してください（指を上に）'; }
    $('btnShot').disabled = !(lastHand && steady > 20);
  }
  requestAnimationFrame(loop);
}

function drawSkeleton(ctx, pts, dpr) {
  ctx.save();
  ctx.strokeStyle = '#3ff2ff'; ctx.lineWidth = 2 * dpr; ctx.shadowColor = '#3ff2ff'; ctx.shadowBlur = 10 * dpr;
  for (const [a, b] of BONES) { ctx.beginPath(); ctx.moveTo(...pts[a]); ctx.lineTo(...pts[b]); ctx.stroke(); }
  ctx.fillStyle = '#e8ffff';
  for (const p of pts) { ctx.beginPath(); ctx.arc(p[0], p[1], 3.5 * dpr, 0, 7); ctx.fill(); }
  ctx.restore();
}

$('btnShot').onclick = async () => {
  $('btnShot').disabled = true;
  const frames = [];
  for (let i = 0; i < 5; i++) {      // 約1秒で5回測り、ブレを中央値でならす
    $('status').textContent = `計測中… ${i + 1}/5`;
    const c = document.createElement('canvas');
    c.width = video.videoWidth; c.height = video.videoHeight;
    c.getContext('2d').drawImage(video, 0, 0);
    frames.push(measure(c));
    await sleep(120);
  }
  runReading(frames);
};

$('file').onchange = async e => {
  const file = e.target.files[0]; if (!file) return;
  await ready;
  const img = new Image(); img.src = URL.createObjectURL(file); await img.decode();
  const c = document.createElement('canvas');
  const k = Math.min(1, 1600 / Math.max(img.width, img.height));
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(img.src); e.target.value = '';
  $('status').textContent = '解析中…';
  await sleep(30);
  runReading([measure(c)]);
};

// ---------- 解析 ----------
function solveAffine(src, dst) {     // 3点の対応から 変換行列[a,b,c,d,e,f] を求める
  const [[x1,y1],[x2,y2],[x3,y3]] = src, det = x1*(y2-y3) - y1*(x2-x3) + (x2*y3 - x3*y2);
  const sol = (u1,u2,u3) => [
    (u1*(y2-y3) - y1*(u2-u3) + (u2*y3 - u3*y2)) / det,
    (x1*(u2-u3) - u1*(x2-x3) + (x2*u3 - x3*u2)) / det,
    (x1*(y2*u3-y3*u2) - y1*(x2*u3-x3*u2) + u1*(x2*y3-x3*y2)) / det ];
  const [a, c, e] = sol(dst[0][0], dst[1][0], dst[2][0]);
  const [b, d, f] = sol(dst[0][1], dst[1][1], dst[2][1]);
  return [a, b, c, d, e, f];
}
const apply = (m, [x, y]) => [m[0]*x + m[2]*y + m[4], m[1]*x + m[3]*y + m[5]];

function hull(pts) {
  const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cr = (o, a, b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
  const lo = [], up = [];
  for (const q of p) { while (lo.length > 1 && cr(lo[lo.length-2], lo[lo.length-1], q) <= 0) lo.pop(); lo.push(q); }
  for (const q of p.reverse()) { while (up.length > 1 && cr(up[up.length-2], up[up.length-1], q) <= 0) up.pop(); up.push(q); }
  return lo.slice(0, -1).concat(up.slice(0, -1));
}

function fingerRatio(lm, w, h) {     // 人差し指 ÷ 薬指（付け根の関節から指先まで）
  const len = ids => ids.slice(1).reduce((s, id, i) => s + Math.hypot((lm[id].x - lm[ids[i]].x) * w, (lm[id].y - lm[ids[i]].y) * h), 0);
  return len([5,6,7,8]) / len([13,14,15,16]);
}

function measure(canvas) {          // 1枚の画像から線を測る（表示はしない）
  const res = imageLM.detect(canvas);
  const lm = res.landmarks && res.landmarks[0];
  if (!lm) return null;
  if (!lm.every(p => p.x > 0.01 && p.x < 0.99 && p.y > 0.01 && p.y < 0.99)) return { outOfFrame:true };
  const W = canvas.width, H = canvas.height, P = i => [lm[i].x * W, lm[i].y * H];
  // 人差し指の付け根→左上、小指の付け根→右上、手首→下 に合わせる（右手でも左手でも親指が左に来る）
  const m = solveAffine([P(5), P(17), P(0)], [[0.25*S, 0.10*S], [0.86*S, 0.16*S], [0.52*S, 0.97*S]]);
  const pc = document.createElement('canvas'); pc.width = pc.height = S;
  const pctx = pc.getContext('2d', { willReadFrequently:true });
  pctx.fillStyle = '#000'; pctx.fillRect(0, 0, S, S);
  pctx.setTransform(...m); pctx.drawImage(canvas, 0, 0); pctx.setTransform(1, 0, 0, 1, 0, 0);
  const rgba = pctx.getImageData(0, 0, S, S).data;
  const gray = new Uint8Array(S * S);
  for (let i = 0; i < gray.length; i++) gray[i] = Math.round(0.25 * rgba[i*4] + 0.6 * rgba[i*4+1] + 0.15 * rgba[i*4+2]);
  // 関節の点を正規化した座標に。線の道筋と手のひらの範囲（親指は外す）をここから作る
  const anchors = {}; for (const i of [0,1,2,5,9,13,17]) anchors[i] = apply(m, P(i));
  const poly = palmPolygon(anchors, S);
  const mask = polygonMask(poly, S);
  const t0 = performance.now();
  const out = palmLines(gray, S, mask, { anchors });
  out.ms = Math.round(performance.now() - t0);
  out.ratio = fingerRatio(lm, W, H);
  out.photo = pc; out.poly = poly;
  return out;
}

const sleep = ms => new Promise(r => setTimeout(r, ms));
function loadStore() { try { return JSON.parse(localStorage.getItem('palm-hands-v5') || '[]'); } catch (e) { return []; } }
function saveStore(st) { try { localStorage.setItem('palm-hands-v5', JSON.stringify(st)); } catch (e) {} }

async function runReading(frames) {  // frames: 測った結果の配列（1〜5回分）
  const out = frames.filter(f => f && f.outOfFrame);
  const ok = frames.filter(f => f && !f.outOfFrame);
  if (!ok.length) {
    $('status').textContent = out.length ? '手が画面からはみ出しています。少し離して、指先から手首まで全部映してください' : '手が見つかりませんでした。指を上にして、手のひら全体を映してください';
    if (stream) { live = true; requestAnimationFrame(loop); }
    return;
  }
  const meas = medianMeasure(ok.map(o => ({ ...o.feat, ratio:o.ratio })));
  // 表示に使うのは、中央値にいちばん近い回
  const dist = o => ['life','head','heart','fate'].reduce((d, k) => d + (o.feat[k] && meas[k] ? Math.abs(o.feat[k].length - meas[k].length) : (!!o.feat[k] !== !!meas[k]) * 1), 0);
  const shown = ok.slice().sort((a, b) => dist(a) - dist(b))[0];
  const store = loadStore();
  const { reading, again } = readingWithMemory(meas, store);
  saveStore(store);
  lastResult = { ...shown, meas, reading, again, frames:ok.length };
  live = false;
  $('status').textContent = '';
  showResult(true);
  renderTable(lastResult);
  await animate(lastResult);
  $('btnCert').disabled = false;
}

// ---------- 結果の表示 ----------
function showResult(on) { $('result').style.display = on ? 'block' : 'none'; if (on) $('result').scrollIntoView({ behavior:'smooth' }); }

function level(v, cuts, words) { return words[cuts.findIndex(c => v < c) < 0 ? words.length - 1 : cuts.findIndex(c => v < c)]; }

function renderTable(o) {
  const rows = LINE_INFO.map(({ key, name, color }) => {
    const f = o.meas[key];
    const txt = f ? `長さ ${f.length}／濃さ ${f.strength}／角度 ${f.angle}°` : '見つからず';
    return `<tr><td><span class="dot" style="background:${color}"></span>${name}</td><td>${txt}</td></tr>`;
  });
  rows.push(`<tr><td>ますかけ線（推定）</td><td>${o.meas.masukake ? 'あり' : 'なし'}</td></tr>`);
  rows.push(`<tr><td>人差し指÷薬指</td><td>${o.meas.ratio.toFixed(3)}</td></tr>`);
  rows.push(`<tr><td>線の候補数／処理時間</td><td>${o.cands.length}本／${o.ms}ms（${o.frames}回測定）</td></tr>`);
  rows.push(`<tr><td>区分</td><td style="font-size:11px">${o.reading.key}</td></tr>`);
  $('table').innerHTML = rows.join('');
}

function animate(o) {
  const c = $('palm'), ctx = c.getContext('2d'), k = c.width / S;
  // 下地：手のひら写真を暗くして青みに
  const base = document.createElement('canvas'); base.width = base.height = S;
  const b = base.getContext('2d'); b.drawImage(o.photo, 0, 0);
  const id = b.getImageData(0, 0, S, S);
  for (let i = 0; i < id.data.length; i += 4) { const g = 0.25*id.data[i] + 0.6*id.data[i+1] + 0.15*id.data[i+2]; id.data[i] = g*0.18; id.data[i+1] = g*0.32; id.data[i+2] = g*0.40; }
  b.putImageData(id, 0, 0);
  // 線ごとに、端から順に点が並ぶようにしておく
  const seq = LINE_INFO.filter(l => o.lines[l.key]).map(l => {
    const cmp = o.lines[l.key], ux = Math.cos(cmp.angle), uy = Math.sin(cmp.angle);
    const px = cmp.route ? cmp.px : cmp.px.slice().sort((p, q) => ((p % S) * ux + ((p / S) | 0) * uy) - ((q % S) * ux + ((q / S) | 0) * uy));   // なぞった順に光らせる
    return { ...l, px };
  });
  const layer = document.createElement('canvas'); layer.width = layer.height = S;
  const lc = layer.getContext('2d');
  const per = 900, gap = 250, start = performance.now();
  function frame(now) {
    const t = now - start;
    ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
    ctx.drawImage(base, 0, 0, c.width, c.height);
    lc.clearRect(0, 0, S, S);
    seq.forEach((l, i) => {
      const p = Math.max(0, Math.min(1, (t - i * (per + gap)) / per));
      const n = Math.floor(l.px.length * p);
      lc.fillStyle = l.color;
      for (let j = 0; j < n; j++) { const q = l.px[j]; lc.fillRect(q % S, (q / S) | 0, 1, 1); }
    });
    ctx.imageSmoothingEnabled = true;
    ctx.globalCompositeOperation = 'lighter';
    ctx.filter = `blur(${6 * k / 2}px)`; ctx.drawImage(layer, 0, 0, c.width, c.height); ctx.drawImage(layer, 0, 0, c.width, c.height);
    ctx.filter = 'none'; ctx.drawImage(layer, 0, 0, c.width, c.height);
    if (t < seq.length * (per + gap)) requestAnimationFrame(frame); else done();
  }
  let done; const fin = new Promise(r => done = r);
  requestAnimationFrame(frame);
  // 途中経過（線の強さマップ）
  const d = $('debug').getContext('2d'), im = d.createImageData(S, S);
  for (let i = 0; i < S * S; i++) { const v = Math.round(o.map[i] * 255); im.data[i*4] = im.data[i*4+1] = im.data[i*4+2] = v; im.data[i*4+3] = 255; }
  d.putImageData(im, 0, 0);
  return fin;
}

$('btnReplay').onclick = () => lastResult && animate(lastResult);
$('btnCert').onclick = () => { renderCert(lastResult); $('result').style.display = 'none'; $('cert').style.display = 'block'; window.scrollTo({ top:$('cert').offsetTop }); };
$('btnCertBack').onclick = () => { $('cert').style.display = 'none'; showResult(true); };

const esc = t => String(t).replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' })[c]);
// 数字を大きく見せる
const bigNum = t => esc(t).replace(/(\d{4}年|\d{1,2}月|の[春夏秋冬])/g, '<em>$1</em>');

function renderCert(o) {
  const r = o.reading;
  $('cNo').textContent = '鑑定番号 ' + r.seed.toString(16).toUpperCase().padStart(8, '0') + (o.again > 1 ? `　（${o.again}回目の鑑定・前回と同じ手）` : '');
  $('cType').innerHTML = `あなたの手相の型は <b>${r.total.toLocaleString()}</b> 通り中の <b>No.${r.no.toLocaleString()}</b>`;
  $('cRare').innerHTML = '<ul>' + r.rare.map(t => `<li>${esc(t)}</li>`).join('') + '</ul>';
  $('cTraits').innerHTML = r.traits.map(t => `<p><span class="ln">${t.line}</span>${esc(t.text)}</p>`).join('');
  $('cProphecy').innerHTML = r.prophecy.map(t => `<p class="big">${bigNum(t)}</p>`).join('');
  $('cToday').innerHTML = `<p>${esc(r.today.text)}</p><p>ラッキーナンバー ${r.today.number}　ラッキーカラー ${esc(r.today.color)}</p>`;
  // 白地に、本人の手の線を光らせて描く
  const c = $('cHand'), ctx = c.getContext('2d'), k = c.width / S;
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.strokeStyle = '#cfc6b4'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 5]);
  ctx.beginPath(); o.poly.forEach(([x, y], i) => i ? ctx.lineTo(x * k, y * k) : ctx.moveTo(x * k, y * k)); ctx.closePath(); ctx.stroke(); ctx.setLineDash([]);
  const layer = document.createElement('canvas'); layer.width = layer.height = S;
  const lc = layer.getContext('2d');
  for (const l of LINE_INFO) {
    const cmp = o.lines[l.key]; if (!cmp) continue;
    lc.fillStyle = l.color;
    for (const p of cmp.px) lc.fillRect(p % S, (p / S) | 0, 1, 1);
  }
  ctx.save(); ctx.filter = `blur(${5 * k / 2}px)`; ctx.globalAlpha = 0.9; ctx.drawImage(layer, 0, 0, c.width, c.height); ctx.drawImage(layer, 0, 0, c.width, c.height); ctx.restore();
  ctx.drawImage(layer, 0, 0, c.width, c.height);
}
$('btnDebug').onclick = () => { const d = $('debug'); d.style.display = d.style.display === 'block' ? 'none' : 'block'; };
$('btnBack').onclick = () => { showResult(false); if (stream) { live = true; requestAnimationFrame(loop); } window.scrollTo({ top:0, behavior:'smooth' }); };
</script>
